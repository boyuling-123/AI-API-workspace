m/multimodal/image-api/algo-api/comfyui）→ **v4 两种（custom / comfyui）**。\n- 内置目标：v3 `ModelConfig` 写死 → **v4 删除 ModelConfig，改 `config/presetTargets.ts`（TargetConfig + preset=true）**。\n- 执行入口：v3 `/api/chat` + `/api/run-api` + `/api/run-image` → **v4 合并为 `/api/run-custom`**。\n- SCHEMA_VERSION：v3=2 → **v4=3**。\n- 新增（v4 独有）：统一接入表单（AI 解析 / 手动两种填法产出相同 TargetConfig）、方案 B 预置安全能力、大模型仅非流式。\n- 沿用 v3（v4 未推翻）：内容/生图模式、4 板块导航、ComfyUI 收窄形态、生图费用提示、AI 造数据、跑批与评价彻底分离、contentKind 置灰维度。\n\n---\n\n## 1. 现状盘点（复用 / 改造 / 新建）\n\n现有代码已实现 v1.2 大部分能力。按 v4 目标做映射：\n\n### 1.1 类型层 `src/types/index.ts` — 【大改造】\n- `SCHEMA_VERSION` 1 → **3**。\n- `Project.apiConfigs` → 改名 **`targetConfigs: TargetConfig[]`**。\n- 删除 `ModelConfig`（v4 删除，改 presetTargets）；删除 `ApiConfig`（合并进 `TargetConfig`）。\n- 新增 `TargetType = 'custom' | 'comfyui'`、`ContentMode`、`RunMode`、`ContentKind`。\n- 新增统一 **`TargetConfig`**（含 `requestTemplate` / `comfyui` / `source` / `preset` / `contentKind`）。\n- 新增 `GenDataRequest`。\n- `Task`：`mode` → 拆为 `contentMode` + `runMode`；`apiParamsSnapshot` → 改名 `paramSnapshot`。\n- `ResultItem.targetKind` 可保留作展示标签（语义改为按 contentKind）。\n\n### 1.2 配置层 `src/config/` — 【改造 + 新建】\n- `models.ts` — 【废弃迁移】内容迁入 `presetTargets.ts`，以 `TargetConfig(preset=true)` 形态表达；保留 `getModelImageCapability` 思路但改为读 contentKind。\n- `builtinAlgos.ts` — 【迁移】并入 presetTargets 或保留为预置算法目标来源。\n- `runtime.ts` — 【小改】补 `testRetryLimit(3)`。\n- **新建 `presetTargets.ts`** — 预置目标（至少含一个裁判目标）。\n- **新建 `capabilities.ts`** — 方案 B 安全能力清单（md5_sign/hmac_sha256/timestamp/two_step_auth/image_as_url/image_as_base64）。\n- **新建 `comfyTemplate.ts`** — ComfyUI 固定工作流模板。\n\n### 1.3 适配器层 `src/adapters/` — 【收敛改造】\n- 现有 `deepseekAdapter` / `moonshotAdapter` / `qwenAdapter` — 【废弃/合并】按 modelId 一个个写的 adapter 删掉，收敛为 **`customAdapter`（统一非流式执行）+ `comfyuiAdapter`**。\n- `anthropicCompatible.ts` — 【部分复用】图片 block 拼装、Anthropic 兼容请求逻辑可作为 customAdapter 处理某类目标时的内部能力沉淀。\n- `registry.ts` — 【改造】注册表收敛为 custom / comfyui 两类。\n- `types.ts` — 【小改】adapter 接口保持 `{outputText, outputImages[], latencyMs}` 归一化输出。\n\n### 1.4 服务层 `src/services/` — 【部分复用 + 改造】\n- 复用：`db.ts` / `draftDb.ts` / `projectIO.ts` / `projectFactory.ts`（改 version 校验到 3）、`excel.ts`、`getApiKey.ts`（签名改 `getApiKey(keyRef)`）、`runService.ts`（并发/取消/中断逻辑复用，调用入口改 run-custom）。\n- 改造：`llmClient.ts` + `apiClient.ts` + `algoClient.ts` → 合并为统一的 **`customClient.ts`（打 /api/run-custom）**；`parseDocService/Client`（产出改为 TargetConfig 草稿 + preprocess 建议）；`evaluate*` / `evalPrompt*` 基本复用（裁判改为 contentKind 含 image 的目标）。\n- 新建：`comfyuiClient.ts`（list + run）、`genDataClient.ts`、安全能力执行模块 `services/preprocess/`（实现 capabilities 里的函数）。\n\n### 1.5 后端路由 `src/app/api/` — 【合并 + 新建】\n- 合并：`chat` + `run-api` + （新生图）→ **`run-custom`**；`test-api` → **`self-test`**。\n- 改造：`parse-doc`（输出 TargetConfig 草稿）、`evaluate` / `gen-eval-prompt` 复用。\n- 新建：`comfyui/list`、`comfyui/run`、`gen-data`。\n- `mock-algo` — 测试用，可保留。\n\n### 1.6 组件层 `src/components/` — 【改造 + 新建】\n- 复用骨架：`layout/*`（AppTabs/Drawer/CollapsiblePanel）、`AppShell.tsx`、`TopToolbar.tsx`、`ImageInput.tsx`、`result/*`、`run/*`、`history/*`、`evaluation/*`。\n- 改造：`WorkspaceBody.tsx`（加 ContentMode × RunMode 两维正交切换 + 草稿隔离）、`TargetSelector.tsx`（按 contentKind 置灰）、`input/*`（生图模式输入 + LoRA/参数）。\n- 重构导航：明确 4 板块（① 跑批 ② 统一接入 ③ 结果与历史 ④ AI 评价），评价入口仅在 ③→④。\n- 新建：统一接入表单（一张表单 + AI 解析/手动两种填法）、方案 B 能力勾选 UI、ComfyUI 接入面板、AI 造数据面板、生图费用确认弹框。\n\n### 1.7 Hooks `src/hooks/` — 【复用 + 改造】\n- 复用：`useProject` / `useTaskRunner` / `useEvaluation` / `useTargetSelection` / `useTheme`。\n- 改造：`useInputDraft`（支持 ContentMode × RunMode 四套独立草稿）。\n\n---\n\n## 2. 分批实施计划\n\n沿用 v4 的三批划分，每批结束都能 `npm run dev` 跑通并自测。\n\n### 第 0 批（前置改造，新增）—— 数据模型与架构骨架迁移\n\u003e 这是 v4 统一架构的地基，必须先做，否则后续全堵。\n- 类型层迁移：`SCHEMA_VERSION=3`、`apiConfigs→targetConfigs`、删 `ModelConfig`/`ApiConfig`、新增 `TargetConfig`/`ContentMode`/`RunMode`/`ContentKind`/`GenDataRequest`、`Task.mode→contentMode+runMode`、`apiParamsSnapshot→paramSnapshot`。\n- adapter 收敛：删 deepseek/moonshot/qwen 三个，建 `customAdapter` + `comfyuiAdapter` 骨架，registry 收敛两类。\n- config：建 `presetTargets.ts`（迁移 models.ts/builtinAlgos.ts 内容）、`capabilities.ts`、`comfyTemplate.ts` 骨架；`runtime.ts` 补 `testRetryLimit`。\n- service：`getApiKey(keyRef)` 签名收敛；`projectIO` 的 version 校验改为 `\u003c3` 拒绝。\n- **产出标准**：旧能力用 presetTargets 仍能跑通文本对比（回归不退化）。\n\n### 第一批 —— 核心对比链路（用 presetTargets 跑通）\n- 4 板块导航定型（① 跑批 / ② 接入 / ③ 历史 / ④ 评价），评价入口只在 ③→④。\n- 输入区两维正交：ContentMode（text/image）× RunMode（single/batch），四套独立草稿、切换不互清。\n- 目标选择按 contentKind 置灰（文本灰掉纯 image，生图灰掉纯 text；含图纯文本目标置灰；base64+仅URL 提示）。\n- 运行：并发(1~10,默3)、试运行(仅第1条不落历史)、批量分批、超时(60s)、取消清空排队、刷新标 interrupted。\n- 生图费用提示：试运行强制弹框、批量预估「约 N 次」弹框。\n- 结果对比区（卡片/表格、多图、耗时、partial）；Excel 导出（列名唯一）；历史任务重现。\n- **产出标准**：预置目标即可跑通「文本/生图 × 单条/批量」核心对比，导出/历史/JSON(version=3) 正常。\n\n### 第二批 —— 统一接入\n- 统一接入界面：一张表单 + 两种填法（A：`/api/parse-doc` AI 解析自动填；B：手动填/改），产出相同 `TargetConfig`，全字段可改。\n- `/api/self-test`：用真实参数真实调用，测试前强制「将真实调用」提示，重试上限 3，绝不 AI 编造假数据。\n- `/api/run-custom`：统一非流式执行（preprocess 处理 → bodyTemplate 填值 → 非流式请求 → 按 outputPath 取 → 归一化）。\n- 方案 B 安全能力：`config/capabilities.ts` + `services/preprocess/` 实现，UI 只能勾选清单、绝不执行 AI 代码。\n- 大模型仅非流式（stream 恒 false；只给流式的标 unsupported）。\n- contentKind 推断确认（测试通过后按返回内容建议、用户确认）。\n- 接入状态机（unverified 黄角标 / tested_ok / tested_fail / unsupported）。\n- ComfyUI 收窄：`/api/comfyui/list`（调 /object_info 拉 checkpoint/LoRA）+ `comfyTemplate` + 三步 `/api/comfyui/run`。\n- **产出标准**：任意大模型/算法/生图文档可解析或手动接入并跑通；ComfyUI 可选模型/LoRA 出图。\n\n### 第三批 —— AI 辅助\n- AI 造数据：`/api/gen-data`（造一条/批量JSON/整张表，按 targetColumns 约束），产出可编辑后运行。\n- AI 逐条评价：`/api/gen-eval-prompt` + `/api/evaluate`（从③导入有结果 Task 才可评、范围 all/selected、base64 压缩传裁判、按 inputId 归属）。\n- **产出标准**：造数据三形式表头与选中目标列一致可直接跑；评价逐条出分(0–10)+结论。\n\n---\n\n## 3. 详细任务拆解\n\n\u003e 按批次列可勾选任务，便于跟踪。括号标注主要涉及文件。\n\n### 第 0 批\n- [ ] 改 `types/index.ts`：SCHEMA_VERSION=3、TargetConfig、ContentMode/RunMode/ContentKind、GenDataRequest、Task 字段拆分、删 ModelConfig/ApiConfig（`src/types/index.ts`）\n- [ ] 新建 `config/presetTargets.ts`，迁移 `models.ts` + `builtinAlgos.ts` 内容为 TargetConfig(preset=true)（含 ≥1 裁判目标）\n- [ ] 新建 `config/capabilities.ts`（安全能力清单）、`config/comfyTemplate.ts`（骨架）\n- [ ] 改 `config/runtime.ts` 补 `testRetryLimit`\n- [ ] adapter 收敛：建 `adapters/customAdapter.ts` + `adapters/comfyuiAdapter.ts`，改 `registry.ts`，删 deepseek/moonshot/qwen\n- [ ] 改 `services/getApiKey.ts` 为 `getApiKey(keyRef)`；`services/projectIO.ts` version\u003c3 拒绝；`projectFactory.ts` 写 version=3\n- [ ] 回归：预置目标跑通文本对比不退化\n\n### 第一批\n- [ ] 4 板块导航（`components/AppShell.tsx` + `layout/AppTabs.tsx`）\n- [ ] 输入区两维正交 + 草稿隔离（`WorkspaceBody.tsx`、`hooks/useInputDraft.ts`、`services/draftDb.ts`）\n- [ ] 目标选择按 contentKind 置灰（`TargetSelector.tsx`、`hooks/useTargetSelection.ts`）\n- [ ] 运行调度复用 + 入口改 run-custom（`services/runService.ts`、`hooks/useTaskRunner.ts`、`components/run/*`）\n- [ ] 生图费用确认弹框（试运行/批量）\n- [ ] 结果对比区按 contentKind 标签 + 多图（`components/result/*`）\n- [ ] Excel 导出列名唯一（`services/excel.ts`）\n- [ ] 历史任务重现（`components/history/*`）\n- [ ] JSON 导入导出 version=3 校验（`TopToolbar.tsx`、`projectIO.ts`）\n\n### 第二批\n- [ ] 统一接入表单（一张表 + AI解析/手动两填法）（`components/api/*`）\n- [ ] `/api/parse-doc` 输出 TargetConfig 草稿 + preprocess 建议（`app/api/parse-doc`、`services/parseDocService.ts`）\n- [ ] `/api/self-test`（真实调用 + 诊断 + 重试上限）（`app/api/self-test`，由 `test-api` 改造）\n- [ ] `/api/run-custom`（统一非流式执行）（`app/api/run-custom`，合并 chat+run-api）\n- [ ] 方案 B：`config/capabilities.ts` + `services/preprocess/*` 实现 + UI 勾选\n- [ ] contentKind 推断确认 + 接入状态机角标\n- [ ] ComfyUI：`/api/comfyui/list` + `/api/comfyui/run`（三步）+ `comfyTemplate` + 接入面板\n\n### 第三批\n- [ ] `/api/gen-data` + 造数据面板（三形式 + targetColumns 约束）（`app/api/gen-data`、`services/genDataClient.ts`）\n- [ ] AI 评价收尾：裁判改 contentKind 含 image、范围 all/selected、base64 压缩传裁判（`components/evaluation/*`、`services/evaluate*`）\n\n---\n\n## 4. 风险与关键决策点\n\n- **大改造风险**：第 0 批动数据模型（apiConfigs→targetConfigs、删 ModelConfig），波及面广。建议先做类型迁移再逐层编译修红，分文件提交，每步可回退。\n- **adapter 收敛**：现有按 modelId 的三个 adapter 删除后，预置大模型改由 customAdapter + presetTargets 的 requestTemplate 表达。需确认 DashScope Anthropic 网关请求体能用 `bodyTemplate` 通用模板表达（含图片 block），否则 customAdapter 内部要保留一条「Anthropic 兼容」分支（可复用现有 `anthropicCompatible.ts`）。\n- **方案 B 红线**：preprocess 只能勾选清单、绝不执行 AI 代码，安全函数全部平台写死在 `services/preprocess/`。\n- **SCHEMA_VERSION=3 不向下兼容**：v1.2(1)/v3(2) 旧 JSON 一律拒绝导入，不写迁移。需提前告知，避免误以为旧备份能用。\n- **ComfyUI 异步三步**：提交带 client_id → 轮询 history → /view 取图二进制转可展示，超时/连不上要明确报错。\n- **生图费用**：所有真实生图调用前必须有费用确认，避免误触烧额度。\n\n---\n\n## 5. 验收对照\n\n以 v4 第十章「验收标准」为准（理想路径 + 异常路径必测）。每批结束按对应「产出标准」自测：\n- 第 0 批：预置目标文本对比回归不退化、version=3 校验生效。\n- 第一批：文本/生图 × 单条/批量四组合、置灰、费用弹框、导出/历史/JSON 还原。\n- 第二批：统一接入两填法产出相同 TargetConfig、self-test 真实调用、run-custom 非流式、方案 B 勾选生效、ComfyUI 出图。\n- 第三批：造数据三形式列对齐、评价从③导入逐条出分按 inputId。\n\n\u003e 注：异常路径（version\u003c3 拒绝、解析失败手动兜底、测试失败诊断重试、置灰、partial、取消清排队、刷新 interrupted、Excel 重名不覆盖、评价仅③导入可发起等）在各批对应功能完成时同步验证。\n\n---\n\n## 4. 风险与关键决策点\n\n（待补全）\n\n---\n\n## 5. 验收对照\n\n（待补全）\n", "summary": "测评平台开发计划（v3 + v4 并集 · 改造演进版）"}, {"id": "doc-14", "title": "测评平台开发计划v4.2.md", "filename": "测评平台开发计划v4.2.md", "category": "开发计划", "size": 18969, "updated": "2026-06-06 14:55", "content": "# 测评平台开发计划 v4.2（脚本接入 + adapter 三类 + contentKind 三标签）\n\n\u003e 依据：`测评平台需求文档v4.2.md` 定稿。**在现有 v4 代码基础上增量改造**，复用能复用的，只动 v4.2 涉及的三件事。\n\u003e 策略：v4 统一架构（custom / comfyui、run-custom、presetTargets、AI 评价等）已落地，本版只叠加增量。\n\u003e 本文件只产出计划，不写代码。SCHEMA_VERSION 维持 4。最后更新：2026-06-04\n\n---\n\n## 0. 总体目标与最终形态\n\n在已落地的 v4 统一架构上，完成 v4.2 三大结构调整：\n\n1. **adapter 两类 → 三类**：`built-in`（内置预置目标专用，平台写死 HTTP，沿用 v1.x 旧逻辑，不走脚本）/ `script`（用户接入目标专用，本机子进程执行脚本）/ `comfyui`（沿用 v4）。三类输出统一归一化 `{ outputText, outputImages[], latencyMs }`，上层禁 if-else；**preset 目标禁走脚本路径**。\n2. **接入方式：用户接入目标改\"脚本\"**：删\"用户填表模板\"交互；preset 目标的内置 HTTP 配置仍写在 `presetTargets.ts`（由 built-in adapter 读取，平台内部写死、不暴露给用户）。\n3. **contentKind 三标签**：`text` / `multimodal` / `image`，取消 `both`（**代码已改完，本版仅做收尾验证**）。\n\n**v4.2 相对 v4 的关键变化：**\n- adapter：v4 两类（custom / comfyui）→ **v4.2 三类（built-in / script / comfyui）**，custom 按 `preset` 拆分两条执行路径。\n- 接入：v4 用户填表模板（requestTemplate / outputJSONPath / 方案B capabilities）→ **v4.2 用户接入走脚本（AI 写脚本 → 本机跑通 → 确认创建）**。\n- 数据模型：`TargetConfig.type` 仍 `custom | comfyui`；新增 `script` 字段；`contentKind` 三标签。\n- 后端：删用户填表式 `run-custom`/`parse-doc` 交互职责，**新增 `/api/gen-script`、`/api/run-script`、`/api/fix-script`**；`/api/evaluate` 明确裁判走 built-in、内部强制结构化 JSON。\n- 参数传递：v4 `{{占位}}` 字符串替换进 body → **v4.2 params JSON 经 stdin 注入，禁字符串替换**。\n- 结果判定：脚本结果用 `===RESULT_JSON_START===...===RESULT_JSON_END===` 标记包裹，与调试日志区分，非空判成功。\n- 接入确认：v4 测试通过自动建接口 → **v4.2 展示输入+原始输出+渲染结果，用户「确认创建」才建**。\n- lang：仅 `python`（默认）/ `node`（可选），**砍 shell**。\n- SCHEMA_VERSION：维持 **4**。\n- 沿用 v4：内容/生图模式、4 板块导航、ComfyUI 收窄形态、生图费用提示、AI 造数据、跑批与评价分离、图片存原图 + 传裁判 canvas 压缩（最长边 1024px）+ IndexedDB 写入失败提示。\n\n---\n\n## 1. 现状盘点（复用 / 改造 / 新建）\n\nv4 代码已落地，按 v4.2 目标做映射：\n\n### 1.1 类型层 `src/types/index.ts` — 【小改】\n- `SCHEMA_VERSION` 维持 **4**，不变。\n- `ContentKind = 'text' | 'multimodal' | 'image'` — **已改完**（取消 both）。\n- 新增 `TargetConfig.script`（`{ lang: 'python' | 'node'; code; verified; lastTestOutput?; outputDir? }`）。\n- `RequestTemplate` 保留：preset 目标的内置 HTTP 配置仍用它（由 built-in adapter 读取）；删除 `preprocess`（方案B capabilities，本版随用户填表模板一并退场）。\n- `ApiDocParseResult` — 改造：产出对齐\"脚本草稿 + suggestedParams（stdin 字段） + suggestedContentKind\"，删 `bodyTemplate`/`outputTextPath`/`preprocess` 等填表字段。\n\n### 1.2 配置层 `src/config/` — 【改造】\n- `presetTargets.ts` — 【保留】preset 目标以 built-in 形态预置（带内置 HTTP `requestTemplate`、不带 `script`），preset=true、status=tested_ok，至少含一个裁判目标（contentKind='multimodal'）。**已三标签化**。\n- `capabilities.ts` — 【废弃】方案B不再需要（随用户填表模板退场）。\n- `runtime.ts` — 【小改】补：脚本修复次数上限（默认 3）、脚本产物根目录（默认 `./outputs`）、脚本执行超时（默认 60s）。\n- `comfyTemplate.ts` / `models.ts` / `builtinAlgos.ts` — 沿用 v4。\n\n### 1.3 适配器层 `src/adapters/` — 【拆分改造】\n- `customAdapter.ts` — 【拆分】按 `preset` 分流：preset 目标 → **built-in 路径**（复用现有 HTTP 调用逻辑，读 presetTargets.ts 的 requestTemplate）；非 preset custom 目标 → **script 路径**（打 `/api/run-script`）。\n- 新建 `scriptAdapter.ts`（或在 customAdapter 内分流）— 走脚本机制，输出归一化。\n- `comfyuiAdapter.ts` — 沿用 v4。\n- `registry.ts` — 【改造】注册表表达三类执行路径（built-in / script / comfyui）；归一化输出不变。\n- `anthropicCompatible.ts` / `types.ts` — 沿用 v4（built-in 路径继续复用 Anthropic 兼容逻辑）。\n\n### 1.4 服务层 `src/services/` — 【改造 + 新建】\n- 改造：`parseDocService.ts` / `parseDocClient.ts` → 产出脚本草稿 + suggestedParams（stdin 字段）+ suggestedContentKind（决策10）。\n- 改造：`evaluateService.ts` / `evaluateClient.ts` → 裁判走 built-in、内部强制结构化评分 JSON（function calling 优先 + 后端容错解析）；裁判筛选按 contentKind 规则（含图须 multimodal）。\n- 新建：`genScriptClient.ts`（打 /api/gen-script）、`runScriptClient.ts`（打 /api/run-script）、`fixScriptClient.ts`（打 /api/fix-script）。\n- 新建：`services/script/`（子进程执行、stdin 注入、RESULT_JSON 标记解析、超时杀进程树、环境探测、图片转 base64/blob 收进结果体系）。\n- 废弃：`preprocess/`（方案B安全能力执行模块）、用户填表式的 `apiClient.ts`/`llmClient.ts`/`algoClient.ts`（preset 走 built-in 复用、用户接入走脚本）。\n- 复用：`db.ts` / `draftDb.ts` / `projectIO.ts`（version 校验仍 \u003c4 拒绝）/ `excel.ts` / `getApiKey.ts`（apiKeyRef 注入子进程）/ `runService.ts`（并发/取消/中断复用）/ `genData*` / `evalPrompt*`。\n\n### 1.5 后端路由 `src/app/api/` — 【新建 + 改造】\n- 新建：`gen-script`（文档 → AI 脚本 + suggestedParams + suggestedContentKind）、`run-script`（子进程执行、stdin 注入、RESULT_JSON 提取、失败返 exitCode+envInfo、图片转 base64）、`fix-script`（喂 stderr+exitCode+envInfo → AI 分步含命令方案，上限 3 次）。\n- 改造：`parse-doc` → 输出脚本草稿（替代填表草稿）；`evaluate` → 裁判走 built-in、强制结构化 JSON。\n- 保留：`comfyui/list`、`comfyui/run`、`gen-data`、`gen-eval-prompt`、`mock-algo`。\n- 退役：`run-custom`/`run-api`/`chat`/`test-api` 中\"用户填表模板执行\"的职责（preset 走 built-in、用户接入走 run-script）；具体合并/删除按编译修红推进。\n- body 上限 25MB，App Router Route Handler 写法。\n\n### 1.6 组件层 `src/components/` — 【改造】\n- `api/*`（接入面板/表单/文档解析）— 【大改】填表式 UI → 脚本接入流程：粘贴文档 → AI 生成脚本（默认折叠可编辑）→「运行测试」实时显示 stdout/stderr →「让AI修复」闭环 → **显著展示输入+原始输出+渲染结果（默认不折叠）+「请确认输出为真实有效结果」提示** →「确认创建」才建。\n- `TargetSelector.tsx` — contentKind 三标签筛选/置灰 — **已改完**（文本模式 text|multimodal、生图模式仅 image、输入有图 text 置灰）。\n- `result/*` — 脚本图片走结果体系正常渲染（懒加载/放大）+ 显示原图文件夹地址；`resultShared.tsx` 标签三标签 — **已改完**。\n- `run/*`（RunPanel/CostConfirmDialog）— 生图费用仅 image — **已改完**。\n- `evaluation/*` — 裁判筛选 text|multimodal、含图须 multimodal — **已改完**。\n\n### 1.7 Hooks `src/hooks/` — 【小改 / 复用】\n- `useTaskRunner` — 跑批分流三类 adapter（built-in / script / comfyui）；复用并发/取消逻辑。\n- `useProject` / `useEvaluation` / `useTargetSelection` / `useInputDraft` — 复用。\n\n---\n\n## 2. 分批实施计划\n\n分三批，每批结束都能 `npm run dev` 跑通并自测。第一批是地基（adapter 三类 + 数据模型），必须先做。\n\n### 第一批 —— adapter 三类骨架 + 数据模型 + contentKind 收尾\n\u003e v4.2 地基：先把执行路径分流和数据模型定下来，否则脚本接入无处落地。\n- 数据模型：`TargetConfig` 新增 `script` 字段（lang: python|node、code、verified、lastTestOutput、outputDir）；删 `RequestTemplate.preprocess`；`ApiDocParseResult` 改为脚本草稿产出。SCHEMA_VERSION 维持 4。\n- adapter 三类分流：customAdapter 按 `preset` 拆分 —— preset → built-in 路径（复用现有 HTTP 调用、读 presetTargets requestTemplate）；非 preset → script 路径（占位，下批接 run-script）。registry 表达三类，归一化输出 `{outputText, outputImages[], latencyMs}` 不变，**preset 禁走脚本路径**。\n- contentKind 三标签收尾验证：types/presetTargets/TargetSelector/result/run/evaluation 相关均已改完，本批回归确认（文本模式 text|multimodal、生图模式仅 image、输入有图 text 置灰、含图裁判须 multimodal、生图费用仅 image）。\n- config/runtime.ts 补：脚本修复次数上限（3）、脚本产物根目录（./outputs）、脚本执行超时（60s）。\n- 废弃 `config/capabilities.ts` + `services/preprocess/`（方案B退场）。\n- **产出标准**：preset 目标走 built-in 跑通文本/生图对比不退化；裁判走 built-in 开箱可用；contentKind 三标签规则全部生效；脚本路径占位不报错。\n\n### 第二批 —— 脚本接入核心链路（用户接入目标）\n\u003e 本版重头戏：AI 写脚本 → 本机跑通 → 确认创建。\n- `/api/gen-script`：文档 → AI 生成 python 脚本（从 stdin 读 params JSON 范式、RESULT_JSON 标记输出），同时声明 suggestedParams（stdin 字段清单）+ suggestedContentKind（决策2/3/10）。\n- `/api/run-script`：child_process 子进程执行；params JSON 经 stdin/临时文件注入（**禁字符串替换**）；超时杀进程（**Windows 杀进程树**）；apiKeyRef 注入子进程环境变量；独立子目录/唯一文件名；按 RESULT_JSON 标记提取结果（**非空判成功**）；失败返 `stderr 全文 + exitCode + envInfo`；图片读取转 base64/blob 收进结果体系（决策2/3/5/6/7）。\n- `/api/fix-script`：喂回 `code + error + stderr + exitCode + envInfo` → AI 给\"分步骤、含具体终端命令\"的解决方案；**修复上限 3 次**（决策5）。\n- 接入面板改造（`components/api/*`）：粘贴文档 → AI 生成脚本（折叠可编辑）→「运行测试」实时显示 stdout/stderr →「让AI修复」闭环 → **显著展示「输入参数值 + 脚本原始输出 + 渲染结果」（默认不折叠）+「请确认输出为真实有效结果（非示例/占位）」提示** →「确认创建」才提炼参数 + 确认 contentKind + 保存（script.verified=true, status=tested_ok）（决策4）。\n- inputParams 来源 = AI 声明的 stdin 字段（suggestedParams），**绝不正则抠代码**；字段名与脚本读取 key 严格一致（决策10）。\n- 接入状态机：unverified 黄角标 / tested_ok / tested_fail / unsupported；跑不通可强存 unverified。\n- 前置要求提示：需本机 Python 3.x；首次按 AI 引导装环境/依赖。\n- **产出标准**：任意接口文档可生成脚本 → 本机跑通 → 展示三项确认 → 确认创建；prompt 含引号/换行不破坏脚本不注入；缺 python/缺库 → AI 给含命令的分步引导；返回示例/占位时用户可识别拒绝创建；脚本图片可渲染并显示文件夹。\n\n### 第三批 —— 跑批衔接 + 评价收尾 + 导出重现\n- 跑批分流三类 adapter（`useTaskRunner`）：built-in（HTTP）/ script（stdin 传参子进程）/ comfyui；并发受 Task.concurrency（1~10）管控；script 子进程超时/取消不堆积。\n- 脚本图片走结果体系：base64/blob 进 IndexedDB / 历史重现 / JSON 导出，沿用 v4 存储/压缩规则（存原图、传裁判 canvas 压缩最长边 1024px、写入失败提示存储不足）；导出后另一环境可重现，不依赖本地 outputDir（决策6/11）。\n- AI 评价（`/api/evaluate` + `evaluate*`）：裁判走 built-in、内部强制结构化评分 JSON（function calling 优先 + 后端容错解析）；裁判筛选 contentKind text|multimodal，被评结果含图须 multimodal、不可 image（决策1/9）。\n- **产出标准**：三类目标混合跑批结果归一展示；脚本生图 JSON 导出后另一环境正常重现；评价从③导入逐条出分（0–10），裁判输出结构化、含图用 multimodal。\n\n---\n\n## 3. 详细任务拆解\n\n\u003e 按批次列可勾选任务，括号标注主要涉及文件。已完成项标 ✅。\n\n### 第一批（地基）\n- [ ] 改 `types/index.ts`：`TargetConfig.script` 字段、删 `RequestTemplate.preprocess`、`ApiDocParseResult` 改脚本草稿产出（`src/types/index.ts`）\n- [x] ✅ `ContentKind` 三标签（取消 both）（`src/types/index.ts`）\n- [x] ✅ presetTargets contentKind 三标签化、`targetSupportsImage` 仅 multimodal（`src/config/presetTargets.ts`）\n- [ ] adapter 三类分流：customAdapter 按 preset 拆 built-in / script 路径，registry 表达三类（`src/adapters/customAdapter.ts`、`scriptAdapter.ts`、`registry.ts`）\n- [ ] `config/runtime.ts` 补：脚本修复次数上限(3) / 脚本产物根目录(./outputs) / 脚本执行超时(60s)\n- [ ] 废弃 `config/capabilities.ts` + `services/preprocess/`\n- [x] ✅ TargetSelector contentKind 筛选/置灰（`src/components/TargetSelector.tsx`）\n- [x] ✅ result/run/evaluation 三标签收尾（`resultShared.tsx`、`RunPanel.tsx`、`CostConfirmDialog.tsx`、`WorkspaceBody.tsx`、`ApiAccessPanel.tsx`）\n- [ ] 回归：preset 走 built-in 文本/生图对比不退化、裁判开箱可用\n\n### 第二批（脚本接入）\n- [ ] `/api/gen-script`：文档 → 脚本（stdin 范式 + RESULT_JSON 标记）+ suggestedParams + suggestedContentKind（`src/app/api/gen-script`、`services/parseDocService.ts`、`genScriptClient.ts`）\n- [ ] `/api/run-script`：子进程执行 + stdin 注入 + RESULT_JSON 提取 + 超时杀进程树 + apiKeyRef 注入 + 图片转 base64 + 失败返 exitCode/envInfo（`src/app/api/run-script`、`services/script/*`、`runScriptClient.ts`）\n- [ ] `/api/fix-script`：喂 stderr+exitCode+envInfo → AI 分步含命令方案 + 上限 3 次（`src/app/api/fix-script`、`fixScriptClient.ts`）\n- [ ] 接入面板脚本流程改造：生成→测试→修复闭环→展示三项确认→「确认创建」（`src/components/api/*`）\n- [ ] inputParams = AI 声明 stdin 字段，字段名与脚本读取 key 一致校验（`services/parseDocService.ts`）\n- [ ] 接入状态机角标 + 强存 unverified + Python 前置要求提示（`src/components/api/*`）\n- [ ] 退役用户填表式执行职责（run-custom/run-api/chat/test-api 按编译修红清理）\n\n### 第三批（跑批 + 评价 + 导出）\n- [ ] 跑批分流三类 adapter + 并发/超时/取消（`src/hooks/useTaskRunner.ts`、`services/runService.ts`）\n- [ ] 脚本图片转结果体系（base64/blob）+ IndexedDB/历史/导出 + canvas 压缩(1024px) + 写入失败提示（`services/script/*`、`services/db.ts`、`components/result/*`）\n- [ ] `/api/evaluate` 裁判走 built-in + 强制结构化 JSON（function calling + 后端容错）（`src/app/api/evaluate`、`services/evaluateService.ts`）\n- [x] ✅ 裁判筛选 text|multimodal、含图须 multimodal（`src/components/evaluation/*`、`ApiAccessPanel.tsx`）\n- [ ] JSON 导出后另一环境重现脚本生图（不依赖 outputDir）（`services/projectIO.ts`）\n\n---\n\n## 4. 风险与关键决策点\n\n- **adapter 拆分风险（最关键）**：customAdapter 现承担所有 custom 目标执行，拆成 built-in（preset）/ script（非 preset）两条路径时，须确保 preset 目标继续走原 HTTP 逻辑、零回归。建议先抽出 built-in 路径（复用现有代码）跑回归，再接 script 路径。**红线：preset 目标绝不走脚本路径**。\n- **stdin 传参 vs 字符串替换**：v4 的 `{{占位}}` 是字符串替换进 body，v4.2 改为 params JSON 经 stdin 注入。`{{占位}}` 仅保留为 UI 提示，**绝不再做文本替换、绝不正则抠代码提参**——参数来源唯一为 AI 声明的 stdin 字段（suggestedParams）。\n- **RESULT_JSON 标记解析**：脚本调试 print 与结果 JSON 必须严格区分，只解析 `===RESULT_JSON_START===...===RESULT_JSON_END===` 之间内容；缺标记/为空一律判失败，根治\"没崩就成功\"。\n- **进程管理与跨平台**：超时杀进程，**Windows 必须杀进程树**（清理子进程的子进程）；超时/取消后进程不堆积；子进程比 HTTP 重，并发沿用 Task.concurrency。\n- **测试通过不自动建接口**：必须展示输入+原始输出+渲染结果，用户「确认创建」才建；这是判断脚本对错（识别示例/占位假数据）的唯一依据，三项默认不折叠。\n- **fix-script 烧 token**：修复上限 3 次（config 可调），避免无限循环。\n- **图片重现一致性**：脚本图片须转 base64/blob 进结果体系，导出后另一环境不依赖本地 outputDir 即可重现；沿用 v4 压缩/存储规则。\n- **裁判结构化输出**：`/api/evaluate` 内部强制裁判输出结构化评分 JSON（function calling 优先 + 后端容错解析），走 built-in 不依赖脚本，保证开箱可用。\n- **lang 收窄**：仅 python 正式支持、node 可选，**shell 砍掉**（Windows 无 bash）。\n- **SCHEMA_VERSION 维持 4**：v4 旧数据仍兼容；新增 script 字段为可选，旧 preset 目标无 script 不受影响。\n\n---\n\n## 5. 验收对照\n\n以 `测评平台需求文档v4.2.md` 第十章「验收标准」为准（理想路径 + 异常路径必测）。每批结束按对应「产出标准」自测：\n- 第一批：preset 走 built-in 文本/生图回归不退化、裁判开箱可用、contentKind 三标签规则全生效、runtime 三配置就绪。\n- 第二批：文档→脚本→跑通→展示三项→确认创建闭环；stdin 传参防注入；RESULT_JSON 区分日志；缺 python/缺库 AI 分步引导（≤3 次）；示例/占位可识别拒绝。\n- 第三批：三类 adapter 混合跑批归一展示；脚本图片转结果体系、导出另一环境重现；评价裁判走 built-in 结构化出分、含图用 multimodal。\n\n\u003e 异常路径（version\u003c4 拒绝、脚本跑不通诊断/修复/手动改/标 unsupported、输出 JSON 空/缺标记判失败不标 tested_ok、超时杀进程树、置灰/裁判规则、preset 禁走脚本等）在各批对应功能完成时同步验证。\n", "summary": "测评平台开发计划 v4.2（脚本接入 + adapter 三类 + contentKind 三标签）"}, {"id": "doc-15", "title": "测评平台需求增补v2.md", "filename": "测评平台需求增补v2.md", "category": "需求文档", "size": 10798, "updated": "2026-06-06 14:55", "content": "# 大模型测评平台 · 需求增补 v2 定稿\n\n\u003e 本文档基于《测评平台prd.md v1.2》，记录第二轮新增的 6 个需求点及其调整决策。\n\u003e 与原 PRD 并存，原 PRD 不变；本文档为已确认定稿，据此调整开发计划 M8/M9。\n\u003e 状态标记：✅已定 / 💡backlog（本期不做，记录触发条件）\n\n---\n\n## 一、背景\n\n第一批（M0~M7）已完成并通过强制卡点（功能 + 4 项大数据量压测全部达标）。\n进入第二批前，用户提出 6 个新需求。本文档将其结构化，明确每条的方案、与原 PRD 的衔接、复杂度与分阶段建议。\n\n核心设计原则（延续原 PRD）：\n- 值存 `TaskInput`，定义存 `ApiConfig` / `apiParamsSnapshot`，绝不把值写回定义。\n- 外部调用一律走服务端 API 路由代理，**API key 绝不落前端**。\n- 模块化、低耦合，新增能力尽量「只加组件、不动主流程」。\n\n---\n\n## 二、需求清单与方案\n\n### 需求 1：图片测评生成时可选「图片生成数量」 ✅\n- **诉求**：文生图/图生图场景，运行前可设置一次生成 N 张，结果区多图展示。\n- **方案（方式 A，已定）**：作为算法 API 的**普通参数**处理。用户在接入算法 API 时，自行配置一个参数（如 `num_images`，type=number，默认 1），运行时在输入区填值。\n  - 复用原 PRD 已有的 `ParamDef` 体系，**平台零专用代码**。\n  - 结果区需支持单个目标返回多张图的展示（`ResultItem.outputImages` 已是 string[]，天然支持）。\n- **方式 B 移入 backlog**：平台级「生成 N 张」统一控件 + 参数映射协议 + 多图网格展示。详见末节 backlog。\n  - 不做的理由 / 触发条件：「等接入 ≥2 个真实生图算法、确认其数量参数可统一映射后再做。当前无真实算法接入，做映射协议属于无依据猜测，故暂缓。」\n- **复杂度**：低（方式 A）。\n\n### 需求 2：AI 解读 API 对接文档 → 透出接入信息（仅展示，不自动填） ✅\n- **诉求**：提供窗口，粘贴 API 对接文档/文本 → 大模型解读 → **透出**接入所需关键信息（endpoint、鉴权方式、请求/响应结构、参数字段等）供用户**对照手动填写**。\n- **关键调整（已定）**：AI **只透出展示，不自动写入配置**。理由：解读未必精准，自动填易出错且难排查；降级为「助手/参考」，风险可控。\n- **方案**：\n  - 复用原 PRD 模块 2 已设计的 `/api/parse-doc`，但**简化职责**——只返回结构化解读结果用于展示，不回写 `ApiConfig`。\n  - 解读用的大模型：**复用现有 DashScope 网关大模型**（DeepSeek/Kimi），开箱即用，不额外配 key。\n  - 自适应匹配：AI 解读时判断这份文档偏向「大模型 API」还是「算法 API」，在透出信息中标注类型 + 建议的 key 引用名，供用户参考。\n  - UI：左侧粘贴框 + 右侧「AI 解读结果」展示区（结构化字段卡片 + 原文高亮）；用户看着结果自己填接入表单。\n- **「一键采纳解读结果填入表单」移入 backlog**：详见末节 backlog。\n  - 不做的理由 / 触发条件：「技术上简单（解析结果已结构化，填入即赋值），但本期暂不做。理由：AI 解析准确率未经验证，用户亲手填写的字段均经自己确认、出错可定位排查；待 AI 解析准确率被实际使用验证后再加此便捷功能，届时为纯锦上添花、无风险。」\n- **复杂度**：中（核心是 prompt 设计 + 结构化输出解析；不做自动回填降低了大半风险）。\n\n### 需求 3：模型、算法用户可自选 ✅\n- **诉求**：目标选择区同时列出「大模型」和「算法」，用户勾选。\n- **方案**：目标选择区分两组——「内置大模型」（来自 `config/models.ts`）+「用户接入的 API」（来自 `project.apiConfigs`，含大模型类与算法类）。统一为「可勾选目标」。\n- **复杂度**：低~中（目标体系从「仅内置模型」扩展为「内置 + 用户接入」）。\n\n### 需求 4：接入配置扁平化 —— 一模型 = 一条 {key+url} 配置 ✅\n- **诉求调整（已定）**：放弃「单 API 挂多个大模型」的两层嵌套，改为**扁平**：每个接入目标是一条独立 `ApiConfig`，自带自己的 url + key 引用。要接 3 个模型就建 3 条配置。\n- **用户决策理由**：「主动选择扁平化以规避两层嵌套的复杂度与潜在 bug，换取结构清晰、易排查。本地工具模型数量有限，重复录入成本可接受。」\n- **方案**：\n  - `ApiConfig` 已有 `url`，新增一个 **key 引用字段**（如 `apiKeyRef: string`，值为环境变量名如 `MY_API_KEY`）。\n  - **key 存储（已定）**：延续现有模式——前端只存**引用名**（如 `MY_API_KEY`），真值写在服务端 `.env.local`，服务端代理按引用名注入（扩展 `getApiKey(keyRef)` → `process.env[keyRef]`）。\n    - 优点：最安全，key 永不落前端，JSON 导出也不含密钥。\n    - 代价：每新增一个 key 要手动改一次 `.env.local`（本地工具场景可接受，已确认接受）。\n  - 同一网关下多模型需重复填 url —— 可接受，换来结构清晰、零嵌套。\n- **「基于现有配置复制新增 / 共享凭证」便捷录入移入 backlog**：详见末节 backlog。\n  - 不做的理由 / 触发条件：「不改动扁平数据结构，仅在录入交互上支持『复制一条配置并仅改模型标识』，避免重复填 url+key 引用。本期不做，后续按需补充，无风险。」\n- **复杂度**：低（比原「多层凭证管理」简单很多）。\n\n### 需求 5：算法与大模型可混选对比 ✅\n- **诉求**：目标选择里可同时勾大模型 + 算法，结果并排对比。\n- **方案**：运行引擎已是「按 targetId 展开 × 并发」的通用结构（M4 的 `runTargets` + 通用 Task Runner），只需让目标解析支持**异构目标**（内置模型走 llm adapter，API 配置走 apiClient adapter），结果区统一并排展示。\n- **复杂度**：中（核心是 adapter 分发 + 结果区异构渲染；并发层无需改动，复用 Task Runner）。\n\n### 需求 6：可选「让 AI 自评」生成效果 ✅\n- **诉求**：运行后可选是否让 AI 评价结果；若选，用户选评价用大模型 + 写 prompt，**或让 AI 根据场景自动生成 prompt**。\n- **方案**：对应原 PRD M9 评价功能（`Evaluation` 数据模型已定义），新增一个增强点：\n  - 「AI 自动生成评价 prompt」：用户描述场景/要求 → 调大模型生成评价 prompt → 填入 `evalPrompt`，用户可再编辑。\n  - 评价执行复用通用 Task Runner（按 `Task.concurrency` 并发），结果按 `inputId` 归属，打分 0–10。\n- **复杂度**：中（M9 本就要做，增量是「自动生成 prompt」一个按钮 + 一次大模型调用）。\n\n---\n\n## 三、数据模型增量（相对原 PRD）\n\n```typescript\ninterface ApiConfig {\n  // ... 原有字段不变 ...\n  apiKeyRef?: string;        // 新增：key 的环境变量引用名（如 'MY_API_KEY'），真值在服务端 .env.local\n  targetKind?: 'llm' | 'algo';   // 新增：AI 解读建议 + 用户确认的目标类型，用于混选分组与 adapter 分发\n}\n```\n- 其余结构（`ParamDef`、`TaskInput`、`Evaluation`）原 PRD 已足够，无需改动。\n- 需求 1 的「生成数量」走 `ParamDef`，不新增字段。\n\n---\n\n## 四、与原 PRD / 开发计划的衔接\n\n| 需求 | 对应里程碑 | 性质 |\n|------|-----------|------|\n| 需求 2（AI 透出解读） | M8 | 激活原 PRD 模块 2，简化为「只透出」 |\n| 需求 3/4/5（接入 + 混选） | M8 | 激活原 PRD ApiConfig 体系，扁平化 |\n| 需求 1（生成数量） | M8 | 复用 ParamDef，零专用代码 |\n| 需求 6（AI 自评 + 自动 prompt） | M9 | 原 M9 + 自动生成 prompt 增强 |\n\n---\n\n## 五、分阶段（已定）\n\n把 M8 拆成两小步，降低单步风险：\n\n- **M8a：接入骨架（扁平化）+ 混选**\n  - ApiConfig 扁平化（url + apiKeyRef）、服务端按引用名取 key、apiClient adapter、mock 算法 API\n  - 目标选择支持「内置模型 + 用户接入」混选并排对比\n  - 需求 1（生成数量）随 ParamDef 自然支持\n  - 验收：建一条 mock 算法配置，与大模型混选运行 → 结果并排\n- **M8b：AI 解读透出**\n  - /api/parse-doc 简化版（只透出不回填）+ 粘贴/解读 UI\n  - 验收：粘贴一段 API 文档 → AI 透出结构化接入信息 → 用户对照填表\n- **M9：AI 自评（含自动生成 prompt）**\n  - 验收：运行后开启评价 → 选模型 + 自动生成/手填 prompt → 打分入表 → 导出含评分列\n\n---\n\n## 六、Backlog（本期不做，记录触发条件）\n\n集中记录本期暂缓的三项便捷/增强能力，均为「无风险、锦上添花」，到达触发条件后再做。\n\n### B1. 需求 1 方式 B：平台级生成数量统一控件 + 参数映射协议\n- **内容**：运行区固定「生成 N 张」控件，平台把控件值映射到当前算法 API 的对应参数；结果区多图网格展示。\n- **不做的理由**：当前无真实算法接入，做映射协议属于无依据猜测。\n- **触发条件**：接入 ≥2 个真实生图算法、且确认其数量参数可统一映射后再做。\n\n### B2. 需求 2 一键采纳：解读结果一键填入表单\n- **内容**：AI 解读结果旁加「一键采纳」按钮，把结构化解读结果直接填入接入表单。\n- **不做的理由**：技术上简单（解析结果已结构化，填入即赋值），但 AI 解析准确率未经验证；用户亲手填写的字段均经自己确认、出错可定位排查。\n- **触发条件**：AI 解析准确率经实际使用验证后再加，届时为纯锦上添花、无风险。\n\n### B3. 需求 4 复制新增：基于现有配置复制凭证便捷录入\n- **内容**：不改动扁平数据结构，仅在录入交互上支持「复制一条配置并仅改模型标识」，避免重复填 url + key 引用。\n- **不做的理由**：本期聚焦核心接入链路，重复录入成本当前可接受。\n- **触发条件**：按需补充，无前置依赖。\n\n---\n\n## 七、保持不变（延续原 PRD）\n\n- 三条核心设计原则原样保留：\n  1. 值永远存 `TaskInput`，定义存 `ApiConfig` / `apiParamsSnapshot`，绝不把值写回定义。\n  2. API key 绝不落前端，外部调用一律走服务端 API 路由代理。\n  3. 模块化、低耦合，新增能力尽量「只加组件、不动主流程」。\n- 第四节「与原 PRD / 开发计划衔接表」保留，确保 M8 / M9 映射清晰。\n\n", "summary": "大模型测评平台 · 需求增补 v2 定稿"}, {"id": "doc-16", "title": "测评平台需求文档v3.md", "filename": "测评平台需求文档v3.md", "category": "需求文档", "size": 32550, "updated": "2026-06-06 14:55", "content": "大模型测评平台 PRD · 最终定稿 v3\n\n本版在 v1.2 基础上，并入第一批变更（算法 API 接入框架升级 + 内容/生图模式 + 导航 4 板块重构）与第二批修订（可选测试 + unverified 接入、SCHEMA_VERSION=2、ComfyUI 收窄固定形态、跑批与评价彻底分离、contentKind 置灰维度、生图费用提示、AI 按目标列造数据），并完整沿用 v1.2 全部硬约束。\n\n\u003e 版本说明：正文版本号统一为 v3，与文件名一致。本文件与原 `测评平台prd.md`（v1.2）并存，原文件不动。\n\n---\n\n## 一、项目概述\n\n本地运行的网页工具，供算法工程师调试 prompt、产品/运营对比不同大模型、生图模型与算法 API 的输出效果。支持文本/生图两种内容模式，单条/批量两种运行模式，单条调试 + Excel 批量处理 + 试运行预览 + AI 造数据 + AI 逐条评价 + Excel/JSON 导出。\n\n核心特点：\n\n- 纯本地运行，IndexedDB 自动持久化，刷新/重开数据不丢\n- JSON 导出/导入做备份与迁移（SCHEMA_VERSION=2，旧版本拒绝导入、不自动迁移）\n- 多目标混合并排对比：大模型（llm/multimodal）+ 生图模型（image-api）+ 算法 API（algo-api）+ ComfyUI（comfyui）\n- 两个正交维度：内容模式 ContentMode（text/image）× 运行模式 RunMode（single/batch），各维度独立草稿、切换不互清\n- 算法 API 粘贴文档自动接入（AI 解析 → 表单填真实参数 → 可选「测试一次」真实调用 → tested_ok / unverified）\n- 生图模型远端调用（含 LoRA ID 参数）；ComfyUI 收窄为固定形态「LoRA + prompt + 生图基础模型」\n- AI 造数据（造一条 / 造批量 JSON / 造整张表，按目标所需列约束）\n- 跑批与评价彻底分离：评价为独立板块，必须从「结果与历史」导入有结果的 Task 才能评\n- 架构为「未来切换纯前端 + 用户自填 key」预留余地\n\n---\n\n## 二、技术栈与架构约束\n\n### 2.1 技术栈\n\n- 框架：Next.js 14（App Router）+ TypeScript\n- UI：Tailwind CSS + shadcn/ui\n- 外部调用：当前全部经 Next.js API 路由，密钥从 `.env.local` 读，绝不暴露前端\n- 持久化：IndexedDB（dexie）\n- Excel：xlsx（SheetJS），前端解析与生成\n- 图片压缩：前端 canvas\n- 运行：本地 `npm run dev`，访问 `localhost:3000`\n- 不使用：云数据库、云部署、用户登录\n\n### 2.2 架构约束\n\n1. **模块化、低耦合**：每个功能模块为独立组件，新增小功能只加组件、不动主流程；业务逻辑与 UI 分离（hooks/service）。\n2. **抽象调用层**：所有外部调用走 `services/llmClient.ts`、`services/apiClient.ts`（及生图/ComfyUI 对应 client）。当前打到 Next.js API 路由；未来切前端直连只改调用层。⚠️ 未来纯前端直连部分模型受 CORS 限制可能仍需轻量代理。\n3. **Key 来源抽象**：统一 `getApiKey(provider | keyRef)`，当前从 `.env.local` 读，未来改前端输入只换此处。\n4. **适配器模式**：5 种目标类型对应 5 种 adapter（`llm` / `multimodal` / `image-api` / `algo-api` / `comfyui`），新增能力=加一个 adapter 文件，禁止上层 if-else 按 type 分叉。\n5. **配置集中**：模型列表、生图模型列表、并发、超时、body 上限、测试重试上限等进 `config/`。\n\n实施提醒：第一批先搭骨架（调用层 + getApiKey + 5 种 adapter 骨架 + 统一接入框架 + config），骨架歪了后期难救。\n\n---\n\n## 三、数据模型\n\n```typescript\nconst SCHEMA_VERSION = 2;   // ⚠️ 旧版本（含 v1.2 的 version=1）拒绝导入，不做自动迁移\n\n// ===== 两个正交维度 =====\ntype ContentMode = 'text' | 'image';   // 内容模式：文本 / 生图\ntype RunMode     = 'single' | 'batch'; // 运行模式：单条 / 批量\n// ContentMode × RunMode 正交，各自维护独立草稿，切换不互相清空，运行只用当前模式数据\n\n// ===== 5 种目标类型，对应 5 种 adapter =====\ntype TargetType = 'llm' | 'multimodal' | 'image-api' | 'algo-api' | 'comfyui';\n// 内置（llm / multimodal / image-api）写在 config；算法 API、ComfyUI 由用户接入存项目\n\n// ===== 内容能力维度（置灰依据，与可用性 status 独立两维）=====\ntype ContentKind = 'text' | 'image' | 'both';\n\ninterface Project {\n  id: string;\n  version: number;                  // = SCHEMA_VERSION（导入时 version \u003c 2 直接拒绝）\n  name: string;\n  createTime: number;\n  updateTime: number;\n  targetConfigs: TargetConfig[];    // 原 apiConfigs 改名；只存定义，含 algo-api / comfyui 两类\n  tasks: Task[];\n}\n\ninterface Task {\n  id: string;\n  createTime: number;\n  finishTime?: number;\n  contentMode: ContentMode;         // 新增：本次任务的内容模式\n  runMode: RunMode;                 // 新增：替代原 mode（single | batch）\n  inputs: TaskInput[];\n  targetIds: string[];\n  concurrency: number;              // 1~10，默认 3\n  paramSnapshot: {                  // 只存定义/列映射，不存值\n    targetId: string;\n    paramDefs: ParamDef[];\n  }[];\n  results: ResultRow[];\n  evaluation?: Evaluation;          // 仅当从板块③导入到板块④评价后才写入\n  status: 'idle' | 'running' | 'partial' | 'done' | 'error' | 'cancelled';\n}\n\ninterface TaskInput {               // 所有“值”都存这里\n  id: string;\n  prompt: string;\n  images: ImageItem[];\n  extraFields?: Record\u003cstring, any\u003e;   // 算法 API 参数值（含 image 参数的 URL 字符串、LoRA ID 等）\n}\n\ninterface ImageItem {\n  id: string;\n  name: string;\n  source: 'url' | 'base64';\n  value: string;\n}\n\ninterface ResultRow {\n  inputId: string;\n  items: ResultItem[];\n}\n\ninterface ResultItem {\n  targetId: string;\n  targetName: string;\n  status: 'pending' | 'running' | 'success' | 'error' | 'interrupted';\n  outputText?: string;\n  outputImages?: string[];          // 展示用原图；单目标可返回多张（生图）\n  latencyMs?: number;\n  error?: string;\n}\n\n// ===== 内置模型（config/models.ts 写死，含大模型与生图模型）=====\ninterface ModelConfig {\n  id: string;\n  name: string;\n  type: 'llm' | 'multimodal' | 'image-api';   // 扩展：新增 image-api\n  imageInput?: 'url' | 'base64' | 'both';      // 仅 multimodal 接收图片时有意义\n  fixedParams?: ParamDef[];                    // 生图模型预置的固定参数定义（如尺寸、步数）\n  loraSupport?: boolean;                       // image-api 是否支持填 LoRA ID（运行时由 TaskInput 提供）\n}\n\n// ===== 用户接入目标（algo-api / comfyui 两种 type）=====\ninterface TargetConfig {\n  id: string;\n  name: string;\n  type: 'algo-api' | 'comfyui';\n  contentKind: ContentKind;          // 内容能力（置灰依据）：text | image | both\n  inputParams: ParamDef[];           // 入参定义（algo-api 由 AI 解析+用户确认；comfyui 形态固定基本为空）\n\n  // —— algo-api 专用：请求描述模板 ——\n  requestTemplate?: {\n    url: string;\n    method: 'GET' | 'POST';\n    headers: { key: string; value: string }[];\n    bodyTemplate: string;            // 含占位符，运行时用 TaskInput 真实参数值填充\n    outputImagePath?: string;        // 响应中取图片的路径（JSONPath 风格）\n    outputTextPath?: string;         // 响应中取文本的路径\n  };\n\n  // —— comfyui 专用（收窄为固定形态：LoRA + prompt + 生图基础模型）——\n  comfyui?: {\n    serverUrl: string;\n    baseModel: string;               // checkpoint（由 /api/comfyui/list 拉取后下拉选择）\n    loraName?: string;               // LoRA（由 /api/comfyui/list 拉取后下拉选择，可选）\n    loraWeight?: number;             // LoRA 权重，可选\n  };\n\n  apiKeyRef?: string;                // key 的环境变量引用名（如 'MY_API_KEY'），真值在服务端 .env.local\n  status: 'unverified' | 'tested_ok' | 'tested_fail' | 'unsupported';\n  rawDoc?: string;                   // 原始文档（algo-api 接入时粘贴的文档原文）\n}\n\ninterface ParamDef {\n  name: string;\n  type: 'string' | 'number' | 'boolean' | 'image';\n  required: boolean;\n  desc?: string;\n  defaultValue?: any;\n  value?: any;   // ⚠️ TargetConfig 中仅占位、无效、不持久化；真值存 TaskInput\n}\n\n// ===== AI 造数据请求 =====\ninterface GenDataRequest {\n  contentMode: ContentMode;          // 决定需要哪些列（文本/生图）\n  shape: 'one' | 'batch-json' | 'table';   // 造一条 / 造批量 JSON / 造整张表\n  count?: number;                    // batch-json / table 时的条数\n  requirement: string;               // 用户对数据内容的描述\n  targetColumns: string[];           // 当前选中目标所需列（prompt / image_url / 各参数名），作为约束传给 AI\n}\n\ninterface Evaluation {\n  userRequirement: string;\n  evalPrompt: string;\n  evalModelId: string;\n  scope?: 'all' | 'selected';        // 评价范围：全量 / 选中行\n  selectedInputIds?: string[];       // scope='selected' 时生效\n  status: 'idle' | 'running' | 'done' | 'error';\n  results?: {\n    inputId: string;\n    scores: { targetId: string; score: number; comment: string }[];  // 0–10，一位小数\n    summary: string;\n    recommendation: string;\n  }[];\n}\n```\n\n**核心数据原则（不变）**：值永远存 `TaskInput`；定义存 `paramSnapshot`；绝不把值写回 `TargetConfig`；单条模式同样遵守（`inputs` 长度 = 1）。\n\n**status 与 contentKind 是独立两维**：`status` 表达可用性（能否被选），`contentKind` 表达内容能力（文本/生图，作为内容模式匹配置灰依据）。不靠「跑通与否」判内容类型。\n\n---\n\n## 四、前端导航（4 大板块）\n\n前端导航重构为 4 大板块，跑批与评价刻意分离：\n\n**① 跑批 / 大模型对比**\n输入区（内容模式 × 运行模式）+ 目标选择（按内容模式置灰）+ 运行（试运行 / 批量）+ 结果区。\n\u003e 注明：「跑批与评价刻意分离，保持跑批清爽，需评价时到④主动发起。」本板块不出现任何评价入口。\n\n**② 大模型 / 算法配置**\n接入管理（algo-api / comfyui 接入与状态机）+ AI 解读文档/工作流（仅透出展示，不自动回填）+ 内置大模型/生图模型列表展示。\n\n**③ 结果与历史**\n历史任务列表（时间倒序）与详情，完整重现输入/输出。提供「导入到 AI 评价」入口，把某个有结果的 Task 交给板块④。\n\n**④ AI 智能评价**\n必须从③导入一个有结果的 Task 才能评。填测评需求 → 生成/编辑评价 Prompt → 选裁判模型 → 选评价范围 → 逐条评价。\n\u003e 注明：「跑批与评价刻意分离，保持跑批清爽，需评价时到④主动发起。」\n\n---\n\n## 五、功能需求\n\n### 模块 1：顶部工具栏\n- 新建项目（有未导出修改时二次确认）\n- 导入 JSON：校验 `version`，**`version \u003c 2`（含 v1.2 旧文件）直接拒绝并明确提示「版本过旧不兼容」，不做自动迁移**；覆盖前二次确认\n- 导出 JSON（`项目名_YYYYMMDD_HHmm.json`），写入 `version = SCHEMA_VERSION(2)`\n- 项目名可重命名；IndexedDB 自动保存，JSON 仅备份/迁移\n\n### 模块 2：板块② —— 大模型 / 算法配置（接入管理）\n\n#### 2.1 算法 API 接入（algo-api）= 可选测试 + unverified 允许接入\n接入流程：\n\n```\n粘贴文档 → AI 解析出「请求描述模板」(requestTemplate) + 入参定义(ParamDef[])\n   ↓ 用户填【真实参数】\n   ↓ 可选「测试一次」(用真实参数真实调用)\n   ├─ 通过 → tested_ok\n   └─ 不通过 / 跳过测试 → unverified（可运行，自负风险）\n```\n\n- AI 解析走 `/api/parse-doc`：**强制结构化输出（function calling 优先，降级 JSON + 容错解析）**，返回 `requestTemplate` 草稿 + `inputParams`（ParamDef[）+ `contentKind` 建议值 + warnings。AI 解读结果仅透出展示，不自动回填（用户对照确认）。\n- 用户填【真实参数】后，可选「测试一次」：**测试前强制提示「将真实调用接口，请确认参数正确」**。测试 = 用用户真实参数发起真实调用（`/api/self-test`），**绝不做 AI 编造假数据自测**。\n- **输出路径全空时不许标 `tested_ok`**（`outputImagePath` 与 `outputTextPath` 全空）；但**允许 `unverified`**。\n- 失败后可：重试（**上限 3 次，config 可调**）/ 手动修正参数与模板 / 标记 `unsupported`。\n- 列表支持查看/编辑/删除/重新解析。\n\n#### 2.2 接入状态机\n- `unverified`：可运行，带**黄色「未验证」角标**（自负风险）\n- `tested_ok`：可运行\n- `tested_fail` / `unsupported`：不可选，不在目标选择区显示（或置灰）\n\n#### 2.3 contentKind 确定（接入时确定内容类型，作为置灰依据）\n- AI 解析时给出 `contentKind` 建议值。\n- 用户「测试一次」跑通后，平台分析返回内容：含图片 → 建议 `image`；仅文本 → `text`；两者都有 → `both`。\n- 展示测试结果 + 推断类型，用户确认/修改（默认采纳推断）。\n- 跳过测试（`unverified`）则由用户手动选择 `contentKind`。\n- 原则：**不靠「跑通与否」判内容类型**；`status`（可用性）与 `contentKind`（置灰依据）是独立两维。\n\n#### 2.4 ComfyUI 接入（comfyui）= 固定形态「LoRA + prompt + 生图基础模型」\n- **不支持任意工作流**；不解析用户工作流；无 `workflowJson` / `nodeMappings` / 「AI 识别可变节点」概念。\n- 平台内置固定工作流模板，运行时拼装提交。\n- 接入只需：填 ComfyUI 地址 → 选 checkpoint（baseModel）→ 选 LoRA（loraName，可选）+ 可选权重（loraWeight）。\n- 接入时调 `/api/comfyui/list`（底层调 ComfyUI `/object_info`）拉取可用 checkpoint / LoRA 列表供下拉选择。地址连不上时给明确错误提示。\n- `contentKind` 恒为 `image`（形态固定、恒生图、不收额外图）。\n\n#### 2.5 内置模型列表展示\n- 展示 `config/models.ts` 中的大模型（llm/multimodal）与生图模型（image-api，可带 `fixedParams`、`loraSupport`）。\n\n### 模块 3：板块① —— 输入区（内容模式 × 运行模式）\n\n#### 3.1 两个正交维度\n- **内容模式 ContentMode**：文本 `text` / 生图 `image`\n- **运行模式 RunMode**：单条 `single` / 批量 `batch`\n- 两维度正交，**各自维护独立草稿**，切换时不互相清空/覆盖（分开保存于内存/IndexedDB）；切回原模式恢复上次草稿；正式运行只使用当前所在模式的数据生成 Task。\n\n#### 3.2 单条模式（single）\n- prompt 文本框；图片 Tab 切「本地上传(base64)」「URL」，多张可删\n- 选中算法 API / 生图模型 → 自动生成入参表单填值；`type:'image'` 参数复用图片输入组件；生图模型若 `loraSupport` 则可填 LoRA ID（存入 `TaskInput.extraFields`）\n- 值写入该条 `TaskInput`（`inputs` 长度 = 1）\n\n#### 3.3 批量模式（batch，Excel）\n- 「下载导入模板」：按选中目标所需字段生成空 Excel；列名用固定英文 key（`prompt`、`image_url`、参数原始 name）\n- 「导入 Excel」→ 前端可编辑表格（行可查看/编辑/删除），确认再运行；不匹配列给提示\n- 落位：`prompt`→prompt；`image_url`→images(source='url')；算法 API/生图参数列→`extraFields`\n- 算法 API 的 `type:'image'` 参数：批量模式下以 URL 字符串列承载（列名=参数原始 name），存入 `extraFields[参数名]`（值为 URL 字符串）。即批量模式下所有图片一律走 URL，不支持本地文件\n- 显示条数预览\n\n### 模块 4：板块① —— 目标选择（按内容模式置灰）\n\n#### 4.1 内容模式与目标的匹配规则\n- **文本模式**：只可选 `contentKind` 含 text 的目标 —— `llm` / `multimodal` / `algo-api` 且 `contentKind` 为 `text|both`。\n- **生图模式**：只可选 `contentKind` 含 image 的目标 —— `image-api` / `comfyui` / `algo-api` 且 `contentKind` 为 `image|both`。\n- 不匹配的目标置灰。\n\n#### 4.2 置灰属性来源说明（逻辑由开发实现，不画完整矩阵表）\n- **内置模型/生图**：`type`、`imageInput` 来自 config，可控。\n- **ComfyUI**：形态固定，恒生图、不收额外图。\n- **算法 API**：用 `contentKind` + `status` 置灰；不使用 `imageInput` 概念，图片需求由其 `inputParams` 的 `image` 参数表达。\n- 置灰只依赖**粗粒度属性**（类型 / contentKind / 图片格式 / status），不逐个解析入参。\n- 另：有图时纯 `type:'llm'` 置灰；图为 base64 但模型 `imageInput='url'` → 提示改用 URL 或置灰。\n- `tested_fail` / `unsupported` 目标不显示或置灰；`unverified` 可选但带黄色角标。\n\n### 模块 5：板块① —— 试运行 \u0026 批量运行\n\n- 并发数运行前可设（1~10，默认 3，`Task.concurrency`），管控批量调用，超出排队\n- **取消** = 前端 AbortController：已发出请求中断（后端已发不保证终止）+ 排队中未发出任务一并清除，状态统一 `cancelled`/`interrupted`\n- 单调用超时（默认 60s）；运行中刷新 → 未完成标 `interrupted` 提示重跑（不做续传）\n- 算法 API 走 `/api/run-api`；生图模型走 `/api/run-image`；ComfyUI 走 `/api/comfyui/run`\n\n#### 5.1 文本模式\n- 试运行：仅第 1 条，临时展示、不落历史\n- 批量运行：按并发分批执行\n\n#### 5.2 生图模式费用提示规范\n- **生图试运行**：仅跑「第 1 条 × 各目标各 1 次」；点击前**强制弹框**「试运行会真实调用生图，消耗 1 次额度/可能产生费用，是否继续？」；**结果不落历史**。\n- **生图批量**：运行前预估 `输入条数 × 生图目标数 (× 每条张数)`，**弹框**「将发起约 N 次生图调用，可能产生费用，确认？」。\n\n### 模块 6：板块① —— 结果对比区\n- 单条：多列卡片并排；批量：表格视图（行可展开）\n- 每结果：目标名 + 类型标签、状态、输出（文本/图片可放大，生图支持多图）、耗时（「1.2s」）、错误\n- 实时更新；部分成败 → `status=partial` 分别标识\n\n### 模块 7：板块③ —— 结果与历史\n- Task 列表（时间倒序），点击完整重现输入/输出；算法 API 入参由 `extraFields` + `paramSnapshot.paramDefs` 还原\n- 每个有结果的 Task 提供「导入到 AI 评价」入口 → 跳板块④\n\n### 模块 8：板块④ —— AI 智能评价（逐条，独立板块）\n- **必须从板块③导入一个有结果的 Task 才能评**；板块①不出现任何评价入口\n- 填测评需求 →「生成评价 Prompt」`/api/gen-eval-prompt`（可编辑，支持 AI 自动生成）→ 选裁判模型（含图时 `type:'llm'` 置灰，须 multimodal）\n- 评价范围：默认全量；提供「仅评价选中/可见行」（`scope='selected'`，避免大数据量烧 token），粒度支持「全选 / 试运行那条 / 手动勾选行」\n- 「开始评价」→ 对范围内每条调用 `/api/evaluate`；`results` 按 `inputId` 归属；评价并发受 `Task.concurrency` 管控\n- 逐条语义：每次调用处理一条输入，传入 `results[]` = 该 inputId 下各目标的 ResultItem，裁判横向对比该条各目标输出\n- 图片传输：结果图为 URL → 只传 URL；为 base64 → 前端 canvas 压缩（最长边 1024px）后传，原图仍保留展示\n- 展示：各目标评分（0–10）+ 点评、总体结论、推荐项\n\n### 模块 9：AI 造数据（板块①，第三批）\n- 入口提供「造一条 / 造批量 JSON / 造整张表」三种产出（`GenDataRequest.shape = one | batch-json | table`），产出可编辑后运行\n- 调 `/api/gen-data`：**造表时把「当前选中目标所需列（prompt / image_url / 各参数名）」作为约束**（`targetColumns`）传给 AI，确保表头与批量表格列一致、可直接运行\n- 产出落位：单条 → 当前 TaskInput；批量 JSON / 整张表 → 批量可编辑表格\n\n### 模块 10：导出结果（Excel）\n- 每行一条输入，每目标占列；含 AI 评分列（若已评价）\n- **列名唯一性**：以 `targetId`（或保证唯一的展示名）生成，避免重名覆盖；建议列头 `{targetName}#{targetId简写}_输出`、`..._耗时`\n- 图片：URL → 存链接；base64 → 存占位文字 + 提示「建议用 URL 输出查看」（不打包 zip）\n- 文件名 `项目名_结果_YYYYMMDD_HHmm.xlsx`\n\n---\n\n## 六、后端 API 设计\n\n所有外部调用经服务端代理，key 按引用名从 `.env.local` 注入，绝不落前端。\n\n```\nPOST /api/chat              调用单个大模型（llm / multimodal）\n  入参：{ modelId, prompt, images[] }\n  出参：{ outputText, outputImages[], latencyMs }\n\nPOST /api/run-image         调用生图模型（image-api，含 LoRA ID）\n  入参：{ modelId, prompt, params, loraId? }   // params 来自 fixedParams + TaskInput 值\n  出参：{ status, outputImages[], latencyMs, error? }\n\nPOST /api/parse-doc         解析算法 API 文档为 requestTemplate 草稿（仅透出，不回填）\n  入参：{ doc }\n  出参：{ requestTemplate, inputParams: ParamDef[], contentKind, warnings[] }\n  要点：强制结构化输出（function calling 优先，降级 JSON + 容错）\n\nPOST /api/self-test         【接入阶段可选测试，用用户真实参数真实调用，带诊断】\n  入参：{ requestTemplate, paramValues }   // paramValues = 用户填写的真实参数\n  出参：成功 { ok:true, response, extractedImages[], extractedText, latencyMs }\n        失败 { ok:false, error, diagnosis }\n  ⚠️ 不得有 AI 编造假数据环节；测试 = 真实调用接口\n\nPOST /api/run-api           【algo-api 批量/试运行正式调用，纯执行不带诊断】\n  入参：{ requestTemplate, paramValues }   // paramValues 来自 TaskInput\n  出参：{ status, outputText?, outputImages[], latencyMs, error? }\n\nPOST /api/comfyui/list      拉取 ComfyUI 可用 checkpoint / LoRA 列表（不解析工作流）\n  入参：{ serverUrl }       // 底层调 ComfyUI /object_info\n  出参：{ checkpoints[], loras[] }   // 连不上时返回明确错误\n  ⚠️ 不叫 parse、不保留 /api/comfyui/parse；不解析用户工作流\n\nPOST /api/comfyui/run       ComfyUI 正式调用（内置固定模板 + 异步三步）\n  入参：{ comfyui: { serverUrl, baseModel, loraName?, loraWeight? }, prompt }\n  三步：提交（/prompt，带 client_id）→ 轮询 history → /view 取图（二进制转可展示格式）\n  出参：{ status, outputImages[], latencyMs, error? }\n\nPOST /api/gen-data          AI 造数据（造一条 / 造批量 JSON / 造整张表）\n  入参：{ contentMode, shape, count?, requirement, targetColumns[] }\n  出参：{ rows: Record\u003cstring, any\u003e[] }   // 表头/键名 = targetColumns，可直接运行\n\nPOST /api/gen-eval-prompt   生成（或 AI 自动生成）评价 Prompt\n  入参：{ userRequirement, targetNames[] }\n  出参：{ evalPrompt }\n\nPOST /api/evaluate          【逐条调用：一次处理一条输入】\n  入参：{ evalPrompt, evalModelId, inputId, results[] }  // results=该 inputId 下各目标 ResultItem，图片为压缩版或 URL\n  出参：{ inputId, scores[](0-10), summary, recommendation }\n```\n\n**body 上限**：相关 Route Handler 配置放大（建议 25MB），用 App Router（Route Handler）写法。\n\n---\n\n## 七、配置\n\n- `.env.local`：各模型/算法 API key（用户自填，不提交）；服务端 `getApiKey(provider | keyRef)` 按引用名注入 `process.env[keyRef]`\n- `config/models.ts`：内置大模型 + 生图模型数组（`id/name/type/imageInput/fixedParams/loraSupport`），`type` 含 `llm | multimodal | image-api`\n- `config/runtime.ts`：默认并发(3)、上限(10)、超时(60s)、body 上限(25MB)、**接入测试重试上限(3，可调)**\n- ComfyUI 内置固定工作流模板（LoRA + prompt + checkpoint），不暴露给用户编辑\n- 图床预留：`uploadImage` 默认关闭，待合规后接 OSS\n\n---\n\n## 八、数据存储与持久化规则\n\n- IndexedDB 日常自动保存（刷新不丢）；JSON 备份/迁移（带 `version` 校验，`version \u003c 2` 拒绝导入、不自动迁移）\n- 图片：url 存 url；base64 存完整 base64（展示用原图）\n- base64 传大模型/裁判前前端 canvas 压缩（最长边 1024px），仅压传出副本\n- IndexedDB 写入用 debounce/批量提交；写入失败须捕获并提示「存储空间不足，建议改用 URL 图片或导出备份」\n- 文件名：JSON `项目名_YYYYMMDD_HHmm.json`；Excel `项目名_结果_YYYYMMDD_HHmm.xlsx`\n\n---\n\n## 九、明确不做（本期外）\n\n延续 v1.2：用户登录/云数据库/云部署、图床上线（仅预留）、批量本地图片、断点续传、JSON 轻量导出、Excel 图片打包 zip、纯前端直连（仅架构预留）。\n\n本版补充明确不做：\n- **任意 ComfyUI 工作流**（本期仅固定 `LoRA + prompt + 生图基础模型` 形态，不解析用户工作流、无 nodeMappings/workflowJson）\n- **AI 假数据自测**（接入测试一律用用户真实参数真实调用）\n- **本地跑 SD / Diffusers**\n- **沙箱执行代码**\n- **本地上传 LoRA 到平台**（LoRA 交 ComfyUI 管，平台只引用其 LoRA 名）\n- **平台级「生成 N 张」统一控件 + 参数映射协议**（生成数量走算法 API 普通 ParamDef，平台零专用代码；统一控件移入 backlog）\n\n---\n\n## 十、验收标准\n\n### 理想路径\n- 启动正常；导航 4 板块可切换\n- 板块①：内容模式（文本/生图）× 运行模式（单条/批量）四种组合可用，各维度独立草稿切换不互清\n- 单条文本：混合多目标（大模型 + 算法 API）并排对比 + 耗时\n- 批量文本：模板 → 填 → 导入 → 可编辑表格 → 试运行 → 设并发 → 运行 → 表格展示\n- 生图单条/批量：选生图目标（image-api/comfyui/algo-api 含 image）→ 试运行弹费用确认仅跑第 1 条不落历史 → 批量弹「约 N 次调用」确认 → 多图结果展示\n- 板块②：粘贴算法文档 → AI 解析出 requestTemplate + 入参 + contentKind 建议（仅透出）→ 用户填真实参数 →「测试一次」前弹「将真实调用」提示 → 通过标 tested_ok 并按返回推断 contentKind 供确认\n- ComfyUI 接入：填地址 → /api/comfyui/list 拉 checkpoint/LoRA 下拉选择 → 运行经三步生图\n- AI 造数据：造一条/造批量 JSON/造整张表，表头与选中目标所需列一致、可直接运行\n- 板块③：历史任务完整重现输入/输出；点「导入到 AI 评价」→ 板块④\n- 板块④：从③导入有结果 Task → 生成/编辑评价 Prompt → 选裁判 → 选范围 → 逐条评分（0–10）+ 结论按 inputId\n- Excel 导出正常（列名唯一）；JSON 导出/导入（version=2）刷新后完整还原；IndexedDB 刷新不丢\n\n### 异常路径（必测）\n- 导入 `version \u003c 2`（含 v1.2 旧文件）→ 明确提示「版本过旧不兼容」并拒绝，不自动迁移\n- 算法文档解析失败 → 提示；测试失败 → 诊断 + 可重试（上限 3 次）/手动修正/标 unsupported\n- 输出路径全空 → 不许标 tested_ok，但允许 unverified（带黄色角标、可运行）\n- `unverified` 目标可选并带黄角标；`tested_fail`/`unsupported` 不显示或置灰\n- 内容模式不匹配的目标置灰（文本模式灰掉纯 image 目标，生图模式灰掉纯 text 目标）\n- contentKind 与 status 独立：测试不通过但用户仍可手动选 contentKind 接入为 unverified\n- 含图置灰：纯 llm 含图置灰；base64 + 仅 URL 模型提示改 URL\n- 生图试运行强制费用弹框 + 结果不落历史；生图批量弹「约 N 次调用」预估\n- ComfyUI 地址连不上 → 明确错误提示（/api/comfyui/list 与 /run 均覆盖）\n- 部分成败标识 partial；大 JSON/大 base64 不卡死\n- 运行中刷新标 interrupted 提示重跑（不续传）；取消标 cancelled 且清空排队\n- base64 评价传压缩版、原图仍展示；Excel 重名目标列不覆盖（用 targetId）\n- 评价必须从③导入才可发起；板块①无任何评价入口；评价范围选中行只评选中条\n\n---\n\n## 十一、编程实现注意事项（交付给编程 agent）\n\n- **架构骨架先行**：第一批先搭抽象调用层 + `getApiKey(provider|keyRef)` + 5 种 adapter 骨架 + 统一接入框架 + config；骨架歪了后期难救。\n- **adapter 输出归一化**：5 种 adapter（llm/multimodal/image-api/algo-api/comfyui）必须归一为 `{ outputText, outputImages[], latencyMs }`；上层组件**禁止**按 type/modelId 的 if-else，差异全收敛在 adapter 内。\n- **核心数据原则**：值存 `TaskInput`，定义存 `paramSnapshot`，**绝不写回 `TargetConfig`**；单条模式 `inputs` 长度 = 1。\n- **两维正交草稿隔离**：ContentMode × RunMode 各自维护独立草稿，切换不互清，运行只用当前模式数据；不要串台。\n- **SCHEMA_VERSION = 2**：导入 `version \u003c 2` 拒绝并提示，不写自动迁移逻辑。\n- **IndexedDB 写入策略**：批量结果逐条返回时用 debounce/批量提交，避免频繁 IO 卡顿；捕获写入失败并提示存储不足。\n- **取消要清空排队**：已发出请求中断 + 排队未发任务一并清除，状态统一 cancelled/interrupted。\n- **试运行结果隔离**：仅结果区临时展示，不写历史 Task；生图试运行前强制费用弹框。\n- **接入测试 = 真实调用**：`/api/self-test` 用用户真实参数真实调用，**绝不 AI 编造假数据**；测试前提示「将真实调用接口」；重试上限 3 次（config 可调）。\n- **强制结构化输出**：`/api/parse-doc`、`/api/evaluate` 等 AI 调用 function calling 优先，降级 JSON + 容错解析。\n- **contentKind 与 status 两维独立**：置灰只依赖粗粒度属性（type/contentKind/图片格式/status），不逐个解析入参；不靠跑通与否判内容类型。\n- **ComfyUI 收窄实现**：内置固定模板（LoRA + prompt + checkpoint），运行时拼装；适配器处理异步三步（提交带 client_id → 轮询 history → /view 取图二进制转可展示格式）；`/api/comfyui/list` 调 `/object_info` 拉列表，**不解析工作流、不命名为 parse**；地址连不上给明确错误。\n- **生图费用提示**：试运行仅「第 1 条 × 各目标 1 次」强制弹框、不落历史；批量预估 `条数 × 生图目标数 (× 每条张数)` 弹框确认。\n- **AI 造数据按列约束**：`/api/gen-data` 造表时把选中目标所需列作为约束传 AI，保证表头与批量表格列一致、可直接运行。\n- **Next.js 14 App Router body 上限写法**：用 Route Handler 对应写法（route segment config/手动读流），勿照搬 Pages Router 的 `api.bodyParser`；body 上限 25MB。\n- **SheetJS 类型转换**：读出类型可能与 `ParamDef.type` 不符；导入时按 `paramDef.type` 强制转换 + 校验，失败行给提示。\n- **base64 压缩位置**：canvas 压缩在前端完成后再传后端评价；只压「传给裁判的副本」，结果区与存储保留原图。\n- **Excel 列名唯一**：以 `targetId`（或保证唯一展示名）生成列头，避免重名覆盖。\n- **评价逐条按 inputId 归属**：含图裁判须 multimodal；评价范围 all/selected；评价并发受 `Task.concurrency` 管控。\n\n---\n\n## 十二、实施批次\n\n### 第一批（骨架 + 核心对比）\n架构骨架（抽象调用层 / `getApiKey` / 5 种 adapter 骨架 / 统一接入框架）+ IndexedDB + JSON + `version(=2)` + 文本·生图 × 单条·批量输入（Excel + 可编辑表格 + 模式隔离）+ 目标选择置灰 + 并发·试运行·批量（分批/超时/取消/刷新中断）+ 结果区 + 耗时 + Excel 导出（列名唯一）+ 历史 + 导航 4 板块。\n\n### 第二批（智能接入）\n算法 API 接入（可选测试 + unverified + contentKind 推断确认）+ 生图远端调用（`/api/run-image` + LoRA ID）+ ComfyUI（收窄版：`/api/comfyui/list` 拉列表 + 内置模板 + 三步 `/api/comfyui/run`）。\n\n### 第三批（AI 辅助）\nAI 造数据（`/api/gen-data` 三形式 + 按列约束）+ AI 逐条评价（`/api/gen-eval-prompt` / `/api/evaluate` / 评价范围 / base64 压缩传裁判）。\n", "summary": "大模型测评平台 PRD · 最终定稿 v3"}, {"id": "doc-17", "title": "测评平台需求文档v4.2.md", "filename": "测评平台需求文档v4.2.md", "category": "需求文档", "size": 23238, "updated": "2026-06-06 14:55", "content": "大模型测评平台 PRD · 增量修订 v4.2 定稿（脚本接入 + adapter 三类 + contentKind 三标签）\n本版基于 v4，核心做三件事：①接入方式从\"模板\"改为\"脚本\"，但仅针对用户接入的目标；②adapter 从两类扩为三类（built-in / script / comfyui），内置预置目标（含裁判）走 built-in adapter 不走脚本；③contentKind 收敛为三标签（text / multimodal / image），取消 both。前端交互逻辑细节另行处理。v4 其余内容全部沿用，SCHEMA_VERSION 维持 4。\n\n〇、核心理念\n1. 接入用\"脚本\"，但只服务\"用户接入的目标\"。\n模板（把 API 拆成 url/headers/出参路径等零件填表）用户看不懂、AI 易填错，导致\"啥都没提取到还显示成功\"的 bug。改为脚本：AI 写一段能跑通的代码，跑通即可用，所见即所得，契合「文档丢给AI→AI写脚本→本地跑通→再用」的真实工作流。\n\n2. 内置预置目标（含裁判）走 built-in adapter，不走脚本（决策1，本次最重要的结构调整）。\n内置主力大模型 + 裁判模型由平台写死的 HTTP adapter 直接调用（沿用 v1.x 旧逻辑），更快更稳；裁判的结构化 JSON 输出由 built-in adapter / `/api/evaluate` 内部保证，不依赖脚本。脚本机制仅服务\"用户接入的目标\"。\n\n3. adapter 三类，输出统一归一化，上层禁 if-else。\n- **built-in**：内置预置目标（presetTargets）专用，平台写死的 HTTP 调用，不走脚本。\n- **script**：用户接入的目标专用，走脚本机制（本机子进程执行）。\n- **comfyui**：固定形态，沿用 v4。\n三类 adapter 输出统一归一化为 `{ outputText, outputImages[], latencyMs }`，上层禁 if-else 判类型；**preset 目标禁止走脚本路径**。\n\n4. contentKind 三标签，取消 both（决策9）。\n`text`（纯文本）/ `multimodal`（多模态：能额外接收图片，看图后产出仍是文本）/ `image`（生图：输出图片）。`multimodal` 的本质就是\"能额外接收图片\"的 text，无图时按 text 用，有图时发挥收图能力，不做特殊判断。\n\n删除 v4 的 requestTemplate \"填表式模板\"交互及方案B预置能力（capabilities）。注意：preset 目标的内置 HTTP 调用配置仍写在 `presetTargets.ts`（由 built-in adapter 读取），这是平台写死的、不暴露给用户的内部配置，与被删除的\"用户填表模板\"是两回事。\n\n一、数据模型变更\ntypescript\nconst SCHEMA_VERSION = 4;   // 维持 4；导入 version \u003c 4 拒绝，不自动迁移\n\ninterface TargetConfig {\n  id: string;\n  name: string;\n  type: 'custom' | 'comfyui';            // 数据模型仍两类\n  contentKind: 'text' | 'multimodal' | 'image';   // 三标签，取消 both（决策9）\n  source: 'ai-parsed' | 'manual';\n\n  // —— 执行路径区分（决策1）——\n  // preset 目标：preset=true，不带 script，由 built-in adapter 按 presetTargets.ts 内置配置（HTTP）调用。\n  // 非 preset 的 custom 目标：必带 script，走脚本机制。\n  // comfyui 目标：走 comfyui adapter，固定形态。\n  script?: {\n    lang: 'python' | 'node';             // 仅 python 正式支持，node 可选；shell 砍掉（决策8）。默认 python\n    code: string;                        // 脚本全文，从 stdin 读取 params JSON（决策2）\n    verified: boolean;                   // 是否已本地跑通且用户确认创建（决策4）\n    lastTestOutput?: string;             // 最近一次测试的原始输出 rawOutput（排查/确认用）\n    outputDir?: string;                  // 图片等产物的本地临时落地文件夹（仅临时+展示，决策6）\n  };\n\n  // 入参定义。来源 = AI 在 gen-script 时声明的\"脚本从 stdin 读取的字段清单\"（决策10），\n  // 绝不正则解析脚本代码提参。{{占位}} 仅作 UI 提示，与 stdin 字段名一一对应。\n  inputParams: ParamDef[];\n\n  comfyui?: { serverUrl: string; baseModel: string; loraName?: string; loraWeight?: number; };\n  apiKeyRef?: string;\n  status: 'unverified' | 'tested_ok' | 'tested_fail' | 'unsupported';\n  rawDoc?: string;\n  preset?: boolean;                      // true=内置预置目标，走 built-in adapter，不带 script\n}\n\n// contentKind 三标签语义（决策9）：\n//   'text'       纯文本：只接文字、出文字。\n//   'multimodal' 多模态：能额外接收图片输入，看图后产出仍是文本。不生图。\n//   'image'      生图：输出图片。只有这一类进生图模式、算生图费用。\n\n参数传递约定（决策2，防注入/类型/语法破坏）\n\n- `{{占位}}` 仅用于 UI 标识\"有哪些可变参数\"，**绝不往脚本代码做文本替换**。\n- 测试/跑批时，平台把所有参数打包成一个 params JSON，通过 **stdin（或临时 JSON 文件）** 传给脚本；脚本从 `sys.stdin`（或读文件）取值。\n- 好处：防代码注入、防引号/换行破坏语法、保留参数类型（数字仍是数字、布尔仍是布尔）。\n- AI 生成脚本（`/api/gen-script`）时统一按\"从 stdin 读取一个 params JSON\"的固定范式编写。\n\ninputParams 来源约定（决策10）\n\n- AI 生成脚本时**主动声明**\"脚本从 stdin params JSON 读取哪些字段\"，该清单即 `suggestedParams: ParamDef[]`；平台据此生成跑批表单。\n- AI 声明的字段名，必须与脚本中从 stdin 读取的 key **严格一致**；`/api/gen-script` 输出约定强制此一致性，否则跑批时脚本取不到值。\n- `{{占位}}` 与 stdin 字段名一一对应，仅作 UI 提示，**绝不正则解析脚本代码提取参数**。\n\n脚本输出约定（决策3，根治\"假成功\"bug + 防 JSON 解析抓错）\n\n- 脚本的\"结果 JSON\"必须与脚本自身的调试 `print` **严格区分**：结果 JSON 用特殊标记包裹，平台只解析标记之间的内容：\n  ```\n  ===RESULT_JSON_START==={ \"text\": \"文本结果或空\", \"images\": [\"图片路径或URL\", ...] }===RESULT_JSON_END===\n  ```\n- 平台按标记提取结果 JSON，其余 stdout 作为日志/调试展示。AI 生成脚本时遵循该约定。\n- **成功判断**：解析标记之间的 JSON，`text` 或 `images` 非空才算 success；为空、缺标记或脚本报错 → fail 并显示原因。**绝不\"脚本没崩就算成功\"**。\n- 图片：脚本存到 outputDir 文件夹，在 images 给出路径/URL；平台读取后转 base64/blob 收进结果体系（决策6/11），渲染（懒加载）+ 向用户显示文件夹地址。\n二、接入流程（板块② —— 脚本接入，仅用户接入的目标）\n适用所有非 preset 的 custom 目标（大模型/多模态/生图/算法 一视同仁）；内置 preset 目标走 built-in adapter 不在此流程内；ComfyUI 仍走固定形态（沿用 v4）。\n\n第1步：粘贴对接文档 → AI 生成脚本（默认 python），展示且可编辑\n       脚本按\"从 stdin 读取一个 params JSON\"的固定范式编写（决策2）\n       AI 同时声明\"脚本从 stdin 读取哪些字段\"→ suggestedParams（决策10）\n       {{参数名}} 仅作 UI 提示，与 stdin 字段名一一对应（不做文本替换）\n       脚本结果以 ===RESULT_JSON_START===...===RESULT_JSON_END=== 标记输出（决策3）\n\n第2步：「运行测试」→ 平台在本机后端起子进程执行脚本（见第三章）\n       参数经 stdin/临时文件注入，不拼接进 code（决策2）\n       同窗口实时显示 stdout/stderr，无需开终端\n       ├─ 报错/缺库/缺环境 →「让AI修复」：stderr全文+退出码+环境探测喂回AI（决策5）\n       │   → AI 给\"分步骤、含具体终端命令\"的解决方案（如 pip install requests、安装 python 指引）\n       │   → 用户照做后再测（循环，修复次数上限 3 次，config 可调）\n       └─ 通过 → 按 RESULT_JSON 标记提取结果，按\"非空\"判真成功\n\n第3步：测试通过 → 显著展示三项（默认显眼、不折叠）供用户确认（决策4，防假正确）\n       ① 本次测试塞入的输入参数值\n       ② 脚本原始输出（rawOutput / lastTestOutput）\n       ③ 渲染结果（文本/图片懒加载）\n       提示：\"请确认输出为真实有效结果（非示例/占位）\"\n       （技术细节/脚本代码仍可折叠，但上述三项是判断脚本对错的唯一依据，必须默认显示）\n\n第4步：用户点「确认创建」→ 才提炼参数 + 确认 contentKind + 保存（决策4）\n       → inputParams 直接采用 AI 声明的 stdin 字段清单（决策10），用户确认每参数 type/required/说明\n       → 确认 contentKind（平台据测试结果给建议：输出图片→image / 能看图出文字→multimodal /\n         仅文本→text，用户最终确认，决策9）\n       → 保存为 TargetConfig（script.verified=true, status=tested_ok）\n       以后跑批 = 用户填 inputParams → 打包成 params JSON 经 stdin 传脚本 → 跑脚本 → 取结果\n要点：\n\n- **测试通过不自动建接口**：必须显著展示输入+原始输出+渲染结果，用户点「确认创建」才建。返回示例/占位内容时用户可据此识别并拒绝创建。\n- AI 解读分层展示：脚本全文/技术细节默认折叠，「查看/编辑脚本」才展开；但第3步三项默认显示。\n- 脚本/字段始终可手动编辑（手动兜底）。\n- 跑不通也可强存 unverified（黄角标、自负风险）。\n- 输出 JSON 解析不到非空内容 → 不许标 tested_ok。\n三、脚本执行机制（关键技术约束）\n脚本不能在浏览器跑，在本机的 Next.js 后端跑（仅 script adapter；built-in / comfyui 不涉及子进程）。\n\n前端点「运行测试 / 跑批」（仅用户接入的 script 目标）\n   ↓ 请求\n后端 Next.js API（用户本机 node 进程）\n   ↓ 把参数打包成 params JSON，经 stdin / 临时 JSON 文件 注入（决策2，不拼进 code）\n   ↓ child_process 起子进程执行脚本（每次执行独立子目录/唯一文件名，决策6）\n   ↓ 收集 stdout / stderr / 退出码 exitCode / 耗时；并探测环境 envInfo（决策5）\n   ↓ 按 ===RESULT_JSON_START===...===RESULT_JSON_END=== 标记提取结果 JSON（决策3）\n   ↓ 读取 outputDir 图片 → 转 base64/blob 收进结果体系（决策6/11）\n   ↓ 返回前端展示、渲染图片\n约束：\n\n- **执行环境**：脚本一律本机后端子进程执行（与 v4「外部调用走后端」架构一致）。\n- **参数传递**（决策2）：params JSON 经 stdin/临时文件注入，禁字符串替换拼进 code；保留类型、防注入、防引号换行破坏语法。\n- **结果区分**（决策3）：只解析 RESULT_JSON 标记之间的内容；其余 stdout 作为日志/调试展示。\n- **超时与进程管理**（决策7）：超时默认 60s（config 可调）→ 杀子进程；**Windows 需杀进程树**（确保子进程的子进程一并清理，资源回收干净）；超时/取消后确保进程不堆积。\n- **失败信息**（决策5）：失败时后端捕获并返回 `stderr 全文 + exitCode + envInfo`（如\"未检测到 python 命令 / python 版本\"），喂给 `/api/fix-script` 让 AI 给\"分步骤、可直接照做、含具体终端命令\"的解决方案；修复次数上限 3 次（config 可调）。\n- **图片产物**（决策6/11）：脚本存到 outputDir 的图片，平台读取后转 base64/blob 存进正常结果体系（走 IndexedDB / 历史重现 / JSON 导出），与其他生图目标一致；outputDir 仅作临时落地 + 向用户展示\"原图所在文件夹\"，**不作为结果唯一存储**。并发执行时每次用独立子目录/唯一文件名，避免产物互相覆盖。存储/压缩规则沿用 v4：存原图；传裁判时前端 canvas 压缩（最长边 1024px）；IndexedDB 写入失败提示\"存储空间不足，建议改用 URL 图片或导出备份\"。\n- **key 注入**（决策7）：脚本所需 key 经 apiKeyRef 从 `.env.local` 注入子进程环境变量，不硬编码进脚本明文持久化；建议只注入该目标声明的那一个 key（为干净，非强制）；脚本结束后可提示用户\"如含敏感信息可前往清理\"。\n- **并发上限**（决策7）：脚本子进程比 HTTP 调用重（解释器冷启动开销），并发上限沿用 Task.concurrency（1~10）。\n\n前置要求（决策5）：使用脚本接入需本机安装 Python 3.x 并可在命令行调用；首次使用按 AI 引导完成环境/依赖安装（无论没装 python / 缺库 / PATH / 报错，AI 都引导用户到终端逐步解决，平台负责把准确错误信息喂给 AI）。\n\n⚠️ 安全边界（沿用 v4.2 原文）：本工具定位纯本地、单人自用。脚本在用户本机、用户主动点击下执行，等同用户平时手动跑脚本，不引入新风险。本期不做沙箱；若未来对外多用户开放，须另上沙箱隔离。\n\n四、跑批时调用（三类 adapter 衔接）\n- **built-in 目标（preset）**：用户在板块①填 inputParams → built-in adapter 按 presetTargets.ts 内置配置发 HTTP 请求（沿用 v1.x 旧逻辑）→ 归一化结果。\n- **script 目标（用户接入）**：把每条 TaskInput 的值打包成 params JSON 经 stdin 传脚本（决策2）→ 子进程执行 → 按 RESULT_JSON 标记取结果 → 图片转结果体系。\n- **comfyui 目标**：沿用 v4。\n- 逐条/并发执行（并发受 Task.concurrency 管控，1~10）。\n- 取结果：三类 adapter 均归一化为 `{ outputText, outputImages[], latencyMs }`，**上层禁 if-else 判类型**。\n- 成功/失败判定：script 目标按 RESULT_JSON 标记非空判成功（决策3）；built-in/comfyui 按各自 adapter 内置判定。\n五、AI 评价（板块④）裁判机制（决策1，沿用旧逻辑）\n- 裁判走 **built-in adapter**（内置预置目标，不走脚本），更快更稳。\n- `/api/evaluate` 内部**强制裁判输出结构化评分 JSON**：function calling 优先 + 后端容错解析兜底，不依赖脚本。\n- 裁判目标筛选受 contentKind 规则约束（见第六节）：被评结果**含图片时，裁判须为 multimodal**，不可用 image（生图）当裁判。\n- presetTargets.ts 至少含一个可用裁判目标（contentKind='multimodal'，preset=true，status=tested_ok），开箱即用。\n\n六、contentKind 三标签筛选与裁判规则（决策9）\n- **文本模式**：可选 `text` 与 `multimodal`。\n- **生图模式**：仅可选 `image`；`multimodal` 不进生图模式（multimodal 输出是文字，绝不算生图费用——这是 Kimi/Qwen 之前的 bug 根源）。\n- **输入有图时**：`text` 置灰（接不了图，提示\"该目标不支持图片输入，已传入图片\"）；`multimodal` 照常可选（它能收图）。\n- **裁判选择**：被评结果含图片时，裁判须为 `multimodal`，不可用 `image`（生图）当裁判。\n- **算生图费用**：仅 `image`。\n- **接入时 contentKind 推断**：测试输出仅文本→建议 `text`；能看图输出文字→`multimodal`；输出图片→`image`；用户最终确认。\n\n七、后端 API 变更\n删除：/api/parse-doc（模板解析）、/api/run-custom（模板执行）、方案B capabilities 相关\n\n新增：\nPOST /api/gen-script    文档 → AI 生成脚本（仅用户接入的目标；preset 目标不走此路径）\n  入参：{ doc, lang? }   // lang 仅 'python'（默认）| 'node'\n  出参：{ code, suggestedParams: ParamDef[], suggestedContentKind, notes[] }\n  约定（决策2/10）：\n   - 脚本按\"从 stdin 读取一个 params JSON\"固定范式编写；结果以 RESULT_JSON 标记输出。\n   - suggestedParams 即 AI 声明的\"脚本从 stdin 读取的字段清单\"，字段名须与脚本读取 key 严格一致。\n   - suggestedContentKind ∈ text|multimodal|image。\n\nPOST /api/run-script    本机后端执行脚本（测试/跑批共用）\n  入参：{ lang, code, paramValues }   // paramValues 经 stdin/临时文件注入，不拼进 code（决策2）\n  处理：child_process 子进程执行；超时杀进程（Windows 杀进程树）；注入 apiKeyRef 环境变量；\n        独立子目录/唯一文件名；按 RESULT_JSON 标记提取结果；图片转 base64/blob 进结果体系\n  出参：成功 { ok:true, text, images[], outputDir, rawOutput, latencyMs }\n        失败 { ok:false, error, stderr, exitCode, envInfo, latencyMs }   // 补 exitCode + envInfo（决策5）\n  ⚠️ 按 RESULT_JSON 标记非空判成功；缺库/缺环境返回完整诊断信息\n\nPOST /api/fix-script    报错喂回 AI 修复\n  入参：{ code, error, stderr, exitCode, envInfo }   // 补 exitCode + envInfo（决策5）\n  出参：{ code, explanation, steps[] }   // 改好的脚本 + 分步骤、含具体终端命令的解决方案\n  ⚠️ 修复次数上限 3 次（config 可调），避免无限循环烧 token\n\n保留（沿用v4）：/api/comfyui/list、/api/comfyui/run、/api/gen-data、\n              /api/gen-eval-prompt、/api/evaluate（裁判走 built-in、内部强制结构化 JSON）\nbody 上限 25MB，App Router Route Handler 写法。\n八、配置变更\n删除 config/capabilities.ts（方案B不再需要）。\n保留 config/presetTargets.ts：内置预置目标以 built-in 形态预置（非脚本，不带 script），\n   preset=true、status=tested_ok，preset 目标的内置 HTTP 调用配置写死在此（由 built-in adapter 读取）；\n   至少含一个可用裁判目标（contentKind='multimodal'），开箱即用。\n保留 config/comfyTemplate.ts、config/runtime.ts。\nconfig/runtime.ts 增加（决策5/6/7）：\n   - 脚本修复次数上限（默认 3）\n   - 脚本产物根目录（默认 ./outputs）\n   - 脚本执行超时（默认 60s）\n九、明确不做（v4.2 调整）\n删除\"模板接入\"（不再有用户填表的 requestTemplate / 出参JSONPath填表 / 方案B预置能力）。\n   注意：preset 目标的内置 HTTP 配置写在 presetTargets.ts，由 built-in adapter 调用，属平台内部写死配置，不暴露给用户，与被删的\"用户填表模板\"不同。\n**shell 脚本接入**：本期不做。script.lang 仅正式支持 python，node 可选，shell 砍掉（跨平台可移植性差，Windows 无 bash）（决策8）。\n沙箱隔离：本期不做（纯本地自用，脚本在用户本机主动执行）；若未来对外多用户须另上沙箱。\n其余沿用 v4：仅非流式（或脚本自行处理流式细节）、任意ComfyUI工作流、AI假数据自测、本地跑SD/Diffusers、本地上传LoRA、用户登录/云部署、断点续传等。\n十、验收标准（v4.2 定稿）\n理想路径\n- 内置预置目标（含裁判）走 built-in adapter、不走脚本，评价开箱可用、裁判输出结构化评分 JSON（决策1）。\n- 粘贴文档 → AI 生成 python 脚本（从 stdin 读 params、RESULT_JSON 标记输出）→「运行测试」本机跑通 → 按标记非空判成功 → 图片转结果体系并渲染+显示文件夹 → **展示输入+原始输出+渲染结果，用户点「确认创建」** → 提炼 inputParams（AI 声明的 stdin 字段）确认 → 确认 contentKind → 存 tested_ok（决策3/4/6/10）。\n- 脚本报错（缺库/缺环境）→ 同窗口显示 stderr+exitCode+envInfo →「让AI修复」→ AI 给含具体终端命令的分步方案 → 用户照做 → 重跑通过（修复不超 3 次，决策5）。\n- 跑批：填 inputParams → 打包 params JSON 经 stdin 传脚本 → 并发执行 → 结果归一展示。\n- JSON 导出导入 version=4 还原；脚本生图导出后另一环境可正常重现（不依赖本地 outputDir 文件，决策6）。\n\n异常/必测路径\n- 导入 version\u003c4 → 拒绝并提示\"版本过旧不兼容\"。\n- 参数经 stdin 传入：prompt 含引号/换行不破坏脚本、不注入（决策2）。\n- 结果 JSON 与调试日志正确区分（RESULT_JSON 标记），解析无误（决策3）。\n- 测试通过后展示输入+原始输出+渲染结果，用户确认后才创建接口；返回示例/占位内容时用户可据此识别并拒绝创建（决策4）。\n- 环境缺失（无 python/缺库）→ AI 给出含具体终端命令的分步引导；修复循环不超 3 次（决策5）。\n- 脚本图片转入结果体系（base64/blob），JSON 导出后另一环境可正常重现；IndexedDB 写入失败提示存储不足（决策6/11）。\n- 超时杀进程（Windows 杀进程树），进程不堆积（决策7）。\n- contentKind 规则（决策9）：文本模式仅 text|multimodal；生图模式仅 image（multimodal 不进生图模式、不算生图费用）；输入有图时 text 置灰、multimodal 正常；被评结果含图时裁判须 multimodal、不可 image。\n- 脚本跑不通 → 显示 stderr + 可AI修复/手动改/标 unsupported；可强存 unverified（黄角标）。\n- 脚本输出 JSON 为空/缺标记/格式不对 → 判失败、不许标 tested_ok、提示原因（根治\"假成功\"）。\n- preset 目标禁止走脚本路径（决策1）。\n\n十一、编程实现注意事项\n- **adapter 三类**：built-in（preset 专用，平台写死 HTTP，不走脚本）/ script（用户接入，子进程执行）/ comfyui（沿用 v4）；输出统一归一化 `{outputText, outputImages[], latencyMs}`，上层禁 if-else；**preset 目标禁走脚本路径**（决策1）。\n- **stdin 传参禁字符串替换**：params 打包成 JSON 经 stdin/临时文件注入，绝不拼进 code；防注入、防引号换行破坏语法、保留类型（决策2）。\n- **结果 JSON 标记区分日志**：只解析 ===RESULT_JSON_START===...===RESULT_JSON_END=== 之间内容，其余 stdout 当日志；成功=标记内 {text,images[]} 非空，绝不\"没崩就成功\"（决策3）。\n- **测试通过不自动建接口**：必须展示输入+原始输出+渲染结果，用户「确认创建」才建（决策4）。\n- **失败诊断 + AI 分步修复**：失败返回 stderr 全文+exitCode+envInfo；fix-script 给含具体终端命令的分步方案；修复上限 3 次（决策5）。\n- **图片转结果体系**：脚本图片读取后转 base64/blob 进 IndexedDB/历史/导出，沿用 v4 存储/压缩规则（存原图、传裁判 canvas 压缩最长边 1024px、写入失败提示存储不足）；outputDir 仅临时；并发用独立子目录/唯一文件名（决策6/11）。\n- **进程管理**：超时（默认 60s，config 可调）杀进程，**Windows 杀进程树**；超时/取消后进程不堆积；并发沿用 Task.concurrency（1~10）；key 经 apiKeyRef 环境变量注入不落明文（决策7）。\n- **lang 仅 python（node 可选）**：shell 砍掉（决策8）。\n- **contentKind 三标签**：text|multimodal|image，无 both；按规则表筛选/置灰/裁判（决策9）。\n- **inputParams = AI 声明的 stdin 字段**：suggestedParams 即 AI 声明的字段清单，字段名与脚本读取 key 严格一致；{{占位}} 仅 UI 提示，绝不正则抠代码提参（决策10）。\n- **AI 解读分层展示**：脚本/技术细节默认折叠，但\"输入+原始输出+渲染结果\"三项默认显示。", "summary": "大模型测评平台 PRD · 增量修订 v4.2 定稿（脚本接入 + adapter 三类 + contentKind 三标签）"}, {"id": "doc-18", "title": "测评平台需求文档v4.md", "filename": "测评平台需求文档v4.md", "category": "需求文档", "size": 38465, "updated": "2026-06-06 14:55", "content": "大模型测评平台 PRD · 最终定稿 v4\n\n本版在 v3 基础上并入「统一接入」重大重构：把所有目标的接入统一成「同一套接入机制 + 同一种数据结构 + 同一个接入界面」，不再区分「内置写死 config」与「用户接入」两套逻辑。SCHEMA_VERSION 升至 3。\n\n\u003e 版本说明：正文版本号统一为 v4，与文件名一致。本文件与 `测评平台需求文档v3.md`、原 `测评平台prd.md` 并存，旧文件不动。\n\n---\n\n## 〇、本次重构核心理念（务必贯彻全文）\n\n把所有目标的接入，统一成「同一套接入机制 + 同一种数据结构 + 同一个接入界面」。不再区分「内置写死 config」和「用户接入」两套逻辑。\n\n**一张接入表单，两种填法**：\n- 方式 A「AI 解析文档」：粘贴对接文档 → AI 自动填好整张表单。\n- 方式 B「手动填写」：直接填表单，或在 AI 填好的基础上逐字段修改。\n\n两种填法产出**完全相同的 `TargetConfig`**，存储、调用、跑批一视同仁。AI 解析只是「帮你填表的快捷键」，填不准的地方人工手动改即可（**手动可改 = 核心兜底**）。\n\n---\n\n## 一、项目概述\n\n本地运行的网页工具，供算法工程师调试 prompt、产品/运营对比不同大模型、多模态模型、生图模型与算法 API 的输出效果。支持文本/生图两种内容模式，单条/批量两种运行模式，单条调试 + Excel 批量处理 + 试运行预览 + AI 造数据 + AI 逐条评价 + Excel/JSON 导出。\n\n核心特点：\n\n- 纯本地运行，IndexedDB 自动持久化，刷新/重开数据不丢\n- JSON 导出/导入做备份与迁移（SCHEMA_VERSION=3，旧版本拒绝导入、不自动迁移）\n- **统一接入**：所有目标（大模型/多模态/生图/算法 API）走同一套接入机制、同一种数据结构（`TargetConfig`，`type='custom'`）、同一个接入界面；ComfyUI（`type='comfyui'`）因固定形态独立保留\n- 一张表单两种填法：AI 解析文档自动填表 / 手动填或改，产出相同 `TargetConfig`\n- 两个正交维度：内容模式 ContentMode（text/image）× 运行模式 RunMode（single/batch），各维度独立草稿、切换不互清\n- 大模型仅非流式接入（发请求 → 等一次性完整返回 → 取结果）\n- 方案 B 预置安全能力（签名/时间戳/两步认证/图片编码等由平台写死的安全函数，AI/用户只能勾选声明、绝不执行 AI 生成代码）\n- AI 造数据（造一条 / 造批量 JSON / 造整张表，按目标所需列约束）\n- 跑批与评价彻底分离：评价为独立板块，必须从「结果与历史」导入有结果的 Task 才能评\n- 架构为「未来切换纯前端 + 用户自填 key」预留余地\n\n---\n\n## 二、技术栈与架构约束\n\n### 2.1 技术栈\n\n- 框架：Next.js 14（App Router）+ TypeScript\n- UI：Tailwind CSS + shadcn/ui\n- 外部调用：当前全部经 Next.js API 路由，密钥从 `.env.local` 读，绝不暴露前端\n- 持久化：IndexedDB（dexie）\n- Excel：xlsx（SheetJS），前端解析与生成\n- 图片压缩：前端 canvas\n- 运行：本地 `npm run dev`，访问 `localhost:3000`\n- 不使用：云数据库、云部署、用户登录\n\n### 2.2 架构约束\n\n1. **模块化、低耦合**：每个功能模块为独立组件，新增小功能只加组件、不动主流程；业务逻辑与 UI 分离（hooks/service）。\n2. **抽象调用层**：所有外部调用走 `services/*Client.ts`。当前打到 Next.js API 路由；未来切前端直连只改调用层。⚠️ 未来纯前端直连部分目标受 CORS 限制可能仍需轻量代理。\n3. **Key 来源抽象**：统一 `getApiKey(keyRef)`（当前 `process.env[keyRef]` 从 `.env.local` 读），未来改前端输入只换此处。\n4. **适配器模式（收敛为两类）**：adapter 收敛为 `custom` 与 `comfyui` 两类，新增能力=改配置而非加代码；上层组件禁止按目标差异 if-else，差异全收敛在 adapter 内。\n5. **配置集中**：预置目标、预置安全能力清单、并发、超时、body 上限、测试重试上限等进 `config/`。\n6. **统一接入框架**：除 ComfyUI 外，所有目标的接入、存储、调用、跑批共用一套 `TargetConfig` + 一个接入界面 + 一个执行入口（`/api/run-custom`），无「改代码加模型」路径。\n\n实施提醒：第一批先搭骨架（抽象调用层 + `getApiKey` + custom/comfyui 两类 adapter 骨架 + 统一接入框架 + config + presetTargets），骨架歪了后期难救。\n\n---\n\n## 三、数据模型\n\n```typescript\nconst SCHEMA_VERSION = 3;   // ⚠️ 导入 version \u003c 3（含 v1.2 的 1、v3 的 2）拒绝，不做自动迁移\n\n// ===== 两个正交维度 =====\ntype ContentMode = 'text' | 'image';   // 内容模式：文本 / 生图\ntype RunMode     = 'single' | 'batch'; // 运行模式：单条 / 批量\n// ContentMode × RunMode 正交，各自维护独立草稿，切换不互相清空，运行只用当前模式数据\n\n// ===== 统一目标类型（重构核心）=====\ntype TargetType = 'custom' | 'comfyui';\n// 'custom'：统一指代所有「通过接入机制（AI 解析或手动）配置的目标」——涵盖大模型、多模态、生图、算法 API\n// 'comfyui'：保持独立（固定形态，性质不同）\n// 不再有 llm / multimodal / image-api / algo-api 独立 type，也无「写死 config」的接入路径\n// custom 目标的差异（输出文本/图片、是否多模态收图）由 contentKind 表达\n\n// ===== 内容能力维度（置灰依据，与可用性 status 独立两维）=====\ntype ContentKind = 'text' | 'image' | 'both';\n\ninterface Project {\n  id: string;\n  version: number;                  // = SCHEMA_VERSION（导入时 version \u003c 3 直接拒绝）\n  name: string;\n  createTime: number;\n  updateTime: number;\n  targetConfigs: TargetConfig[];    // 所有目标（含 presetTargets 预置项 + 用户接入项）统一存这里，只存定义\n  tasks: Task[];\n}\n\ninterface Task {\n  id: string;\n  createTime: number;\n  finishTime?: number;\n  contentMode: ContentMode;         // 本次任务的内容模式\n  runMode: RunMode;                 // 单条 | 批量\n  inputs: TaskInput[];\n  targetIds: string[];\n  concurrency: number;              // 1~10，默认 3\n  paramSnapshot: {                  // 只存定义/列映射，不存值\n    targetId: string;\n    paramDefs: ParamDef[];\n  }[];\n  results: ResultRow[];\n  evaluation?: Evaluation;          // 仅当从板块③导入到板块④评价后才写入\n  status: 'idle' | 'running' | 'partial' | 'done' | 'error' | 'cancelled';\n}\n\ninterface TaskInput {               // 所有“值”都存这里\n  id: string;\n  prompt: string;\n  images: ImageItem[];\n  extraFields?: Record\u003cstring, any\u003e;   // 各目标参数值（含 image 参数的 URL 字符串、LoRA ID 等）\n}\n\ninterface ImageItem {\n  id: string;\n  name: string;\n  source: 'url' | 'base64';\n  value: string;\n}\n\ninterface ResultRow {\n  inputId: string;\n  items: ResultItem[];\n}\n\ninterface ResultItem {\n  targetId: string;\n  targetName: string;\n  status: 'pending' | 'running' | 'success' | 'error' | 'interrupted';\n  outputText?: string;\n  outputImages?: string[];          // 展示用原图；单目标可返回多张（生图）\n  latencyMs?: number;\n  error?: string;\n}\n\n// ===== 统一目标配置（一个结构装下所有 custom 目标 + comfyui）=====\ninterface TargetConfig {\n  id: string;\n  name: string;\n  type: 'custom' | 'comfyui';\n  contentKind: ContentKind;          // 内容能力（置灰依据）：text | image | both\n  source: 'ai-parsed' | 'manual';    // 由 AI 解析得来 还是 手动填写（仅标记来源，行为完全一致）\n  inputParams: ParamDef[];           // 入参定义（AI 解析或手动定义；跑批时由 TaskInput 提供真实值）\n\n  // —— custom 通用请求描述（大模型/多模态/生图/算法共用同一结构）——\n  requestTemplate?: {\n    url: string;\n    method: 'GET' | 'POST';\n    headers: { key: string; value: string }[];\n    bodyTemplate: string;            // 含 {{参数}} 占位，运行时用 TaskInput 真实值填充\n    stream: false;                   // ⚠️ 本期仅支持非流式，恒为 false\n    preprocess?: string[];           // 方案 B：声明所需预置安全能力（仅可从 capabilities 清单中勾选）\n    outputTextPath?: string;         // 从响应取文本的路径（JSONPath 风格）\n    outputImagePath?: string;        // 从响应取图片的路径\n  };\n\n  // —— comfyui 专用（沿用 v3，固定形态：LoRA + prompt + checkpoint）——\n  comfyui?: {\n    serverUrl: string;\n    baseModel: string;               // checkpoint（由 /api/comfyui/list 拉取后下拉选择）\n    loraName?: string;               // LoRA（由 /api/comfyui/list 拉取后下拉选择，可选）\n    loraWeight?: number;             // LoRA 权重，可选\n  };\n\n  apiKeyRef?: string;                // key 的环境变量引用名（如 'MY_API_KEY'），真值在服务端 .env.local\n  status: 'unverified' | 'tested_ok' | 'tested_fail' | 'unsupported';\n  rawDoc?: string;                   // AI 解析时粘贴的文档原文（手动填则可空）\n  preset?: boolean;                  // true=内置预置目标（来自 presetTargets，一般只读/不可删，status 视为 tested_ok）\n}\n\ninterface ParamDef {\n  name: string;\n  type: 'string' | 'number' | 'boolean' | 'image';\n  required: boolean;\n  desc?: string;\n  defaultValue?: any;\n  value?: any;   // ⚠️ TargetConfig 中仅占位、无效、不持久化；真值存 TaskInput\n}\n\n// ===== AI 造数据请求（沿用 v3）=====\ninterface GenDataRequest {\n  contentMode: ContentMode;\n  shape: 'one' | 'batch-json' | 'table';   // 造一条 / 造批量 JSON / 造整张表\n  count?: number;\n  requirement: string;\n  targetColumns: string[];           // 当前选中目标所需列（prompt / image_url / 各参数名），作为约束传给 AI\n}\n\n// ===== AI 评价（沿用 v3）=====\ninterface Evaluation {\n  userRequirement: string;\n  evalPrompt: string;\n  evalModelId: string;               // 裁判目标 id（含图裁判须 contentKind 含 image）\n  scope?: 'all' | 'selected';        // 评价范围：全量 / 选中行\n  selectedInputIds?: string[];       // scope='selected' 时生效\n  status: 'idle' | 'running' | 'done' | 'error';\n  results?: {\n    inputId: string;\n    scores: { targetId: string; score: number; comment: string }[];  // 0–10，一位小数\n    summary: string;\n    recommendation: string;\n  }[];\n}\n```\n\n**重构要点**：\n- **删除 v3 的 `ModelConfig` 独立结构**。内置目标不再写死为独立结构，改为以 `TargetConfig`（`preset=true`）形态预置在 `config/presetTargets.ts`（见第七章）。\n- AI 解析（方式 A）与手动填写（方式 B）产出的 `TargetConfig` 字段结构完全相同，仅 `source` 标记来源、行为一致；**全字段始终可手动编辑**。\n\n**核心数据原则（不变）**：值永远存 `TaskInput`；定义存 `paramSnapshot`；绝不把值写回 `TargetConfig`；单条模式同样遵守（`inputs` 长度 = 1）。\n\n**status 与 contentKind 是独立两维**：`status` 表达可用性（能否被选），`contentKind` 表达内容能力（文本/生图，作为内容模式匹配置灰依据）。不靠「跑通与否」判内容类型。\n\n---\n\n## 四、前端导航（4 大板块）\n\n前端导航为 4 大板块，跑批与评价刻意分离：\n\n**① 跑批 / 大模型对比**\n输入区（内容模式 × 运行模式）+ 目标选择（按内容模式置灰）+ 运行（试运行 / 批量）+ 结果区。\n\u003e 注明：「跑批与评价刻意分离，保持跑批清爽，需评价时到④主动发起。」本板块不出现任何评价入口。\n\n**② 大模型 / 算法配置（统一接入管理）**\n一张接入表单 + 两种填法（AI 解析文档 / 手动填或改）；接入管理（增删查改 + 状态机 + 测试一次）+ 内置预置目标只读展示。所有目标（大模型/多模态/生图/算法 API）走此界面，ComfyUI 在同板块以固定形态接入。\n\n**③ 结果与历史**\n历史任务列表（时间倒序）与详情，完整重现输入/输出。提供「导入到 AI 评价」入口，把某个有结果的 Task 交给板块④。\n\n**④ AI 智能评价**\n必须从③导入一个有结果的 Task 才能评。填测评需求 → 生成/编辑评价 Prompt → 选裁判目标 → 选评价范围 → 逐条评价。\n\u003e 注明：「跑批与评价刻意分离，保持跑批清爽，需评价时到④主动发起。」\n\n---\n\n## 五、功能需求\n\n### 模块 1：顶部工具栏\n- 新建项目（有未导出修改时二次确认）\n- 导入 JSON：校验 `version`，**`version \u003c 3` 直接拒绝并明确提示「版本过旧不兼容」，不做自动迁移**；覆盖前二次确认\n- 导出 JSON（`项目名_YYYYMMDD_HHmm.json`），写入 `version = SCHEMA_VERSION(3)`\n- 项目名可重命名；IndexedDB 自动保存，JSON 仅备份/迁移\n\n### 模块 2：板块② —— 统一接入（一张表单 + 两种填法）\n\n#### 2.1 接入流程（custom 目标）\n所有目标（大模型/多模态/生图/算法 API）走同一张表单：\n\n```\n接入一个目标：\n  方式A「AI 解析文档」：粘贴对接文档 → /api/parse-doc → AI 自动填好整张表单\n        （requestTemplate + inputParams + contentKind 建议 + preprocess 建议 + warnings）\n  方式B「手动填写」：直接填表单，或在 AI 填好的基础上逐字段修改\n   ↓ 两种方式产出相同的 TargetConfig（仅 source 标记来源），全字段始终可手动编辑\n   ↓ 可选「测试一次」（用用户真实参数真实调用，绝不 AI 编造假数据）\n      ├─ 通过 → tested_ok\n      └─ 不测 / 未通过 → unverified（可运行，自负风险，黄色角标）\n   ↓ 存入 Project.targetConfigs\n```\n\n- **无任何「改代码加模型」路径**；AI 解析填不准的字段用户手动改即可（手动可改是核心兜底）。\n- AI 解析走 `/api/parse-doc`：**强制结构化输出（function calling 优先，降级 JSON + 容错解析）**，仅透出，全字段可手动改。\n- 「测试一次」前**强制提示「将真实调用接口，请确认参数正确」**；测试 = 用用户真实参数真实调用（`/api/self-test`），**绝不做 AI 编造假数据自测**。\n- **输出路径全空时不许标 `tested_ok`**（`outputTextPath` 与 `outputImagePath` 均空）；但**允许 `unverified`**。\n- 失败后可：重试（**上限 3 次，config 可调**）/ 手动修正 / 标 `unsupported`。\n- 列表支持查看/编辑/删除/重新解析（预置目标只读/一般不可删）。\n\n#### 2.2 大模型仅非流式接入\n- 通过接入机制配置的大模型一律非流式（`requestTemplate.stream = false`）：发请求 → 等一次性完整返回 → 按 `outputTextPath` 取结果。\n- **不支持流式/打字机效果**（移入「明确不做」）。\n- 个别只给流式、无法非流式的模型 → 标 `unsupported`。\n\n#### 2.3 方案 B：预置安全能力（签名/时间戳/两步认证/图片编码）\n- 平台预置一份**安全能力清单**（`config/capabilities.ts`，开发写死的安全函数），AI 解析或用户**只能从清单中勾选/声明**，写入 `requestTemplate.preprocess[]`。\n- 初期清单含：`md5_sign`、`hmac_sha256`、`timestamp`、`two_step_auth`、`image_as_url`、`image_as_base64`，后续按需扩展（往清单加安全函数即可）。\n- 运行/测试时，平台在发请求前按 `preprocess[]` 依次调用对应的平台自有安全函数处理（注入签名/时间戳/完成两步认证/转换图片编码等）。\n- ⚠️ **红线**：能力清单是开发预先写死的，AI/用户只有「勾选权」无「创造权」；**绝不执行 AI 生成的代码（非沙箱）**。\n\n#### 2.4 contentKind 确定（接入时确定内容类型，作为置灰依据）\n- AI 解析时给出 `contentKind` 建议值；或手动选择。\n- 「测试一次」跑通后，平台分析返回内容：含图片 → 建议 `image`；仅文本 → `text`；两者都有 → `both`。展示推断 + 用户确认/修改（默认采纳推断）。\n- 跳过测试（`unverified`）则由用户手动选择 `contentKind`。\n- 原则：**不靠「跑通与否」判内容类型**；`status`（可用性）与 `contentKind`（置灰依据）独立两维。\n\n#### 2.5 ComfyUI 接入（type='comfyui'，固定形态「LoRA + prompt + checkpoint」）\n- **不支持任意工作流**；不解析用户工作流；无 `workflowJson` / `nodeMappings` / 「AI 识别可变节点」概念。\n- 平台内置固定工作流模板，运行时拼装提交。\n- 接入只需：填 ComfyUI 地址 → 选 checkpoint（baseModel）→ 选 LoRA（loraName，可选）+ 可选权重（loraWeight）。\n- 接入时调 `/api/comfyui/list`（底层调 ComfyUI `/object_info`）拉取可用 checkpoint / LoRA 列表供下拉选择；地址连不上时给明确错误提示。\n- `contentKind` 恒为 `image`（形态固定、恒生图、不收额外图）。\n\n#### 2.6 接入状态机\n- `unverified`：可运行，带**黄色「未验证」角标**（自负风险）\n- `tested_ok`：可运行\n- `tested_fail` / `unsupported`：不可选，不在目标选择区显示（或置灰）\n\n#### 2.7 内置预置目标只读展示\n- 展示 `config/presetTargets.ts` 中以 `TargetConfig`（`preset=true`，`status=tested_ok`）形态预置的少量主力目标，开箱即用、一般只读/不可删；其中**至少含一个可用裁判目标**（AI 评价默认用），保证评价开箱可用。\n\n### 模块 3：板块① —— 输入区（内容模式 × 运行模式）\n\n#### 3.1 两个正交维度\n- **内容模式 ContentMode**：文本 `text` / 生图 `image`\n- **运行模式 RunMode**：单条 `single` / 批量 `batch`\n- 两维度正交，**各自维护独立草稿**，切换时不互相清空/覆盖；切回原模式恢复上次草稿；正式运行只使用当前所在模式的数据生成 Task。\n\n#### 3.2 单条模式（single）\n- prompt 文本框；图片 Tab 切「本地上传(base64)」「URL」，多张可删\n- 选中目标 → 按其 `inputParams` 自动生成入参表单填值；`type:'image'` 参数复用图片输入组件；生图相关 LoRA ID 等存入 `TaskInput.extraFields`\n- 值写入该条 `TaskInput`（`inputs` 长度 = 1）\n\n#### 3.3 批量模式（batch，Excel）\n- 「下载导入模板」：按选中目标所需字段生成空 Excel；列名用固定英文 key（`prompt`、`image_url`、参数原始 name）\n- 「导入 Excel」→ 前端可编辑表格（行可查看/编辑/删除），确认再运行；不匹配列给提示\n- 落位：`prompt`→prompt；`image_url`→images(source='url')；目标参数列→`extraFields`\n- `type:'image'` 参数：批量模式下以 URL 字符串列承载（列名=参数原始 name），存入 `extraFields[参数名]`。即批量模式所有图片一律走 URL，不支持本地文件\n- 显示条数预览\n\n### 模块 4：板块① —— 目标选择（按内容模式置灰）\n\n#### 4.1 内容模式与目标的匹配规则\n- **文本模式**：只可选 `contentKind` 含 text 的目标（`custom` 且 `contentKind` 为 `text|both`）。\n- **生图模式**：只可选 `contentKind` 含 image 的目标（`custom` 含 image，或 `comfyui`，即 `contentKind` 为 `image|both`）。\n- 不匹配的目标置灰。\n\n#### 4.2 置灰属性来源说明（逻辑由开发实现，不画完整矩阵表）\n- 置灰只依赖**粗粒度属性**（`type` / `contentKind` / 图片格式 / `status`），不逐个解析入参。\n- **custom**：用 `contentKind` + `status` 置灰；图片需求由其 `inputParams` 的 `image` 参数表达。\n- **ComfyUI**：形态固定，恒生图、不收额外图。\n- 含图时纯文本目标（`contentKind='text'`）置灰；图为 base64 但目标只接收 URL → 提示改用 URL 或置灰。\n- `tested_fail` / `unsupported` 目标不显示或置灰；`unverified` 可选但带黄色角标。\n\n### 模块 5：板块① —— 试运行 \u0026 批量运行\n\n- 并发数运行前可设（1~10，默认 3，`Task.concurrency`），管控批量调用，超出排队\n- **取消** = 前端 AbortController：已发出请求中断（后端已发不保证终止）+ 排队中未发出任务一并清除，状态统一 `cancelled`/`interrupted`\n- 单调用超时（默认 60s）；运行中刷新 → 未完成标 `interrupted` 提示重跑（不做续传）\n- custom 目标走 `/api/run-custom`；ComfyUI 走 `/api/comfyui/run`\n\n#### 5.1 文本模式\n- 试运行：仅第 1 条，临时展示、不落历史\n- 批量运行：按并发分批执行\n\n#### 5.2 生图模式费用提示规范\n- **生图试运行**：仅跑「第 1 条 × 各目标各 1 次」；点击前**强制弹框**「试运行会真实调用生图，消耗 1 次额度/可能产生费用，是否继续？」；**结果不落历史**。\n- **生图批量**：运行前预估 `输入条数 × 生图目标数 (× 每条张数)`，**弹框**「将发起约 N 次生图调用，可能产生费用，确认？」。\n\n### 模块 6：板块① —— 结果对比区\n- 单条：多列卡片并排；批量：表格视图（行可展开）\n- 每结果：目标名 + 内容标签（按 contentKind）、状态、输出（文本/图片可放大，生图支持多图）、耗时（「1.2s」）、错误\n- 实时更新；部分成败 → `status=partial` 分别标识\n\n### 模块 7：板块③ —— 结果与历史\n- Task 列表（时间倒序），点击完整重现输入/输出；目标入参由 `extraFields` + `paramSnapshot.paramDefs` 还原\n- 每个有结果的 Task 提供「导入到 AI 评价」入口 → 跳板块④\n\n### 模块 8：板块④ —— AI 智能评价（逐条，独立板块）\n- **必须从板块③导入一个有结果的 Task 才能评**；板块①不出现任何评价入口\n- 填测评需求 →「生成评价 Prompt」`/api/gen-eval-prompt`（可编辑，支持 AI 自动生成）→ 选裁判目标（含图时须 `contentKind` 含 image 的目标）\n- 评价范围：默认全量；提供「仅评价选中/可见行」（`scope='selected'`），粒度支持「全选 / 试运行那条 / 手动勾选行」\n- 「开始评价」→ 对范围内每条调用 `/api/evaluate`；`results` 按 `inputId` 归属；评价并发受 `Task.concurrency` 管控\n- 逐条语义：每次调用处理一条输入，传入 `results[]` = 该 inputId 下各目标的 ResultItem，裁判横向对比该条各目标输出\n- 图片传输：结果图为 URL → 只传 URL；为 base64 → 前端 canvas 压缩（最长边 1024px）后传，原图仍保留展示\n- 展示：各目标评分（0–10）+ 点评、总体结论、推荐项\n\n### 模块 9：AI 造数据（板块①，第三批）\n- 入口提供「造一条 / 造批量 JSON / 造整张表」三种产出（`GenDataRequest.shape`），产出可编辑后运行\n- 调 `/api/gen-data`：**造表时把「当前选中目标所需列」作为约束**（`targetColumns`）传给 AI，确保表头与批量表格列一致、可直接运行\n- 产出落位：单条 → 当前 TaskInput；批量 JSON / 整张表 → 批量可编辑表格\n\n### 模块 10：导出结果（Excel）\n- 每行一条输入，每目标占列；含 AI 评分列（若已评价）\n- **列名唯一性**：以 `targetId`（或保证唯一展示名）生成；建议列头 `{targetName}#{targetId简写}_输出`、`..._耗时`\n- 图片：URL → 存链接；base64 → 存占位文字 + 提示「建议用 URL 输出查看」（不打包 zip）\n- 文件名 `项目名_结果_YYYYMMDD_HHmm.xlsx`\n\n---\n\n## 六、后端 API 设计\n\n所有外部调用经服务端代理，key 按引用名从 `.env.local` 注入，绝不落前端。\n\n```\nPOST /api/parse-doc         解析任意目标文档（大模型/多模态/生图/算法）为 TargetConfig 草稿\n  入参：{ doc }\n  出参：{ requestTemplate, inputParams: ParamDef[], contentKind, preprocess[], warnings[] }\n  要点：强制结构化输出（function calling 优先，降级 JSON + 容错）；仅透出，全字段可手动改\n  ⚠️ preprocess 建议只能取自 capabilities 清单中的能力名\n\nPOST /api/self-test         【接入阶段可选测试，用用户真实参数真实调用，带诊断】\n  入参：{ requestTemplate, paramValues }   // paramValues = 用户填写的真实参数\n  处理：发请求前按 requestTemplate.preprocess[] 调平台自有安全函数处理\n  出参：成功 { ok:true, response, extractedImages[], extractedText, latencyMs }\n        失败 { ok:false, error, diagnosis }\n  ⚠️ 不得有 AI 编造假数据环节；测试 = 真实调用接口\n\nPOST /api/run-custom        【统一执行 custom 目标（合并原 run-api + run-image），非流式，纯执行】\n  入参：{ requestTemplate, paramValues }   // paramValues 来自 TaskInput\n  处理：① 发请求前按 preprocess[] 处理（签名/时间戳/两步认证/图片编码）\n        ② 用 bodyTemplate 的 {{参数}} 占位填入真实值\n        ③ 非流式发请求（stream=false），等一次性完整返回\n        ④ 按 outputTextPath / outputImagePath 取结果\n  出参：{ status, outputText?, outputImages[], latencyMs, error? }   // 归一化输出\n\nPOST /api/comfyui/list      拉取 ComfyUI 可用 checkpoint / LoRA 列表（不解析工作流）\n  入参：{ serverUrl }       // 底层调 ComfyUI /object_info\n  出参：{ checkpoints[], loras[] }   // 连不上时返回明确错误\n  ⚠️ 不叫 parse、不保留 /api/comfyui/parse；不解析用户工作流\n\nPOST /api/comfyui/run       ComfyUI 正式调用（内置固定模板 + 异步三步）\n  入参：{ comfyui: { serverUrl, baseModel, loraName?, loraWeight? }, prompt }\n  三步：提交（/prompt，带 client_id）→ 轮询 history → /view 取图（二进制转可展示格式）\n  出参：{ status, outputImages[], latencyMs, error? }\n\nPOST /api/gen-data          AI 造数据（造一条 / 造批量 JSON / 造整张表）\n  入参：{ contentMode, shape, count?, requirement, targetColumns[] }\n  出参：{ rows: Record\u003cstring, any\u003e[] }   // 表头/键名 = targetColumns，可直接运行\n\nPOST /api/gen-eval-prompt   生成（或 AI 自动生成）评价 Prompt\n  入参：{ userRequirement, targetNames[] }\n  出参：{ evalPrompt }\n\nPOST /api/evaluate          【逐条调用：一次处理一条输入】\n  入参：{ evalPrompt, evalModelId, inputId, results[] }  // results=该 inputId 下各目标 ResultItem，图片为压缩版或 URL\n  出参：{ inputId, scores[](0-10), summary, recommendation }\n```\n\n**body 上限**：相关 Route Handler 配置放大（建议 25MB），用 App Router（Route Handler）写法（route segment config / 手动读流），勿照搬 Pages Router 的 `api.bodyParser`。\n\n**API 适配说明**：v3 的 `/api/chat`、`/api/run-api`、`/api/run-image` 三者合并为统一的 `/api/run-custom`（custom 目标无论大模型/算法/生图，调用结构一致，差异由 `requestTemplate` 表达）。\n\n---\n\n## 七、配置\n\n- `.env.local`：各目标 key（用户自填，不提交）；服务端 `getApiKey(keyRef)` 按引用名注入 `process.env[keyRef]`\n- **`config/capabilities.ts`（方案 B 预置安全能力清单）**：开发写死的安全函数，初期含 `md5_sign`、`hmac_sha256`、`timestamp`、`two_step_auth`、`image_as_url`、`image_as_base64`，后续按需扩展。AI/用户只能从清单**勾选**写入 `requestTemplate.preprocess[]`，**绝不执行 AI 生成代码**（非沙箱）。运行/测试前按 `preprocess[]` 调对应函数处理请求。\n- **`config/presetTargets.ts`（内置预置目标）**：以 `TargetConfig`（`preset=true`、`status=tested_ok`）形态预置少量主力目标，开箱即用、一般只读/不可删；**至少含一个可用裁判目标**，保证 AI 评价开箱可用。不再有独立 `ModelConfig` 结构。\n- `config/comfyTemplate.ts`：ComfyUI 内置固定工作流模板（LoRA + prompt + checkpoint），不暴露给用户编辑\n- `config/runtime.ts`：默认并发(3)、上限(10)、超时(60s)、body 上限(25MB)、**接入测试重试上限(3，可调)**\n- 图床预留：`uploadImage` 默认关闭，待合规后接 OSS\n\n---\n\n## 八、数据存储与持久化规则\n\n- IndexedDB 日常自动保存（刷新不丢）；JSON 备份/迁移（带 `version` 校验，`version \u003c 3` 拒绝导入、不自动迁移）\n- 图片：url 存 url；base64 存完整 base64（展示用原图）\n- base64 传目标/裁判前前端 canvas 压缩（最长边 1024px），仅压传出副本，存储/展示保留原图\n- IndexedDB 写入用 debounce/批量提交；写入失败须捕获并提示「存储空间不足，建议改用 URL 图片或导出备份」\n- 文件名：JSON `项目名_YYYYMMDD_HHmm.json`；Excel `项目名_结果_YYYYMMDD_HHmm.xlsx`\n\n---\n\n## 九、明确不做（本期外）\n\n本版新增明确不做：\n- **流式输出 / 打字机效果**（本期仅非流式接入；只给流式、无法非流式的模型标 `unsupported`）\n- **沙箱执行代码**（方案 B 仅「从预置清单声明安全能力」，AI/用户只有勾选权无创造权，**绝不执行 AI 生成的代码**）\n\n沿用 v3 / v1.2：\n- **任意 ComfyUI 工作流**（本期仅固定 `LoRA + prompt + checkpoint` 形态，不解析用户工作流、无 nodeMappings/workflowJson）\n- **AI 假数据自测**（接入测试一律用用户真实参数真实调用）\n- **本地跑 SD / Diffusers**\n- **本地上传 LoRA 到平台**（LoRA 交 ComfyUI 管，平台只引用其 LoRA 名）\n- 用户登录/云数据库/云部署、图床上线（仅预留）、批量本地图片、断点续传、JSON 轻量导出、Excel 图片打包 zip、纯前端直连（仅架构预留）\n- 平台级「生成 N 张」统一控件 + 参数映射协议（生成数量走目标普通 ParamDef，平台零专用代码）\n\n---\n\n## 十、验收标准\n\n### 理想路径\n- 启动正常；导航 4 板块可切换；`config/presetTargets.ts` 预置目标开箱可用、含可用裁判目标\n- 板块②统一接入：\n  - 方式 A：粘贴对接文档 → `/api/parse-doc` AI 自动填好整张表单（requestTemplate + inputParams + contentKind 建议 + preprocess 建议）→ 全字段可手动改\n  - 方式 B：手动从空白填，或在 AI 填好的基础上逐字段改 → 两种方式产出相同结构的 `TargetConfig`\n  - 大模型/多模态/生图/算法 API 全部走此界面，无任何「改代码加模型」路径\n  - 方案 B：声明 `preprocess`（如 `hmac_sha256`+`timestamp`）后测试/运行能正确处理签名\n  -「测试一次」前弹「将真实调用」提示 → 用真实参数真实调用 → 通过标 tested_ok 并按返回推断 contentKind 供确认\n- 板块①：内容模式（文本/生图）× 运行模式（单条/批量）四组合可用，各维度独立草稿切换不互清\n- 单条/批量文本：混合多目标（含预置 + 接入）并排对比 + 耗时；大模型非流式一次性返回\n- 生图单条/批量：试运行弹费用确认仅跑第 1 条不落历史 → 批量弹「约 N 次调用」确认 → 多图结果展示\n- ComfyUI：填地址 → `/api/comfyui/list` 拉 checkpoint/LoRA 下拉选择 → 运行经三步生图\n- AI 造数据：三形式，表头与选中目标所需列一致、可直接运行\n- 板块③：历史任务完整重现；点「导入到 AI 评价」→ 板块④\n- 板块④：从③导入有结果 Task → 生成/编辑评价 Prompt → 选裁判 → 选范围 → 逐条评分（0–10）+ 结论按 inputId\n- Excel 导出正常（列名唯一）；JSON 导出/导入（version=3）刷新后完整还原；IndexedDB 刷新不丢\n\n### 异常路径（必测）\n- 导入 `version \u003c 3`（含 v1.2 的 1、v3 的 2 旧文件）→ 明确提示「版本过旧不兼容」并拒绝，不自动迁移\n- 文档解析失败 → 提示；解析填不准 → 用户手动改字段仍可正常接入运行（手动兜底）\n- 测试失败 → 诊断 + 可重试（上限 3 次）/手动修正/标 unsupported\n- 输出路径全空 → 不许标 tested_ok，但允许 unverified（带黄角标、可运行）\n- `unverified` 目标可选并带黄角标；`tested_fail`/`unsupported` 不显示或置灰\n- 只给流式、无法非流式的模型标 unsupported 且不可选\n- 方案 B：用户/AI 试图写任意代码 → 不接受，只能从预置清单勾选；运行绝不执行 AI 生成代码\n- 内容模式不匹配的目标置灰（文本模式灰掉纯 image，生图模式灰掉纯 text）\n- contentKind 与 status 独立：测试不通过但用户仍可手动选 contentKind 接入为 unverified\n- 含图置灰：纯文本目标含图置灰；base64 + 仅 URL 目标提示改 URL\n- 生图试运行强制费用弹框 + 结果不落历史；生图批量弹「约 N 次调用」预估\n- ComfyUI 地址连不上 → 明确错误提示（list 与 run 均覆盖）\n- 部分成败标识 partial；大 JSON/大 base64 不卡死\n- 运行中刷新标 interrupted 提示重跑（不续传）；取消标 cancelled 且清空排队\n- base64 评价传压缩版、原图仍展示；Excel 重名目标列不覆盖（用 targetId）\n- 评价必须从③导入才可发起；板块①无任何评价入口；评价范围选中行只评选中条\n\n---\n\n## 十一、编程实现注意事项（交付给编程 agent）\n\n- **统一接入是第一原则**：除 ComfyUI 外所有目标共用一套 `TargetConfig` + 一个接入界面 + 一个执行入口（`/api/run-custom`）。AI 解析与手动填写产出结构完全相同（仅 `source` 不同），存储/调用/跑批一视同仁；全字段始终可手动编辑（手动兜底）。**禁止**为大模型/算法/生图各写一套独立逻辑。\n- **删除 ModelConfig**：内置目标改为 `config/presetTargets.ts` 以 `TargetConfig`（`preset=true`、`status=tested_ok`）形态预置；至少含一个裁判目标。\n- **adapter 收敛为两类**：`custom` 与 `comfyui`，输出归一化为 `{ outputText, outputImages[], latencyMs }`；上层组件**禁止**按目标差异 if-else，差异全收敛在 adapter 内。\n- **大模型仅非流式**：`requestTemplate.stream` 恒为 `false`；发请求 → 等一次性完整返回 → 按 `outputTextPath` 取；只给流式的标 unsupported。\n- **方案 B 红线**：`preprocess[]` 只能取自 `config/capabilities.ts` 预置清单；平台在发请求前调对应安全函数处理；**绝不执行 AI/用户提供的任意代码（非沙箱）**。\n- **核心数据原则**：值存 `TaskInput`，定义存 `paramSnapshot`，**绝不写回 `TargetC
