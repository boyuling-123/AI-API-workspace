onfig`**；单条模式 `inputs` 长度 = 1。\n- **两维正交草稿隔离**：ContentMode × RunMode 各自维护独立草稿，切换不互清，运行只用当前模式数据；不要串台。\n- **SCHEMA_VERSION = 3**：导入 `version \u003c 3` 拒绝并提示，不写自动迁移逻辑。\n- **IndexedDB 写入策略**：批量结果逐条返回时用 debounce/批量提交；捕获写入失败并提示存储不足。\n- **取消要清空排队**：已发出请求中断 + 排队未发任务一并清除，状态统一 cancelled/interrupted。\n- **试运行结果隔离**：仅结果区临时展示，不写历史 Task；生图试运行前强制费用弹框。\n- **接入测试 = 真实调用**：`/api/self-test` 用用户真实参数真实调用，**绝不 AI 编造假数据**；测试前提示「将真实调用接口」；重试上限 3 次（config 可调）。\n- **强制结构化输出**：`/api/parse-doc`、`/api/evaluate` 等 AI 调用 function calling 优先，降级 JSON + 容错解析。\n- **contentKind 与 status 两维独立**：置灰只依赖粗粒度属性（type/contentKind/图片格式/status），不逐个解析入参；不靠跑通与否判内容类型。\n- **ComfyUI 收窄实现**：内置固定模板（LoRA + prompt + checkpoint）运行时拼装；适配器处理异步三步（提交带 client_id → 轮询 history → /view 取图二进制转可展示格式）；`/api/comfyui/list` 调 `/object_info` 拉列表，**不解析工作流、不命名为 parse**；地址连不上给明确错误。\n- **生图费用提示**：试运行仅「第 1 条 × 各目标 1 次」强制弹框、不落历史；批量预估 `条数 × 生图目标数 (× 每条张数)` 弹框确认。\n- **AI 造数据按列约束**：`/api/gen-data` 造表时把选中目标所需列作为约束传 AI。\n- **Next.js 14 App Router body 上限写法**：Route Handler 写法，body 上限 25MB；勿照搬 Pages Router `api.bodyParser`。\n- **SheetJS 类型转换**：导入时按 `ParamDef.type` 强制转换 + 校验，失败行给提示。\n- **base64 压缩位置**：canvas 压缩在前端完成后再传后端评价；只压「传给裁判的副本」，结果区与存储保留原图。\n- **Excel 列名唯一**：以 `targetId`（或保证唯一展示名）生成列头，避免重名覆盖。\n- **评价逐条按 inputId 归属**：含图裁判须选 `contentKind` 含 image 的目标；评价范围 all/selected；评价并发受 `Task.concurrency` 管控。\n\n---\n\n## 十二、实施批次\n\n### 第一批（骨架 + 核心对比，用 presetTargets 跑通）\n架构骨架（抽象调用层 / `getApiKey` / custom·comfyui 两类 adapter 骨架 / 统一接入框架 / config / `presetTargets.ts`）+ IndexedDB + JSON + `version(=3)` + 文本·生图 × 单条·批量输入（Excel + 可编辑表格 + 模式隔离）+ 目标选择置灰 + 并发·试运行·批量（分批/超时/取消/刷新中断）+ 结果区 + 耗时 + Excel 导出（列名唯一）+ 历史 + 导航 4 板块。**用预置目标即可跑通核心对比链路。**\n\n### 第二批（统一接入）\n统一接入界面（一张表单 + 两种填法）+ `/api/parse-doc`（解析任意目标文档、仅透出、全字段可改）+ `/api/self-test`（真实参数测试）+ `/api/run-custom`（统一非流式执行、按 preprocess 处理）+ **方案 B 预置安全能力（`config/capabilities.ts`）** + ComfyUI（收窄版：`/api/comfyui/list` 拉列表 + 内置模板 + 三步 `/api/comfyui/run`）+ contentKind 推断确认 + 接入状态机。\n\n### 第三批（AI 辅助）\nAI 造数据（`/api/gen-data` 三形式 + 按列约束）+ AI 逐条评价（`/api/gen-eval-prompt` / `/api/evaluate` / 评价范围 / base64 压缩传裁判）。\n", "summary": "大模型测评平台 PRD · 最终定稿 v4"}, {"id": "doc-19", "title": "这个网站能干啥.md", "filename": "这个网站能干啥.md", "category": "项目说明", "size": 2072, "updated": "2026-06-06 14:55", "content": "# 这个网站能干啥（人话版）\n\n一句话：**它能让好几个 AI 同时回答你的同一个问题，然后帮你比一比谁答得好。**\n\n打开地址：**http://localhost:3000**\n\n---\n\n## 它能做的 5 件事\n\n### 1. 让多个 AI 一起答题\n你写一个问题，勾选几个 AI（比如 DeepSeek、Kimi），点「运行」。\n它们会**同时**回答，答案**并排摆在一起**，你一眼就能对比。\n\n### 2. 一次问一堆问题（批量）\n不想一个个问？上传一个 Excel（每行一个问题），它会**自动跑完所有问题**。\n\n### 3. 不光能选大模型，还能接你自己的算法\n除了内置的 AI，你还能把**自己公司的接口（API）**也加进来，\n和大模型放一起比。文生图、图生图这种也支持（能出好几张图）。\n\n### 4. 看不懂别人的接口文档？让 AI 帮你读\n把一段看不懂的 API 文档**粘贴进去**，AI 会告诉你：\n地址是啥、要填哪些参数、怎么鉴权。\n（它只是**告诉你**，不会乱填，最后还是你自己填，稳。）\n\n### 5. 让 AI 当裁判，给答案打分\n跑完之后，可以**让另一个 AI 当裁判**：\n- 你说一句\"我想评什么\"，它能**自动帮你写好评分标准**；\n- 然后它给每个 AI 的答案打分（0~10 分）、写点评、告诉你**哪个最好、推荐用哪个**；\n- 这些**评分还能一起导出到 Excel**。\n\n---\n\n## 怎么用（照着点就行）\n\n1. **勾 AI** → 选你要比的几个模型\n2. **写问题** → 在输入框打字（或传 Excel 批量）\n3. **点运行** → 等答案并排出来\n4. **想打分** → 打开「AI 自评」开关 → 选裁判 AI → 写一句评价要求（或点\"AI 自动生成\"）→ 点「开始 AI 评价」\n5. **导出** → 点「导出 Excel」，答案 + 评分都在里面\n\n---\n\n## 小提醒\n\n- 这个网站**只能在这台电脑上打开**（地址是 localhost）。\n- 要用 AI 功能，电脑得联网（它后台会调用 AI）。\n- 关掉运行窗口后要重开，让技术同学帮你重新\"启动\"一下就行。\n", "summary": "这个网站能干啥（人话版）"}, {"id": "doc-20", "title": "需求文档v4.3.md", "filename": "需求文档v4.3.md", "category": "需求文档", "size": 6544, "updated": "2026-06-06 14:55", "content": "大模型测评平台 PRD · 增量 v4.3\n前提：v4.2（脚本接入全部功能）已完成。本文档仅描述 3 项新增/修复，请勿改动 v4.2 已完成的脚本接入、三标签、adapter 等代码。 仅在涉及处做最小改动。\n\n本版只做 3 件事：\n\n试运行结果改为浮层窗口展示\n新增第 5 板块「AI 评价结果与历史」\n修复 /api/gen-script、/api/fix-script 的 JSON 解析崩溃（改标记分段）\n增量 1：试运行结果 → 浮层窗口\n改动点：跑批/对比板块的「试运行」。\n\n点击「试运行」后，弹出浮层窗口（modal / 抽屉） 展示测试结果，替代原页面内嵌展示。\n浮窗内容：每个目标一张结果卡片（多目标并排或堆叠），显示：\n输出（文本 / 图片渲染，图片懒加载）\n状态、耗时\n关闭按钮\n规则不变：试运行仍为纯预览——结果不落历史、不参与 AI 评价。浮窗仅改变展示位置。\n生图试运行的费用确认弹框规则沿用原状（点击前强制提示）。\n增量 2：新增第 5 板块「AI 评价结果与历史」\n2.1 导航\n导航从 4 板块增为 5 板块，新板块「⑤ AI 评价结果与历史」紧跟「④ AI 评价」之后，点击即可直接进入（无洁癖限制，它是历史仓库）。\n2.2 板块分工（沿用现有洁癖逻辑）\n③ 结果与历史 --[去AI评测]--\u003e ④ AI评价(做评价，必须从③带批次进，沿用数据源洁癖)\n                                      │\n                                  [评价完成自动保存]\n                                      ↓\n                              ⑤ AI评价结果与历史(回看历史评价，可随便进)\n④ 干活：进入必须从③带批次（洁癖规则不变）。\n⑤ 看结果：随便点进，展示所有历史评价。\n2.3 ⑤ 布局（排版同板块③「结果与历史」）\n上方：历史评价列表（时间倒序），每条记录显示：\n评价时间 | 来源批次(Task) | 裁判模型 | 评价条数 | [查看] [导出Excel] [删除]\n下方：评价详情区，默认空；点上方某条「查看」后在下方展开。\n详情用表格（同③风格，每\"输入×目标\"一行），列：\n入参 | 出参 | 模型/算法 | 评分 | 评价(点评)\n出参：文本截断+展开；图片缩略图+点放大。\n表格末尾附该次评价的「总结 / 推荐项」。\n2.4 ⑤ 导出 Excel\n每条评价记录可导出 Excel：每行一条\"输入×目标\"，列含 入参 | 出参 | 模型 | 评分 | 点评，附总结/推荐。\n列名唯一性沿用现有规则（用 targetId 防重名覆盖）。\n文件名：项目名_AI评价_YYYYMMDD_HHmm.xlsx。\n2.5 数据模型（评价独立留存，从单条改列表）\n评价结果改为独立列表留存，不再只挂单条覆盖。SCHEMA_VERSION 升至 5（导入 \u003c5 拒绝）。\ntypescript\ninterface Project {\n  // ...沿用...\n  evaluations: EvaluationRecord[];   // 新增：所有历史评价（板块⑤唯一数据来源）\n}\n\ninterface EvaluationRecord {\n  id: string;\n  sourceTaskId: string;              // 来源批次\n  createTime: number;\n  evalModelId: string;               // 裁判目标\n  userRequirement: string;\n  evalPrompt: string;\n  scope: 'all' | 'selected';\n  selectedInputIds?: string[];\n  count: number;                     // 评价条数\n  status: 'done' | 'error';\n  results: {\n    inputId: string;\n    scores: { targetId: string; targetName: string; score: number; comment: string }[];\n    summary: string;\n    recommendation: string;\n  }[];\n}\n④ 做完一次评价 → 生成一条 EvaluationRecord 存入 Project.evaluations → ⑤ 从此列表读取。\n同一 Task 可被评价多次，每次独立留存、不覆盖。\n⚠️ 评价数据唯一权威来源 = Project.evaluations：④ 只往这里写、⑤ 只从这里读。 原 Task 上若有 evaluation 字段，废弃，不要两头存导致对不上。\n增量 3：修复 AI 生成/修复脚本的 JSON 解析崩溃（改标记分段）\n现象：/api/gen-script 报错\"AI 返回无法解析为 JSON\"。\n根因：让 AI 把整段代码塞进 JSON 字符串字段，代码里的引号/反斜杠/换行转义易出错，导致整个 JSON 解析失败。\n\n修复：/api/gen-script、/api/fix-script 的 AI 输出改用标记分段，代码原文直取，不塞 JSON：\n\n===SCRIPT_START===\n(脚本原文，无需任何转义)\n===SCRIPT_END===\n===META_START===\n{\"suggestedParams\":[...],\"suggestedContentKind\":\"...\",\"notes\":[...]}\n===META_END===\n平台解析：\nSCRIPT 标记间内容 → 直接作为 code（原文直取，不当 JSON 解析）。\nMETA 标记间内容 → 小 JSON 再解析（不含代码，几乎不会崩）。\n/api/fix-script 返回修复后的脚本，同样用 SCRIPT 标记包裹，不塞进 JSON。\n解析失败时给用户友好报错，并保留「重试 / 更换解读模型」按钮（已有）。\n与现有\"结果 JSON 用标记包裹\"思路一致，把它应用到\"生成/修复脚本\"这一层。\n通用规则（写入编程注意事项）：凡 AI 返回含代码/长文本，一律用标记分段（===XXX_START===...===XXX_END===），禁止把代码塞进 JSON 字符串字段。\n\n验收标准（仅本次 3 项）\n理想路径\n试运行点击 → 弹浮窗 → 多目标卡片展示输出/状态/耗时（图片懒加载）→ 关闭后不落历史、不参与评价\n④ 做完评价 → 自动存入 Project.evaluations → ⑤ 可见\n⑤ 随便进 → 列表倒序展示评价记录 → 点「查看」展开表格（入参/出参/模型/评分/评价 + 总结推荐）→ 可导出 Excel\n同一 Task 多次评价 → 各自独立留存、不覆盖\n复杂脚本（prompt 含引号/换行/反斜杠）经 gen-script/fix-script 返回 → 标记分段提取，不再 JSON 解析失败\nJSON 导出导入 version=5 还原；IndexedDB 刷新不丢\n异常路径\n导入 version\u003c5 → 拒绝并提示\"版本过旧不兼容\"\ngen-script/fix-script 标记缺失/解析失败 → 友好报错 + 保留「重试/更换解读模型」\n⑤ 删除某条评价记录 → 列表移除、详情区清空\n④ 仍保持洁癖（直接进为空）；⑤ 可随便进\n编程注意事项（仅本次）\n试运行用浮层窗口展示，不落历史、不参与评价。\n评价统一存 Project.evaluations（④写、⑤读，单一来源），废弃 Task 上的 evaluation，避免两头存对不上。\nAI 返回代码一律标记分段（SCRIPT/META），禁塞 JSON；适用 gen-script、fix-script。\nSCHEMA_VERSION 升 5，导入 \u003c5 拒绝。\n其余 v4.2 已完成代码不动。", "summary": "大模型测评平台 PRD · 增量 v4.3"}, {"id": "doc-21", "title": "项目复盘-难点与卡点.md", "filename": "项目复盘-难点与卡点.md", "category": "项目说明", "size": 6943, "updated": "2026-06-06 14:55", "content": "# 模型评测平台 · 项目复盘（难点与卡点）\n\n\u003e 这份文档是给「讲项目」用的——面试、汇报、或者跟人介绍这个项目时，能讲清楚：**我做了个什么东西、它解决了谁的什么痛点、过程中真正卡住我的是哪些点、我又是怎么权衡和拿主意的。**\n\u003e 写法上刻意不堆技术细节，重点是「问题 → 为什么难 → 我怎么决策」。\n\n---\n\n## 一、一句话讲清这个项目\n\n做了一个**面向算法/大模型效果对比的评测平台**：用户把同一批输入（文本/图片）一次性丢给多个算法或大模型，平台并排跑出结果、横向对比，还能让 AI 当裁判逐条打分、给推荐，最后一键导出 Excel。\n\n**解决的痛点**：以前团队对比几个模型/算法效果，全靠各自手动调接口、手动记结果、人肉对比，慢且不可复现。这个平台把「输入 → 多目标运行 → 结果对比 → AI 评价 → 导出」做成了一条顺畅的流水线。\n\n---\n\n## 二、最值得讲的几个难点 / 卡点\n\n\u003e 下面每个点都按「我遇到了什么 → 为什么这事不简单 → 我最后怎么定的」来讲。\n\n### 1. 异构目标的统一：算法 API 和大模型，长得完全不一样，怎么放进同一个对比里？\n\n- **遇到的问题**：内置大模型（走对话接口）和用户自己接入的算法 API（千奇百怪的请求/返回结构）是两类完全不同的东西，但用户的诉求是「我就想把它们放一起比」。\n- **为什么难**：它们的入参、鉴权、返回字段路径都不一样，硬写死根本没法兼容用户后续接入的任意新接口。\n- **我的决策**：抽象出一个统一的「目标」概念——不管你是大模型还是算法，对平台来说都是「给定输入、产出可对比结果」的一个目标。再用一层归一化把各家返回结果统一成「文本 + 图片 + 耗时」的标准结构，对比区就只认这个标准结构。**这样新接入任何接口都不用改对比逻辑。**\n\n### 2. 让用户「零代码」接入自己的算法接口——这是平台能不能用起来的关键\n\n- **遇到的问题**：用户的算法接口五花八门，不可能让他们改代码来适配我的平台。\n- **为什么难**：要在不写代码的前提下，让平台知道「这个接口怎么调、参数填哪些、结果从返回的哪个字段取」。\n- **我的决策**：做了一个可视化的接入表单（URL/方法/请求头/参数定义/输出字段路径），用户填一填就能把任意接口变成一个可评测目标，还能一键「测试连通性」当场验证。**把对接成本从「写代码」降到「填表」。**\n\n### 3. AI 解读接口文档 → 一键自动建接口（这次新加的，最能体现产品思维）\n\n- **遇到的问题**：上面的接入表单虽然零代码，但参数多，用户还是觉得麻烦——要对着文档一个个抄。\n- **为什么难**：接口文档格式不统一（有的是 Markdown、有的是示例请求、有的是一段话），要让机器准确提取出「该填表单的哪些字段」并不容易，而且 AI 提取可能出错，不能直接拿去用。\n- **我的决策**：让大模型把文档解读成结构化信息，再做一个「应用解读结果」按钮——**它不是直接保存，而是把解读结果自动填进接入表单，让用户过目确认后再保存**。既享受了自动化的省事，又保留了人工兜底的安全感。这个「自动填、人确认」的分寸，是我特意权衡的——全自动有风险，全手动没价值。\n\n### 4. AI 当裁判做「逐条评价」——怎么让评分有意义、可复现？\n\n- **遇到的问题**：用户不只想看结果，还想知道「到底哪个更好」。让 AI 打分容易，但打得乱、不可复现就没价值。\n- **为什么难**：要让 AI 横向对比同一条输入下的多个结果、给出 0-10 分 + 点评 + 推荐，还得让评分标准可控（不同业务关注点不一样）。\n- **我的决策**：评价按「每条输入」横向比较该输入下的各目标，而不是孤立打分；评价标准（Prompt）既支持用户手写，也支持「描述需求 → AI 自动生成评价 Prompt」。**把『定标准』这件事也交给用户掌控，AI 只负责按标准执行。**\n\n### 5. 含图评价的成本与体验：原图太大，传给裁判又慢又贵\n\n- **遇到的问题**：评价带图片的结果时，原图动辄几 MB，传给裁判模型既慢又烧钱。\n- **为什么难**：但又不能为了省钱牺牲用户看到的原图质量。\n- **我的决策**：**压缩只发生在「传给裁判」这条链路上**——把图片在浏览器端压到合适尺寸再送去评价，而用户在结果区看的、导出的始终是原图。一处压缩、两套用途，兼顾成本和体验。\n\n### 6. 界面演进：从「一屏堆满」到「按需展开」——这是我对「好用」的理解迭代\n\n- **遇到的问题**：第一版我把所有功能（输入/选目标/运行/结果/评价/历史）全塞在一个长页面里，自己一看就觉得乱。\n- **为什么难**：功能确实都需要，但全摊开会让用户无从下手、抓不住重点。\n- **我的决策**：拆成「配置」和「结果」两个干净的页面用 Tab 切换；把不是每次都用的功能（AI 评价配置、接口接入、文档解读）改成**点按钮/开开关才弹出**，平时收起来。**核心原则：常用的露出来，不常用的藏起来但一键可达。** 这一版改完，界面清爽了一个量级。\n\n---\n\n## 三、贯穿全程的两个工程权衡（值得单独讲）\n\n### 权衡 A：自动化 vs. 可控性\n\n平台里好几处都用了 AI（生成评价 Prompt、解读文档、当裁判打分）。我的统一原则是：**AI 负责出草稿，人负责拍板。** 解读结果要确认后才保存、评价标准用户能改、生成的 Prompt 能编辑。既要省事，也不能让用户失去掌控感——这是用 AI 做工具类产品最重要的分寸。\n\n### 权衡 B：并发效率 vs. 稳定性\n\n多目标 × 多条输入，调用量可能很大。直接全量并发会打爆接口、也容易触发限流。我用了一个可配置的并发池来控制同时进行的请求数，让用户能在「跑得快」和「别把下游打挂」之间自己取舍。\n\n---\n\n## 四、如果被追问，可以这样收尾\n\n- **这个项目最大的价值不是某个技术点，而是把一个原本零散、靠人肉的对比流程，产品化成了一条可复现的流水线。**\n- **过程中我反复在做的判断是「哪些交给 AI、哪些留给人」「哪些功能露出、哪些收起」——这些产品层面的取舍，比单纯写代码更能体现我怎么思考问题。**\n- 后续还能做的：评价结果的可视化图表、更多内置模型、团队协作共享评测项目等。\n", "summary": "模型评测平台 · 项目复盘（难点与卡点）"}, {"id": "doc-22", "title": "项目能力总览与命名灵感.md", "filename": "项目能力总览与命名灵感.md", "category": "项目说明", "size": 9983, "updated": "2026-06-06 14:55", "content": "# 项目能力总览与命名灵感\n\n\u003e 用途：把这个项目「实际做了什么、能干什么、怎么实现的」一次性讲清楚，并基于真实能力给出一组**不死板的新名字**备选，方便你重新命名、重塑网页气质。\n\n---\n\n## 一、一句话是什么\n\n**让多个 AI / 算法接口同时回答同一道题，并排比一比谁更强；还能让 AI 自己接入新接口、让 AI 当裁判按多维度自动打分——一个本地就能跑的「AI 评测工作台」。**\n\n- 形态：本地运行的网页工具（Next.js 应用，`npm run dev` 即用）。\n- 用户：算法工程师、Prompt 工程师、AI 产品经理。\n- 气质关键词：**横向对比、批量、自动化、量化评分、可玩**（角落还住着一只会漫游的像素小狗 🐕）。\n\n---\n\n## 二、整体能力地图（5 大板块 + 2 个彩蛋/辅助）\n\n| 板块 | 名称 | 一句话 |\n|------|------|--------|\n| ① | 跑批 / 并排对比 | 选目标 + 写输入 → 多目标并发运行、并排出结果 |\n| ② | 接口接入与管理 | 真 Agent 自动接入任意接口，或手动配置 |\n| ③ | 结果与历史 | 看跑批结果、历史记录，一键导出 Excel |\n| ④ | AI 多维度评价 | 让裁判 AI 按多个维度逐项打分、写点评、排序 |\n| ⑤ | 评价结果与历史 | 回看所有历史评分报告，可导出 |\n| 辅助 | AI 造数据 | 一句话描述 → AI 生成一批测试用例直接灌入批量 |\n| 彩蛋 | 像素小狗助手 | 角落原创像素小狗，两侧留白漫游、随状态卖萌 |\n\n---\n\n## 三、核心能力详述\n\n### 1. 多目标并排对比 + 批量评测（地基）\n\n- **选目标**：勾选要 PK 的模型/算法。内置 DeepSeek V4 Pro、Kimi K2.6（多模态）、Qwen3.6 Plus（多模态·默认裁判）、Mock 生图算法，加上你自己接入的任意接口。\n- **写输入**：单条直接打字；批量上传 Excel（每行一个用例）。\n- **并发运行**：所有目标同时调用，结果**并排卡片**展示，文本 / 图片统一渲染。\n- **试运行浮窗**：正式跑批前可「试运行」预览效果，不落历史。\n- **全模态**：纯文本、看图出文字（多模态）、文生图/图生图（一次出多张图）都支持。\n- **费用确认**：跑批前弹确认框，避免误触发大批量消耗。\n\n### 2. AI 自动接入接口（最大亮点 ⭐）\n\n把「接入一个新接口」从读文档 + 写脚本 + 调试的几小时，压缩成「**粘贴文档 → 等它跑通 → 确认**」的几分钟。\n\n- 背后是一个**真正的 Agent 循环**（不是死规则模拟），给 AI 配了几个工具自主驱动：\n  - `run_script`：本机真实执行 Python 脚本，拿真实 stdout/stderr\n  - `install_package`：缺库自己 `pip install`\n  - `save_target`：跑通后保存为可用目标\n  - `ask_user`：缺 Key / 缺参数 / 文档不清时，内嵌对话框**主动追问**用户\n- 行为像 Claude Code：读文档 → 写脚本 → 自测 → 装库 → 看报错 → 反复改，直到**真跑通**才保存。\n- 进度实时流式推送（SSE），循环有步数上限防失控。\n- **辅助：AI 解读文档**——粘贴看不懂的接口文档，AI 帮你读出地址、参数、鉴权方式（只告诉你、不乱填，最后你确认）。\n- **手动兜底**：跑不通时可手动改脚本接入，或强存为未验证状态。\n\n### 3. 结果与历史\n\n- 结果按「输入 × 目标」表格展示，文本可展开、图片可点开放大。\n- 所有跑批记录持久化（IndexedDB，刷新不丢）。\n- 一键导出 Excel（入参、出参、模型、耗时全在内）。\n\n### 4. AI 多维度评价（核心亮点 ⭐）\n\n- 选一个「裁判 AI」。\n- 一句话说清「想评什么」→ AI **自动生成一批评分维度**（待办清单式勾选，可勾可不勾、可手动加、可「再来一批」追加，上限 15 条；内置预设维度只作模型参考、不直接透出）。\n- 按勾选的维度**自动生成评分 Prompt**。\n- 裁判 AI 对每个目标**按维度逐项打分 + 写理由 + 给总体点评**，结果表格每个维度一列、可按维度排序。\n- 评价结果独立留存，同一批次可多次评价、互不覆盖。\n\n### 5. 评价结果与历史\n\n- 历史评分报告倒序列出（时间 / 来源批次 / 裁判模型 / 条数）。\n- 展开详情：入参 | 出参 | 模型 | 各维度分 + 理由 | 总体点评。\n- 每条评价可导出 Excel（每维度独立「分/理由」列）。\n\n### 6. AI 造数据（辅助）\n\n一句话描述想要的测试数据，AI 自动生成一批结构化用例，直接灌入批量评测。\n\n### 7. 像素小狗助手（彩蛋 · 让网页不死板的关键 🐕）\n\n- 角落一只**原创像素艺术风格小狗**（纯代码绘制 SVG，无版权风险，可安全公开）。\n- 窗口够宽时在**两侧留白竖带自主漫游**（慢速平滑、随机选点、停顿发呆、朝向翻转），窗口窄了自动缩回右下角待机。\n- **随平台状态卖萌**：跑批/接入/评价进行中 → 专心 busy；成功 → 开心；失败 → 难过；点它 → 冒气泡说一句话。\n- 可拖动、可收起/唤出，偏好持久化。纯装饰、只读状态、不碰任何业务数据。\n\n---\n\n## 四、技术架构（怎么实现的）\n\n### 技术栈\n\n| 层 | 技术 |\n|----|------|\n| 框架 | Next.js 14（App Router） |\n| 前端 | React 18 + TypeScript + TailwindCSS |\n| 本地存储 | Dexie（IndexedDB 封装） |\n| Excel | SheetJS（xlsx） |\n| AI 调用 | DashScope（百炼）Anthropic 兼容网关 |\n\n### 分层结构\n\n```\nsrc/\n  app/         页面 + API 路由（agent-connect / evaluate / gen-data / gen-dimensions ...）\n  components/  UI 组件（5 大板块 + 输入/结果/评价/宠物等）\n  hooks/       业务逻辑 hooks（useEvaluation / useTaskRunner / useProject ...）\n  services/    调用层（agent / evaluateService / genDimensionsService ...）\n  adapters/    目标 adapter（输出统一归一化）\n  config/      集中配置（agent / models / runtime / presetTargets / petConfig ...）\n  lib/         工具函数（taskRunner / petBus ...）\n  types/       数据模型 interface\n```\n\n### 关键设计\n\n- **adapter 归一化**：内置模型直调 / 脚本目标 / ComfyUI 生图工作流，输出统一归一为 `{ outputText, outputImages[], latencyMs }`，上层无 if-else。\n- **Key 安全**：前端只存环境变量「引用名」，真实 Key 在服务端 `.env.local` 注入，绝不经过前端。\n- **Agent 后端循环**：`/api/agent-connect` 启动循环、SSE 流式推进度、步数上限防失控、支持 `ask_user` 暂停/恢复。\n- **脚本执行隔离**：子进程执行、超时杀进程、stdin 传参、图片产物转 base64 进结果体系。\n- **宠物与业务解耦**：全局事件总线（`petBus`）只「广播」状态，宠物订阅切表情，绝不读写业务数据。\n\n---\n\n## 五、产品亮点小结\n\n| 亮点 | 价值 |\n|------|------|\n| 🤖 真 Agent 自动接入 | 粘贴文档就能接入任意接口，自写自测自修，门槛趋近于零 |\n| ⚖️ AI 当裁判·多维度 | 维度 AI 生成、逐维打分点评，评测从主观变量化 |\n| 📊 多目标并排 + 批量 | 多模型/算法横向对比，Excel 批量一次跑完 |\n| 🖼️ 全模态 | 文本 / 多模态 / 文生图图生图统一支持 |\n| 🔌 可扩展架构 | 三类 adapter 归一化，新增接口类型不动上层 |\n| 🔐 Key 不落前端 | 真实 Key 仅服务端注入 |\n| 🐕 像素小狗陪伴 | 角落漫游卖萌，让工具有温度、不死板 |\n\n---\n\n## 六、命名灵感（基于真实能力起名）\n\n\u003e 核心意象可选：**擂台 / 裁判 / 对比 / 竞技场 / 自动接入 / 陪伴感**。下面按风格分组，每个附一句调性说明。\n\n### A. 竞技场 / PK 风（突出「并排对比、谁更强」）\n\n- **ModelArena（模型竞技场）** — 让模型同台竞技，一眼见高下。\n- **PromptRing（提示词擂台）** — 把 Prompt 丢进擂台，模型上场 PK。\n- **VS.AI / 模型擂台** — 简洁直接，主打对比与对决。\n- **EvalRing（评测擂台）** — 评测 + 擂台，定位清晰。\n\n### B. 裁判 / 评审风（突出「AI 当裁判、多维度打分」）\n\n- **AIRefree / AI 裁判席** — 强调自动评分这个核心差异点。\n- **JudgeBench（裁判台）** — 裁判 + 基准测评，专业感。\n- **VerdictAI（评判 AI）** — 「下判决」的意象，干脆利落。\n\n### C. 工作台 / 轻松风（突出「本地工具、好用、有温度」，配像素小狗气质）\n\n- **PupEval（小狗评测）** — 直接把像素小狗变成品牌符号，活泼好记。 ⭐\n- **EvalPup / 评测旺财** — 萌系工具人设，去死板感最强。\n- **ModelLab（模型实验室）** — 沉稳工程范。\n- **TestPad（评测台）** — 轻量、像便签一样随手可用。\n\n### D. 玩味 / 个性风（最不死板）\n\n- **斗模 / 斗模阁** — 「斗茶」式联想，模型互斗，有国风趣味。\n- **谁更强（WhoBetter）** — 把核心问题直接当名字，记忆点极强。\n- **小狗当裁判 / 旺财评测局** — 把彩蛋拉成主品牌，独一无二。 ⭐\n\n\u003e 个人推荐方向：若想**专业又有记忆点**选 `ModelArena / JudgeBench`；若想**彻底不死板、有人格化温度**，把像素小狗做成吉祥物，选 `PupEval / 旺财评测` 这一挂——名字、UI 配色、文案、那只漫游小狗能形成统一的轻松调性。\n\n---\n\n## 七、配套换名要改哪些地方（备查）\n\n重新命名后，若要让整个网页气质统一，通常会动到：\n\n- `package.json` 的 `name`\n- `src/app/layout.tsx` 的页面 `\u003ctitle\u003e` / metadata\n- 顶部工具栏标题（`src/components/TopToolbar.tsx`）\n- README、PRD 文档标题\n- （可选）配色主题、favicon、宠物形象与品牌呼应\n\n需要的话我可以按你定下的新名字，一次性把这些位置全部改好。\n", "summary": "项目能力总览与命名灵感"}], "categories": ["全部", "PRD 主线", "需求文档", "开发计划", "项目说明", "历史版本"]}</script>

    let currentCategory = '全部';
    let currentDocId = DOCS[0]?.id;
    const els = { search:document.getElementById('search'), chips:document.getElementById('chips'), docList:document.getElementById('docList'), readerMeta:document.getElementById('readerMeta'), readerTitle:document.getElementById('readerTitle'), readerSummary:document.getElementById('readerSummary'), readerContent:document.getElementById('readerContent'), toast:document.getElementById('toast') };
    function showToast(text) { els.toast.textContent=text; els.toast.classList.add('show'); setTimeout(()=>els.toast.classList.remove('show'),1800); }
    function bytesToText(bytes) { return bytes > 1024*1024 ? (bytes/1024/1024).toFixed(1)+' MB' : (bytes/1024).toFixed(1)+' KB'; }
    function escapeHtml(text) { return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
    function inlineMd(text) { return escapeHtml(text).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>'); }
    function renderTable(lines,startIndex) { const rows=[]; let i=startIndex; while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])) { rows.push(lines[i]); i++; } if(rows.length<2 || !/^\s*\|?\s*:?-{3,}/.test(rows[1])) return null; const htmlRows=rows.filter((_,idx)=>idx!==1).map((row,idx)=>{ const cells=row.trim().replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>inlineMd(cell.trim())); const tag=idx===0?'th':'td'; return '<tr>'+cells.map(cell=>`<${tag}>${cell}</${tag}>`).join('')+'</tr>'; }).join(''); return { html:`<table>${htmlRows}</table>`, next:i }; }
    function markdownToHtml(markdown) { const lines=markdown.replace(/\r\n/g,'\n').split('\n'); const out=[]; let paragraph=[], list=[], inCode=false, code=[]; const flushParagraph=()=>{ if(paragraph.length) { out.push(`<p>${inlineMd(paragraph.join(' '))}</p>`); paragraph=[]; } }; const flushList=()=>{ if(list.length) { out.push('<ul>'+list.map(item=>`<li>${inlineMd(item)}</li>`).join('')+'</ul>'); list=[]; } }; for(let i=0;i<lines.length;i++) { const line=lines[i]; if(line.trim().startsWith('```')) { flushParagraph(); flushList(); if(!inCode) { inCode=true; code=[]; } else { out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); inCode=false; } continue; } if(inCode) { code.push(line); continue; } if(!line.trim()) { flushParagraph(); flushList(); continue; } const table=renderTable(lines,i); if(table) { flushParagraph(); flushList(); out.push(table.html); i=table.next-1; continue; } const heading=line.match(/^(#{1,4})\s+(.*)$/); if(heading) { flushParagraph(); flushList(); const level=Math.min(3,heading[1].length); out.push(`<h${level}>${inlineMd(heading[2])}</h${level}>`); continue; } const bullet=line.match(/^\s*[-*]\s+(.*)$/); if(bullet) { flushParagraph(); list.push(bullet[1]); continue; } const quote=line.match(/^>\s?(.*)$/); if(quote) { flushParagraph(); flushList(); out.push(`<blockquote>${inlineMd(quote[1])}</blockquote>`); continue; } paragraph.push(line.trim()); } flushParagraph(); flushList(); if(inCode) out.push(`<pre><code>${escapeHtml(code.join('\n'))}</code></pre>`); return out.join('\n'); }
    function getFilteredDocs() { const q=els.search.value.trim().toLowerCase(); return DOCS.filter(doc=>{ const catOk=currentCategory==='全部'||doc.category===currentCategory; const qOk=!q||(doc.title+'\n'+doc.summary+'\n'+doc.content).toLowerCase().includes(q); return catOk&&qOk; }); }
    function renderChips() { els.chips.innerHTML=CATEGORIES.map(cat=>`<button class="chip ${cat===currentCategory?'active':''}" data-cat="${cat}">${cat}</button>`).join(''); els.chips.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{ currentCategory=btn.dataset.cat; const first=getFilteredDocs()[0]; if(first) currentDocId=first.id; render(); })); }
    function renderList() { const docs=getFilteredDocs(); if(!docs.length) { els.docList.innerHTML='<div class="empty">没有匹配文档</div>'; return; } if(!docs.some(doc=>doc.id===currentDocId)) currentDocId=docs[0].id; els.docList.innerHTML=docs.map(doc=>`<button class="doc-card ${doc.id===currentDocId?'active':''}" data-id="${doc.id}"><h3>${escapeHtml(doc.title)}</h3><div class="meta"><span class="tag">${doc.category}</span><span>${bytesToText(doc.size)}</span><span>${doc.updated}</span></div></button>`).join(''); els.docList.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>{ currentDocId=btn.dataset.id; render(); })); }
    function currentDoc() { return DOCS.find(doc=>doc.id===currentDocId)||DOCS[0]; }
    function renderReader() { const doc=currentDoc(); if(!doc) return; els.readerMeta.innerHTML=`<span class="tag">${doc.category}</span><span>${bytesToText(doc.size)}</span><span>更新：${doc.updated}</span><span>${escapeHtml(doc.filename)}</span>`; els.readerTitle.textContent=doc.title; els.readerSummary.textContent=doc.summary; els.readerContent.innerHTML=markdownToHtml(doc.content); document.title=doc.title+' · 测评平台 PRD 文档中心'; }
    function downloadBlob(filename,mime,content) { const blob=content instanceof Blob?content:new Blob([content],{type:mime}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url); }
    function downloadCurrent() { const doc=currentDoc(); downloadBlob(doc.filename,'text/markdown;charset=utf-8',doc.content); showToast('已下载当前 Markdown'); }
    function downloadZip() { const binary=atob(ZIP_BASE64); const bytes=new Uint8Array(binary.length); for(let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i); downloadBlob('测评平台PRD文档包.zip','application/zip',new Blob([bytes],{type:'application/zip'})); showToast('已下载 ZIP 文档包'); }
    async function copyCurrent() { const doc=currentDoc(); await navigator.clipboard.writeText(doc.content); showToast('已复制当前文档原文'); }
    function render() { renderChips(); renderList(); renderReader(); }
    els.search.addEventListener('input',()=>{ const first=getFilteredDocs()[0]; if(first) currentDocId=first.id; render(); });
    document.getElementById('downloadZip').addEventListener('click',downloadZip); document.getElementById('downloadZipTop').addEventListener('click',downloadZip); document.getElementById('downloadCurrent').addEventListener('click',downloadCurrent); document.getElementById('downloadCurrentTop').addEventListener('click',downloadCurrent); document.getElementById('copyCurrent').addEventListener('click',copyCurrent); render();
  </script>
