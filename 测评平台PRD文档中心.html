  <script id="prd-data" type="application/json">{"docs": [{"id": "doc-01", "title": "AI开发交接文档.md", "filename": "AI开发交接文档.md", "category": "项目说明", "size": 16171, "updated": "2026-06-06 14:55", "content": "# 评测平台 · AI 开发交接文档\n\n\u003e 用途：把本批次 AI 协助开发完成的所有能力、改动位置、架构链路、踩过的坑、以及尚未动手的迭代需求，一次性交接给下一个模型/开发者。看完这份就能无缝接手，不必再翻聊天记录。\n\u003e 最后更新：2026-06-04\n\n---\n\n## 0. 30 秒速览（新模型必读）\n\n- **项目**：本地运行的大模型/算法 API 评测平台。输入（文本/图片）→ 多目标并排跑 → 结果对比 → AI 逐条评价打分 → 导出 Excel/JSON。\n- **技术栈**：Next.js 14 (App Router) + TypeScript + Tailwind + shadcn/ui + IndexedDB(dexie) + xlsx。本地 `npm run dev` 跑在 `localhost:3000`。\n- **权威文档**：`测评平台prd.md`（v1.2 定稿，数据模型/功能/API 全在里面）。本文件是它的「实现态补充 + 交接」。\n- **当前状态**：PRD 两批功能基本落地；本批次额外做了「多模态真发图片」「可编辑内置算法」「UI 重构（Tab + 抽屉）」等增强；正在**讨论但未动手**的是「生图 + LoRA」迭代。\n- **调用真相**：平台是**纯调度器**，自己不跑模型、没有 GPU，全部调第三方 API。这点决定了 LoRA 方案的可行性边界（见第 5 章）。\n\n---\n\n## 1. 架构与关键链路（改代码前先看懂这张图）\n\n### 1.1 五条核心原则（PRD 第二章的落地约束，务必延续）\n\n1. **抽象调用层**：所有外部调用走 `services/llmClient.ts`、`services/apiClient.ts`，组件不直接 fetch。\n2. **Key 来源抽象**：密钥统一从 `.env.local` 读，经 Next.js API 路由转发，**绝不暴露到前端**。\n3. **适配器模式**：每个大模型一个 adapter 文件，新增模型 = 加一个 adapter + 注册，**禁止在上层写 `if (modelId === ...)`**。\n4. **结果归一化**：所有 adapter / 算法 API 的返回都归一为 `{ outputText, outputImages[], latencyMs }`，对比区只认这个结构。\n5. **值与定义分离**：所有「值」存 `TaskInput`（含算法参数值 `extraFields`、图片 `images`）；「定义」存 `ApiConfig` / `apiParamsSnapshot`，**绝不把值写回 ApiConfig**。\n\n### 1.2 大模型调用链路\n\n```\n组件 → services/llmClient.ts → POST /api/chat (route.ts)\n     → adapters/registry.ts 按 modelId 取 adapter\n     → adapter 组装 Anthropic 兼容请求体（含图片 block）\n     → DashScope Anthropic 网关 (dashscopeBaseUrl)\n     → adapter 解析归一为 {outputText, outputImages[], latencyMs}\n```\n\n### 1.3 算法 API 调用链路\n\n```\n组件 → services/apiClient.ts(runAlgorithmApi) → POST /api/run-api (route.ts)\n     → services/algoClient.ts(buildPayload) 按 ParamDef 校验+组装请求体\n     → 用户的第三方算法 API\n     → 按 outputImagePath/outputTextPath 抽取结果并归一\n```\n\n### 1.4 算法 API「文档自动接入」链路\n\n```\n粘贴文档 → ApiDocParser.tsx → POST /api/parse-doc（大模型结构化解析）\n        → 返回 ApiConfig 草稿 + warnings\n        → apiConfigFromParse.ts 转成表单可编辑结构\n        → ApiConfigForm.tsx 人工确认 → 一键测试 /api/test-api → 保存\n```\n\n### 1.5 AI 评价链路\n\n```\nEvaluationPanel.tsx → /api/gen-eval-prompt 生成评价Prompt（可编辑）\n   → 逐条 /api/evaluate（一次一条输入，横向对比该条各目标）\n   → 含图：base64 在前端 canvas 压缩后才发裁判，原图仍展示/存储\n```\n\n---\n\n## 2. 本批次已完成的 AI 开发能力清单\n\n\u003e 以下是在 PRD v1.2 骨架之上，本批次 AI 协助新增/增强的能力，按主题归类。\n\n### 2.1 多模态「真发图片」能力（核心增强）\n\n- **背景**：原先模型只发文本，多模态评测时图片没真正传给模型。本批次打通了图片 block 真实发送。\n- **做了什么**：\n  - `models.ts`：新增 `qwen3.6-plus`（multimodal, imageInput `both`）作为多模态范例模型；`kimi-k2.6` 由 llm 改为 `multimodal`；`deepseek-v4-pro` 保持纯文本 llm。\n  - 新增 `adapters/qwenAdapter.ts` 并注册到 `adapters/registry.ts`（现注册：deepseek、moonshot、qwen 三个）。\n  - `adapters/anthropicCompatible.ts`：把图片拼进 content 的 image block，支持两种格式（已实测通过）：\n    - URL 图：`{type:\"image\", source:{type:\"url\", url}}`\n    - base64 图：`{type:\"image\", source:{type:\"base64\", media_type:\"image/jpeg\", data}}`\n  - 网关：`runtime.ts` 的 `dashscopeBaseUrl = https://dashscope.aliyuncs.com/apps/anthropic`。\n- **实测结论**：qwen3.6-plus 多模态 OK、kimi-k2.6 多模态 OK、deepseek-v4-pro 纯文本 OK。\n\n### 2.2 多模态目标置灰 / 含图可选逻辑修复\n\n- `models.ts` 的 `getModelImageCapability(modelId)`：未登记或非 multimodal 的模型一律视为不支持图片。\n- `WorkspaceBody.tsx`：修复了原先 `MULTIMODAL_MODEL_IDS` 是空集合导致多模态判断失效的 bug（详见第 4 章坑 1）。\n- `TargetSelector.tsx`：含图输入时，纯文本模型置灰；base64 图遇到只支持 url 的模型给提示；多模态含图目标可正常勾选。\n\n### 2.3 内置算法可编辑\n\n- `builtinAlgos.ts`：内置算法默认配置；默认模型配置由 `MODELS` 自动生成，新增模型无需改这里。\n- 配套对 `ApiConfigForm.tsx` / `ApiAccessPanel.tsx` 做了可查看/编辑/重新解析的打通。\n\n### 2.4 UI 重构：Tab + 抽屉 + 可折叠面板\n\n- 新增 `hooks/useTheme.ts`、`components/layout/AppTabs.tsx`、`components/layout/Drawer.tsx`、`components/layout/CollapsiblePanel.tsx`。\n- 思路：把「配置」和「结果」拆成 Tab；不常用功能（AI 评价配置、接口接入、文档解析）改成按钮/开关弹出抽屉，常用露出、不常用收起。\n\n### 2.5 测试数据（对接文档样本）\n\n- `测试数据/` 下准备了 5 份风格各异的对接文档样本（标准算法 API 文生图、大模型对话、不规范口语、英文 OpenAPI 风格、刁钻多接口混杂）+ `gen_excel.mjs` 生成批量 Excel，用于测平台的文档解析与批量能力。\n- 注意：之前用户要求**删掉对接文档相关的内置测试数据**，新增数据时不要再混进这类内容。\n\n### 2.6 端到端验证脚本（browser-use）\n\n- `~/Desktop/browser-use-runner/` 下有 `verify_ui_v2.py`、`verify_editable_builtin.py`、`verify_vision.py`，用浏览器自动化验证 UI、可编辑内置算法、多模态含图评测。\n\n---\n\n## 3. 关键文件地图（改哪个功能去哪个文件）\n\n### 配置层 `src/config/`\n- `models.ts` — 内置大模型列表 + `getModelConfig` / `getModelImageCapability`。新增模型先动这里。\n- `runtime.ts` — 并发(3)/上限(10)/超时(60s)/body上限/`dashscopeBaseUrl`。\n- `builtinAlgos.ts` — 内置算法默认配置。\n\n### 适配器层 `src/adapters/`\n- `registry.ts` — adapter 注册表，新模型 adapter 在此登记。\n- `types.ts` — `LlmAdapter` 接口定义。\n- `anthropicCompatible.ts` — Anthropic 兼容请求体组装（含图片 block），多家共用。\n- `deepseekAdapter.ts` / `moonshotAdapter.ts` / `qwenAdapter.ts` — 各模型 adapter。\n\n### 服务层 `src/services/`\n- `llmClient.ts` — 大模型调用入口（前端侧）。\n- `apiClient.ts` — 算法 API 调用入口（`runAlgorithmApi`，转发 `/api/run-api`）。\n- `algoClient.ts` — `buildPayload` 按 ParamDef 校验组装请求体（**LoRA 参数透传将动这里**）。\n- `runService.ts` — 跑批调度（并发池/取消/中断）。\n- `excel.ts` — Excel 导入导出。\n- `projectFactory.ts` — Project/Task 工厂。\n\n### 后端路由 `src/app/api/`\n- `chat/route.ts` — 大模型对话。\n- `run-api/route.ts` — 算法 API 正式执行。\n- 另有 `parse-doc` / `test-api` / `gen-eval-prompt` / `evaluate`（见 PRD 第五章）。\n\n### 组件层 `src/components/`\n- `WorkspaceBody.tsx` — 工作区主体（模式切换 / 多模态判断）。\n- `TargetSelector.tsx` — 目标选择 + 置灰逻辑。\n- `input/AlgoParamsInput.tsx` — 单条算法参数表单（`collectExtraParams` → `extraFields`，**LoRA 上传 UI 大概率加这里**）。\n- `api/ApiDocParser.tsx` / `api/ApiConfigForm.tsx` / `api/ApiAccessPanel.tsx` — 接口接入三件套。\n- `evaluation/EvaluationPanel.tsx` — AI 评价。\n- `result/ResultCard.tsx` / `ResultTable.tsx` / `resultShared.tsx` — 结果展示。\n- `run/RunPanel.tsx` — 运行控制。\n- `layout/AppTabs.tsx` / `Drawer.tsx` / `CollapsiblePanel.tsx` — 布局骨架。\n\n### 类型 `src/types/index.ts`\n- 全量数据模型（与 PRD 第三章一致）。`ParamDef.type` 目前只有 `string|number|boolean|image`。\n- `ModelConfig.type`: `\"llm\" | \"multimodal\"`；`imageInput?: \"url\" | \"base64\" | \"both\"`。\n- `ImageItem`: `{ id, name, source: \"url\"|\"base64\", value }`。\n\n---\n\n## 4. 踩过的坑 / 易错点（避免重复犯）\n\n1. **`MULTIMODAL_MODEL_IDS` 空集合 bug**（`WorkspaceBody.tsx`）：曾用一个空的硬编码集合判断模型是否多模态，导致所有多模态判断恒为 false、图片永远发不出去。已改为以 `models.ts` 的 `type === \"multimodal\"` / `getModelImageCapability` 为准。**新增多模态判断逻辑一律走 config，不要再维护硬编码 id 集合。**\n\n2. **图片 block 格式**：DashScope Anthropic 网关对 url / base64 是两套 source 结构（见 2.1）。base64 必须带 `media_type`。这是实测出来的，别凭印象改。\n\n3. **值不要写回 ApiConfig**：`ParamDef.value` 在 ApiConfig 里只是占位、不持久化；真值永远存 `TaskInput.extraFields`。LoRA 参数也必须遵守这条。\n\n4. **adapter 必须归一化输出**：上层组件严禁按 modelId 写分支，差异全部收敛进 adapter，否则对比区会乱。\n\n5. **Excel 类型转换**：SheetJS 读出的类型可能与 `ParamDef.type` 不符（number 读成 string）。导入时按 paramDef.type 强制转换+校验。\n\n6. **base64 压缩位置**：只压「传给裁判的副本」，结果区与存储保留原图。别在源头压。\n\n7. **取消要清空排队**：取消时已发请求中断 + 未发任务清除，状态统一 `cancelled/interrupted`。\n\n8. **测试数据别混对接文档**：用户明确要求删掉内置的对接文档测试数据，后续造数据不要再加这类。\n\n---\n\n## 5. 进行中的迭代需求：生图 + LoRA（尚未动手，重点交接）\n\n\u003e 状态：**纯需求讨论阶段，未写任何代码**。用户原话\"我们先聊聊需求 先不动手\"。下一个模型接手时是来继续「聊需求 / 定方案」的，不要直接开干。\n\n### 5.1 用户想要什么（按用户原话还原）\n\n- 场景：批量跑批的**生图场景**，希望用 `prompt + LoRA + 生图模型` 批量跑图。\n- 形态：**不做独立模式**。在网页首页把维度拆成两组平级选项：\n  - 「单次 / 批量」是一组；\n  - 「纯文本 / 生图」是另一组。\n- LoRA 怎么进：在**生图模式**下新增 LoRA 选项；用户**上传本地 LoRA 文件**后，就能用该 LoRA + 生图模型生图。\n- 置灰联动：LoRA 能力**挂在「模型/算法选择」上**——用户上传了 LoRA 后，**不支持 LoRA 的模型自动置灰**，支持的才可选。\n- 参照物：用户说\"我记得 ComfyUI 上要用 LoRA 得选择本地的 LoRA 文件\"，所以希望\"让用户把 LoRA 文件拖进去\"。\n\n### 5.2 关键技术争议点（必须先和用户对齐，否则方案无从落地）\n\n\u003e 这是上一轮卡住的地方，也是新模型开聊要先解决的核心问题。\n\n- **平台是纯调度器，没有 GPU、不跑模型。** 所有生图都是调第三方 API。\n- ComfyUI 里说的\"本地 LoRA 文件\"指的是 **ComfyUI 服务器本地磁盘上的文件**（由 `LoraLoader` 节点按文件名加载），**不是用户浏览器本地的文件**。\n- 所以\"把 LoRA 文件拖进网页\"这个交互，能不能成立，**取决于用户实际调用的生图服务是哪一种**：\n  - **(A) 用户自建/可控的 ComfyUI 实例**：平台需要先把用户拖入的 LoRA 文件上传到 ComfyUI 所在机器（或其可访问的存储），再在 workflow 里按文件名引用。涉及文件上传通道 + ComfyUI `/prompt` API + workflow JSON 模板。\n  - **(B) 封装好的云生图 API**：要看该 API 是否开放 LoRA 入参，以及接收形式（LoRA 名称/ID、还是 LoRA 文件 URL、还是 multipart 上传）。如果云 API 根本不收用户自定义 LoRA 文件，\"拖文件\"方案不成立，只能退化为\"填 LoRA 名称/ID\"。\n\n### 5.3 还没问清楚的问题（开聊清单）\n\n1. 你实际调用的生图服务是 **自建 ComfyUI 实例** 还是 **封装好的云 API**？（决定整个方案可行性）\n2. 若是 ComfyUI：调用方式是 `/prompt` API + workflow JSON 吗？平台能否访问到它的文件系统/上传接口？\n3. LoRA 传递形式：**文件**（需上传通道）/ **URL** / **名称或 ID**？\n4. LoRA 作用范围：**全局一个**（整批共用）/ **每条输入各自指定** / **多个 LoRA 叠加**？\n5. 是否需要 **LoRA 权重**（lora_scale）？是否要把 LoRA 当**评测变量**（多 LoRA 笛卡尔积跑批对比）？\n\n### 5.4 现有机制对 LoRA 的支撑评估（已分析过的结论）\n\n- **单个 LoRA（名称/ID + 权重）作为普通参数透传**：现有链路天然支持。走 `AlgoParamsInput` → `extraFields` → `algoClient.buildPayload` → 请求体即可，不用大改。\n- **多个 LoRA 组合 / 数组结构**：当前 `ParamDef.type` 只有 `string|number|boolean|image`，**不支持数组/JSON**。要支持多 LoRA 叠加需给 `ParamDef` 加 JSON/数组类型，并改 `buildPayload`。\n- **LoRA 作为评测变量（笛卡尔积跑批）**：现有跑批是「每条输入 × 每个目标」，没有「参数变量展开」概念，属于**新增能力**，要动 `runService` 的任务展开逻辑。\n- **拖入本地 LoRA 文件**：现有 `ImageItem` 只处理图片（url/base64）。LoRA 是模型权重文件（几十~几百 MB），**不适合走 base64 进 IndexedDB**，必须有独立的文件上传通道到 GPU/服务端，这是现有架构没有的部分。\n\n### 5.5 给新模型的建议谈法\n\n先用 5.3 的清单把\"生图服务类型\"问清楚，再分支：\n- 如果是云 API 且不收自定义 LoRA 文件 → 把需求收敛为「LoRA 名称/ID + 权重参数化」，几乎零架构改动。\n- 如果是可控 ComfyUI → 需要规划「文件上传 → ComfyUI 存储 → workflow 引用」的新链路，工作量较大，要单独立方案。\n- \"纯文本/生图\"模式切换 + 生图目标置灰，可以先于 LoRA 落地，作为前置 UI 改造。\n\n---\n\n## 6. 环境与运行\n\n- **启动**：项目根目录 `npm run dev`，访问 `http://localhost:3000`。\n- **密钥**：`.env.local` 配置 `DASHSCOPE_API_KEY`（两个内置模型共用，走 DashScope Anthropic 网关）。`.env.local` 不提交。\n- **网关地址**：`config/runtime.ts` 的 `dashscopeBaseUrl = https://dashscope.aliyuncs.com/apps/anthropic`。\n- **持久化**：IndexedDB 自动保存（刷新不丢）；JSON 仅用于备份/迁移（带 version 校验）。\n- **端到端验证**：`~/Desktop/browser-use-runner/` 下的 verify 脚本（需先起 dev server）。\n\n### 配套文档索引\n- `测评平台prd.md` — 权威 PRD v1.2（数据模型 / 功能 / API 全量定义）。\n- `测评平台开发计划.md` / `测评平台需求增补v2.md` — 计划与增补。\n- `项目复盘-难点与卡点.md` — 面向「讲项目/汇报」的复盘（非开发交接用途）。\n- `这个网站能干啥.md` — 面向用户的能力介绍。\n- 本文件 `AI开发交接文档.md` — 面向开发接手的实现态交接。\n\n---\n\n## 7. 给下一个模型的一句话\n\nPRD 已定稿、两批功能已落地、本批次又补了多模态真发图 + 可编辑内置算法 + UI 重构。**现在唯一悬而未决的是「生图 + LoRA」的需求方案**——它卡在\"用户的生图服务到底是 ComfyUI 还是云 API\"这个前置问题上（第 5 章）。你接手后请先用 5.3 清单和用户对齐，再谈实现，**不要在没确认服务类型前就动代码**。\n", "summary": "评测平台 · AI 开发交接文档"}, {"id": "doc-02", "title": "PRD-大模型测评平台.md", "filename": "PRD-大模型测评平台.md", "category": "PRD 主线", "size": 10318, "updated": "2026-06-06 14:55", "content": "# 大模型测评平台 · 产品需求文档（PRD）\n\n\u003e 一句话定位：**让多个 AI / 算法接口同时回答同一道题，并排比一比谁更强，还能让 AI 当裁判自动打分。**\n\n\u003e 本文档为产品对外介绍版 PRD，面向：产品/技术/算法同学，用于讲清楚「这个平台是什么、解决什么问题、有哪些核心能力、技术上怎么实现」。\n\n---\n\n## 0. 文档信息\n\n| 项 | 内容 |\n|----|------|\n| 产品名称 | 大模型测评平台（LLM Eval Platform） |\n| 当前版本 | v4.4 |\n| 形态 | 本地运行的 Web 工具（Next.js 应用） |\n| 目标用户 | 算法工程师、AI 产品经理、Prompt 工程师 |\n| 一句话价值 | 多模型/多算法横向评测 + AI 自动接入接口 + AI 自动评分 |\n\n---\n\n## 1. 背景与痛点\n\n算法工程师在调试 Prompt、对比模型、接入算法 API 时，长期面临几个痛点：\n\n- **对比靠人肉**：想比较 DeepSeek、Kimi、Qwen 谁答得好，得开好几个窗口分别问，再手动复制粘贴对比，效率极低。\n- **批量评测没工具**：有一批测试用例（几十上百条），只能一条条手动跑，无法批量。\n- **接入接口门槛高**：想把自己团队的算法 API（文生图、图生图等）也拉进来对比，得读文档、写调用脚本、反复调试鉴权和参数，耗时耗力。\n- **评测结果难量化**：跑完一堆结果，谁好谁坏全凭主观感觉，没有统一打分和可导出的评测报告。\n\n\u003e 📷 **【图片占位 1：痛点示意 / 旧工作流截图】**\n\u003e _建议放一张「以前是怎么干的」的对比图，比如多个浏览器窗口分别开着不同模型。_\n\n---\n\n## 2. 产品目标\n\n**做一个本地可跑的「AI 评测工作台」，把\"对比 → 批量 → 接入 → 评分 → 导出\"全流程打通：**\n\n1. 多个模型/算法**并排对比**，一眼看出差异。\n2. 支持 **Excel 批量**评测，几百条用例一次跑完。\n3. 用**真 Agent** 自动接入任意接口（读文档→写脚本→自测→跑通），把接入门槛降到「粘贴文档」。\n4. 让 **AI 当裁判**自动打分，输出可量化、可导出的评测报告。\n\n---\n\n## 3. 核心功能总览\n\n平台分为 **5 大板块**，覆盖完整评测链路：\n\n| 板块 | 名称 | 一句话说明 |\n|------|------|-----------|\n| ① | 跑批 / 对比 | 选目标 + 写输入 → 多目标并排运行出结果 |\n| ② | 接口接入与管理 | AI 自动接入任意接口，或手动配置 |\n| ③ | 结果与历史 | 查看跑批结果、历史记录，导出 Excel |\n| ④ | AI 评价 | 让裁判 AI 给结果打分、写点评、给推荐 |\n| ⑤ | AI 评价结果与历史 | 回看所有历史评分报告，可导出 |\n\n\u003e 📷 **【图片占位 2：平台首页 / 5 板块导航总览截图】**\n\u003e _建议放一张能看到顶部 5 个板块 Tab 的整体界面图。_\n\n---\n\n## 4. 功能详述\n\n### 4.1 板块①：多目标并排对比 + 批量评测\n\n**这是平台的地基能力。**\n\n- **选目标**：勾选要对比的模型/算法（内置 DeepSeek、Kimi、Qwen，以及自己接入的接口）。\n- **写输入**：单条输入直接打字；批量则上传 Excel（每行一个用例）。\n- **并排运行**：所有目标**并发**调用，结果**并排卡片**展示，文本/图片统一渲染。\n- **试运行浮窗**：正式跑批前可「试运行」，浮层窗口预览效果，不落历史。\n- **多模态支持**：支持纯文本、看图输出文字（多模态）、文生图/图生图（一次出多张图）。\n\n\u003e 📷 **【图片占位 3：多目标并排对比结果截图】**\n\u003e _建议放一张多个模型答案并排卡片的结果图，最好带图片类结果。_\n\n---\n\n### 4.2 板块②：AI 自动接入接口（核心亮点 ⭐）\n\n\u003e **这是整个平台最\"牛逼\"的部分。** 把\"接入一个新接口\"从「读文档+写脚本+调试」的几小时工作，变成「粘贴文档→等它跑通→确认」的几分钟。\n\n**用户视角（极简三步）：**\n\n1. 粘贴接口对接文档 → 点「开始」\n2. 实时进度区看 Agent 自己干活：写脚本 → 跑 → 缺库自动装 → 报错自己改 → 再跑 → 跑通\n3. Agent 跑通后展示「测试输入 / 原始输出 / 渲染结果」+ 说明 → 用户「确认接入」\n\n**背后是一个真正的 Agent（不是死规则模拟）：**\n\n平台后端跑一个 **Agent 循环**，给 AI 配了几个工具（tool use / function calling），AI 自主驱动整个接入过程：\n\n| 工具 | 作用 |\n|------|------|\n| `run_script` | 在本机实际执行 Python 脚本，拿到真实 stdout/stderr |\n| `install_package` | 缺库时自己 `pip install` |\n| `save_target` | 跑通后把接口保存为可用目标 |\n| `ask_user` | **缺信息时（缺 Key、缺参数、文档不清）主动弹对话框问用户** |\n\n\u003e Agent 会像 Claude Code 那样：读文档 → 写脚本 → 自测 → 自己装库 → 看报错 → 反复改，直到**真跑通并返回有效结果**才保存。全程\"自主驱动\"，平台只提供工具和循环。\n\n**ask_user 交互式追问**：当 Agent 发现缺关键信息（比如缺 API Key、某个必填参数不知道填什么），会在接入页面下方内嵌一个对话框主动提问，用户回复后 Agent 接着干，全程同一会话不中断。\n\n\u003e 📷 **【图片占位 4：AI 自动接入实时进度区截图】**\n\u003e _建议放一张 Agent 正在\"写脚本→跑→装库→跑通\"的进度流截图。_\n\n\u003e 📷 **【图片占位 5：Agent 跑通后的三项确认页 / ask_user 对话框截图】**\n\u003e _建议放确认页（测试输入+原始输出+渲染结果）或 ask_user 追问的对话框。_\n\n**辅助能力：AI 解读文档**\n把看不懂的接口文档粘贴进去，AI 帮你读出：地址、参数、鉴权方式（只告诉你，不乱填，最后还是你确认）。\n\n**手动兜底**：Agent 跑不通时，可手动改脚本后接入，或强存为未验证状态。\n\n---\n\n### 4.3 板块③：结果与历史\n\n- 跑批结果按「输入 × 目标」表格展示，文本可展开、图片可点开放大。\n- 所有跑批记录持久化（IndexedDB，刷新不丢）。\n- 一键导出 Excel（入参、出参、模型、耗时全在里面）。\n\n\u003e 📷 **【图片占位 6：结果历史表格 + 导出 Excel 截图】**\n\n---\n\n### 4.4 板块④：AI 当裁判评分（核心亮点 ⭐）\n\n- 选一个「裁判 AI」。\n- 用一句话说清「我想评什么」→ AI **自动帮你生成评分标准（评分 Prompt）**。\n- 裁判 AI 给每个目标的答案：**打分（0~10）+ 写点评 + 给出推荐项**。\n- 评价结果独立留存，同一批次可多次评价、互不覆盖。\n\n\u003e 📷 **【图片占位 7：AI 评价配置 + 自动生成评分标准截图】**\n\n---\n\n### 4.5 板块⑤：评价结果与历史\n\n- 所有历史评分报告倒序列出（时间 / 来源批次 / 裁判模型 / 条数）。\n- 点「查看」展开详情表格：入参 | 出参 | 模型 | 评分 | 点评 + 总结/推荐。\n- 每条评价可导出 Excel。\n\n\u003e 📷 **【图片占位 8：评价报告详情表格截图】**\n\n---\n\n### 4.6 辅助能力：AI 造数据\n\n一句话描述想要什么测试数据，AI 自动生成一批结构化测试用例，直接灌入批量评测。\n\n\u003e 📷 **【图片占位 9：AI 造数据截图】**\n\n---\n\n## 5. 技术架构\n\n### 5.1 技术栈\n\n| 层 | 技术 |\n|----|------|\n| 框架 | Next.js 14（App Router） |\n| 前端 | React 18 + TypeScript + TailwindCSS |\n| 本地存储 | Dexie（IndexedDB 封装） |\n| Excel | SheetJS（xlsx） |\n| AI 调用 | DashScope（百炼）Anthropic 兼容网关 |\n\n### 5.2 分层结构\n\n```\nsrc/\n  app/         页面 + API 路由（agent-connect / evaluate / gen-data ...）\n  components/  UI 组件（5 大板块 + 输入/结果/评价等）\n  hooks/       业务逻辑 hooks（useEvaluation / useTaskRunner ...）\n  services/    调用层（agent / algoClient / evaluateService ...）\n  adapters/    目标 adapter（输出统一归一化）\n  config/      集中配置（agent / models / runtime / presetTargets）\n  lib/         工具函数\n  types/       数据模型 interface\n```\n\n### 5.3 关键设计\n\n- **三类 adapter 归一化**：`built-in`（内置模型直调 HTTP）、`script`（Agent 接入的脚本目标）、`comfyui`（生图工作流）。三类输出统一归一为 `{ outputText, outputImages[], latencyMs }`，上层无 if-else。\n- **Key 安全**：前端只存环境变量「引用名」，真实 Key 在服务端 `.env.local`，由 `getApiKey()` 注入，**绝不经过前端**。\n- **Agent 后端循环**：`/api/agent-connect` 启动 Agent 循环，SSE 流式推送进度；循环上限 30 步防失控；支持 `ask_user` 暂停/恢复会话。\n- **脚本执行隔离**：子进程执行、超时杀进程、stdin 传参、图片产物转 base64 进结果体系。\n\n\u003e 📷 **【图片占位 10：技术架构图 / 分层示意图】**\n\u003e _建议放一张 前端 → API 路由 → adapter → 外部模型/接口 的架构图。_\n\n---\n\n## 6. 产品亮点小结\n\n| 亮点 | 价值 |\n|------|------|\n| 🤖 **真 Agent 自动接入** | 粘贴文档就能接入任意接口，Agent 自写自测自修，接入门槛趋近于零 |\n| ⚖️ **AI 当裁判** | 评分标准 AI 生成、打分点评 AI 完成，评测从主观变量化 |\n| 📊 **多目标并排 + 批量** | 多模型/算法横向对比，Excel 批量一次跑完 |\n| 🖼️ **全模态** | 文本 / 多模态 / 文生图图生图统一支持 |\n| 🔌 **可扩展架构** | 三类 adapter 归一化，新增接口类型不动上层 |\n| 🔐 **Key 不落前端** | 真实 Key 仅服务端注入，安全可控 |\n\n---\n\n## 7. 不做 / 边界\n\n- 本地自用工具，不含用户登录、云部署、多租户。\n- Agent 仅用于「接入阶段」，不介入跑批/评价。\n- Agent 模型固定（需支持 tool use），不可换成不支持 function calling 的模型。\n- 脚本仅支持 Python（不支持 node/shell）。\n\n---\n\n## 8. 快速开始\n\n```bash\nnpm install\ncp .env.local.example .env.local   # 填入自己的 API Key\nnpm run dev                         # 访问 http://localhost:3000\n```\n\n\u003e 📷 **【图片占位 11：启动后首屏截图】**\n\n---\n\n_文档结束。图片占位处请替换为实际产品截图后再对外分享。_\n", "summary": "大模型测评平台 · 产品需求文档（PRD）"}, {"id": "doc-03", "title": "README.md", "filename": "README.md", "category": "项目说明", "size": 1646, "updated": "2026-06-06 14:55", "content": "# 大模型测评平台\n\n本地运行的网页工具，供算法工程师调试 prompt、对比不同大模型与算法 API 的输出效果。\n\n详见 `测评平台prd.md`（需求）与 `测评平台开发计划.md`（开发计划）。\n\n## 当前进度\n\n- ✅ **M0 工程骨架 + Walking Skeleton**：调用层 / getApiKey / adapter（DeepSeek + Kimi）/ config 骨架就位，端到端真实调用链已打通。\n\n## 快速开始\n\n1. 安装依赖（已安装可跳过）：`npm install`\n2. 配置 API Key：`cp .env.local.example .env.local`，填入你自己的两个真实 key。\n   - DeepSeek：https://platform.deepseek.com\n   - Kimi / Moonshot：https://platform.moonshot.cn\n3. 启动：`npm run dev`\n4. 访问 http://localhost:3000，输入 prompt，点击「并排运行两家模型」，验证两家模型均返回归一化输出（文本 + 耗时）。\n\n## 目录结构\n\n\\`\\`\\`\nsrc/\n  app/         页面 + API 路由（api/chat）\n  components/  UI 组件\n  hooks/       业务逻辑 hooks\n  services/    调用层（llmClient / apiClient / getApiKey）\n  adapters/    模型 adapter（每模型一个文件，输出归一化）\n  config/      集中配置（models / runtime）\n  lib/         工具函数\n  types/       数据模型 interface\n\\`\\`\\`\n\n## 架构要点\n\n- 调用层抽象：大模型调用走 services/llmClient.ts，按 adapter 分发，上层无 if-else。\n- adapter 归一化：每个 adapter 输出统一为 { outputText, outputImages[], latencyMs }。\n- Key 来源抽象：统一 getApiKey(provider)，当前从 .env.local 读。\n- 配置集中：模型列表、并发、超时、body 上限集中在 config/。\n", "summary": "大模型测评平台"}, {"id": "doc-04", "title": "前端需求v4.1.md", "filename": "前端需求v4.1.md", "category": "需求文档", "size": 3033, "updated": "2026-06-06 14:55", "content": "前端逻辑修改需求（基于现有平台）\n一、内容模式 → 目标筛选与置灰\n背景：每个目标（模型/算法）有一个内容能力标签 contentKind，取值 text（纯文本）/ image（生图）/ both（多模态/兼具）。\n\n规则：\n\n按内容模式筛选（直接不显示，不是置灰）：\n\n当前是「文本对话」模式 → 只显示 contentKind 为 text 或 both 的目标（纯文本 + 多模态 + 文本类算法）。\n当前是「生图」模式 → 只显示 contentKind 为 image 或 both 的目标（生图模型 + 生图类算法 + ComfyUI）。\n不符合当前内容模式的目标直接不出现在目标选择区。\n输入栏含图时的置灰（显示但点不了 + 提示）：\n\n当输入数据栏出现了 URL 图片 或 上传的图片时 → 把 contentKind='text'（纯文本、不接图）的目标置灰、不可选，并给提示：「该目标不支持图片输入，已传入图片」。\n即：内容模式不匹配 = 不显示；输入有图导致的不可用 = 置灰+提示（让用户知道是因为传了图）。\n二、AI 评价板块（板块④）的\"数据源洁癖\"\n目标：评价板块绝不残留数据，每次必须明确从某个历史批次进入，让用户始终清楚\"在评测什么\"。\n\n空状态（默认）：用户直接点导航进入板块④时 → 页面只显示一句提示「请从【结果与历史】选择批次后点『去AI评测』进入」+ 一个【返回结果与历史】按钮。不显示任何评价功能/内容。\n\n有数据状态：仅当用户从板块③某个历史批次点击「去AI评测」跳入时 → 载入该批次数据 → 显示完整评价功能。\n\n顶部常驻显示「正在评测：[批次名 / 创建时间]」，让用户随时知道在评什么。\n提供【返回结果与历史】按钮。\n离开即清空：离开板块④后数据清空；再次直接点导航进入 → 仍是空状态（除非又从③带入）。\n\n三、结果与历史板块（板块③）布局重排\n改为上下结构：\n\n上方：历史任务列表（时间倒序）。每条任务行上带一个「去AI评测」按钮（点击携带该批次跳转到板块④）。\n\n下方：结果对比区\n\n默认为空。\n点击上方某条历史任务后，才在下方展开该批次的结果对比。\n结果对比用表格样式，采用\"每个『输入×目标』组合占一行\"：\n\n全屏\n复制\n输入(入参)\t出参\t使用的模型/算法\t状态\t用时\n第1条输入\t...\tGPT\t成功\t1.2s\n第1条输入\t...\t算法A\t成功\t0.8s\n第2条输入\t...\tGPT\t失败\t-\n出参为文本：过长则截断 + 点击展开。\n出参为图片：显示缩略图 + 点击放大。\n行数 = 输入条数 × 该批次目标数。\n四、试运行定位明确\n试运行 = 纯预览，结果不落历史、不参与 AI 评价。\nAI 评价只评\"正式跑批且已落历史\"的批次（即只能从板块③进入评价）。\n以上四条是纯前端/交互逻辑，可直接交给 AI 改。 不涉及脚本执行后端，互不影响，可以先做。", "summary": "前端逻辑修改需求（基于现有平台）"}, {"id": "doc-05", "title": "测评平台prd.md", "filename": "测评平台prd.md", "category": "PRD 主线", "size": 14282, "updated": "2026-06-06 14:55", "content": "大模型测评平台 PRD · 最终定稿 v1.2\n本版在 v1.1 基础上并入：模式切换草稿隔离、批量 image 参数走 URL、评价范围（全量/选中）、Excel 列名唯一性、evaluate 语义明确，并新增第十一章「编程实现注意事项」。\n\n一、项目概述\n本地运行的网页工具，供算法工程师调试 prompt、产品/运营对比不同大模型与算法 API 的输出效果。支持单条调试 + Excel 批量处理 + 试运行预览 + AI 逐条评价 + Excel/JSON 导出。\n\n核心特点：\n\n纯本地运行，IndexedDB 自动持久化，刷新/重开数据不丢\nJSON 导出/导入做备份与迁移；Excel 导入数据、导出结果\n多目标（大模型 + 算法 API）混合并排对比\n算法 API 粘贴文档自动接入（解析 → 表单 → 测试）\n批量跑前可\"试运行\"预览效果\nAI 逐条自动评价并打分（0–10），支持全量/选中行评价\n架构为\"未来切换纯前端 + 用户自填 key\"预留余地\n二、技术栈与架构约束\n2.1 技术栈\n框架：Next.js 14（App Router）+ TypeScript\nUI：Tailwind CSS + shadcn/ui\n外部调用：当前全部经 Next.js API 路由，密钥从 .env.local 读，绝不暴露前端\n持久化：IndexedDB（dexie）\nExcel：xlsx（SheetJS），前端解析与生成\n图片压缩：前端 canvas\n运行：本地 npm run dev，访问 localhost:3000\n不使用：云数据库、云部署、用户登录\n2.2 架构约束\n(1) 模块化、低耦合：每个功能模块为独立组件，新增小功能只加组件、不动主流程；业务逻辑与 UI 分离（hooks/service）。\n(2) 抽象调用层：所有外部调用走 services/llmClient.ts、services/apiClient.ts。当前打到 Next.js API 路由；未来切前端直连只改调用层。⚠️ 未来纯前端直连部分模型受 CORS 限制可能仍需轻量代理。\n(3) Key 来源抽象：统一 getApiKey(provider)，当前从 .env.local 读，未来改前端输入只换此处。\n(4) 适配器模式：模型用 adapter（非 switch），新增模型=加一个 adapter 文件。\n(5) 配置集中：模型列表、并发、超时、body 上限等进 config/。\n\n实施提醒：第一批先搭骨架（调用层 + getApiKey + adapter 骨架），骨架歪了后期难救。\n\n三、数据模型\ntypescript\nconst SCHEMA_VERSION = 1;\n\ninterface Project {\n  id: string;\n  version: number;             // = SCHEMA_VERSION\n  name: string;\n  createTime: number;\n  updateTime: number;\n  apiConfigs: ApiConfig[];     // 只存定义\n  tasks: Task[];\n}\n\ninterface Task {\n  id: string;\n  createTime: number;\n  finishTime?: number;\n  mode: 'single' | 'batch';\n  inputs: TaskInput[];\n  targetIds: string[];\n  concurrency: number;         // 1~10，默认3\n  apiParamsSnapshot: {         // 只存定义/列映射，不存值\n    targetId: string;\n    paramDefs: ParamDef[];\n  }[];\n  results: ResultRow[];\n  evaluation?: Evaluation;\n  status: 'idle' | 'running' | 'partial' | 'done' | 'error' | 'cancelled';\n}\n\ninterface TaskInput {          // 所有“值”都存这里\n  id: string;\n  prompt: string;\n  images: ImageItem[];\n  extraFields?: Record\u003cstring, any\u003e;   // 算法API参数值（含image参数的URL字符串）\n}\n\ninterface ImageItem {\n  id: string;\n  name: string;\n  source: 'url' | 'base64';\n  value: string;\n}\n\ninterface ResultRow {\n  inputId: string;\n  items: ResultItem[];\n}\n\ninterface ResultItem {\n  targetId: string;\n  targetName: string;\n  status: 'pending' | 'running' | 'success' | 'error' | 'interrupted';\n  outputText?: string;\n  outputImages?: string[];     // 展示用原图\n  latencyMs?: number;\n  error?: string;\n}\n\ninterface ModelConfig {        // config/models.ts 写死\n  id: string;\n  name: string;\n  type: 'llm' | 'multimodal';\n  imageInput?: 'url' | 'base64' | 'both';\n}\n\ninterface ApiConfig {          // 只存定义\n  id: string;\n  name: string;\n  url: string;\n  method: 'GET' | 'POST';\n  headers: { key: string; value: string }[];\n  inputParams: ParamDef[];\n  outputImagePath?: string;\n  outputTextPath?: string;\n  status: 'unverified' | 'tested_ok' | 'tested_fail';\n  rawDoc?: string;\n}\n\ninterface ParamDef {\n  name: string;\n  type: 'string' | 'number' | 'boolean' | 'image';\n  required: boolean;\n  desc?: string;\n  defaultValue?: any;\n  value?: any;   // ⚠️ ApiConfig 中仅占位、无效、不持久化；真值存 TaskInput\n}\n\ninterface Evaluation {\n  userRequirement: string;\n  evalPrompt: string;\n  evalModelId: string;\n  scope?: 'all' | 'selected';          // 评价范围：全量 / 选中行\n  selectedInputIds?: string[];         // scope='selected' 时生效\n  status: 'idle' | 'running' | 'done' | 'error';\n  results?: {\n    inputId: string;\n    scores: { targetId: string; score: number; comment: string }[];  // 0–10，一位小数\n    summary: string;\n    recommendation: string;\n  }[];\n}\n核心数据原则：值永远存 TaskInput；定义存 apiParamsSnapshot；绝不把值写回 ApiConfig；单条模式同样遵守（inputs 长度=1）。\n\n四、功能需求\n模块 1：顶部工具栏\n新建项目（有未导出修改时二次确认）\n导入 JSON（校验 version：兼容则还原，不兼容明确提示不强行导入；覆盖前二次确认）\n导出 JSON（项目名_YYYYMMDD_HHmm.json）\n项目名可重命名；IndexedDB 自动保存，JSON 仅备份/迁移\n模块 2：算法 API 接入\n粘贴文档 →「智能解析」/api/parse-doc（强制结构化输出，function calling 优先，降级 JSON+容错解析）→ 返回草稿 + warnings\n渲染可编辑表单；解析提示区高亮缺失/不确定项\n「一键测试」/api/test-api（带诊断）：成功渲染返回、状态 tested_ok；失败展示错误+诊断、状态 tested_fail\n输出路径校验：outputImagePath 与 outputTextPath 全空时不许标 tested_ok\n通过后存入 apiConfigs；列表支持查看/编辑/删除/重新解析\n模块 3：输入区\n模式切换：单条 / 批量\n\n模式切换数据处理：单条与批量各自维护独立草稿，切换时不互相清空/覆盖（分开保存于内存/IndexedDB）；切回原模式恢复上次草稿；正式运行只使用当前所在模式的数据生成 Task。\n\n单条模式：\n\nprompt 文本框；图片 Tab 切「本地上传(base64)」「URL」，多张可删\n选中算法 API → 自动生成入参表单填值；type:'image' 参数复用图片输入组件\n值写入该条 TaskInput（inputs 长度=1）\n批量模式（Excel）：\n\n「下载导入模板」：按选中目标所需字段生成空 Excel；列名用固定英文 key（prompt、image_url、参数原始 name）\n「导入 Excel」→ 前端可编辑表格（行可查看/编辑/删除），确认再运行；不匹配列给提示\n落位：prompt→prompt；image_url→images(source='url')；算法API参数列→extraFields\n算法 API 的 type:'image' 参数：批量模式下以 URL 字符串列承载（列名=参数原始 name），存入 TaskInput.extraFields[参数名]（值为 URL 字符串）。即批量模式下所有图片一律走 URL，不支持本地文件。\n\n显示条数预览\n模块 4：目标选择\n多选：大模型 + 所有 tested_ok 算法 API，支持混合\n置灰：有图时 type:'llm' 置灰；图为 base64 但模型 imageInput='url' → 提示改用 URL 或置灰\n模块 5：试运行 \u0026 批量运行\n并发数运行前可设（1~10，默认3，Task.concurrency），管控批量调用 + AI 评价调用，超出排队\n试运行：仅第1条，临时展示、不落历史\n批量运行：按并发分批；单调用超时（默认60s）；取消=前端 AbortController（标记 cancelled/interrupted，后端已发请求不保证终止）；运行中刷新→未完成标 interrupted 提示重跑（不做续传）；算法API走 /api/run-api\n模块 6：结果对比区\n单条：多列卡片并排；批量：表格视图（行可展开）\n每结果：目标名+类型标签、状态、输出（文本/图片可放大）、耗时（「1.2s」）、错误\n实时更新；部分成败 → status=partial 分别标识\n模块 7：AI 评价（逐条）\n填测评需求 →「生成评价Prompt」/api/gen-eval-prompt（可编辑）→ 选裁判模型（含图时 type:'llm' 置灰，须 multimodal）\n评价范围：默认全量（逐条评价所有输入）；提供**「仅评价选中/可见行」**选项（避免大数据量烧 token），勾选粒度本期支持\"全选 / 试运行那条 / 手动勾选行\"\n「开始评价」→ 对范围内每条调用 /api/evaluate；results 按 inputId 归属；评价并发受 Task.concurrency 管控\n逐条语义：每次调用处理一条输入，传入 results[]=该 inputId 下各目标的 ResultItem，裁判横向对比该条各目标输出\n图片传输：结果图为 URL → 只传 URL；为 base64 → 前端 canvas 压缩（最长边1024px）后传，原图仍保留展示\n展示：各目标评分（0–10）+点评、总体结论、推荐项\n模块 8：导出结果（Excel）\n每行一条输入，每目标占列；含 AI 评分列\n列名唯一性：以 targetId（或保证唯一的展示名）生成，避免重名覆盖；建议列头 {targetName}#{targetId简写}_输出、..._耗时\n图片：URL→存链接；base64→存占位文字+提示\"建议用 URL 输出查看\"（不打包 zip）\n文件名 项目名_结果_YYYYMMDD_HHmm.xlsx\n模块 9：历史任务\nTask 列表（时间倒序），点击完整重现输入/输出/评价；算法API入参由 extraFields + apiParamsSnapshot.paramDefs 还原\n五、后端 API 设计\nPOST /api/chat              调用单个大模型\n  入参：{ modelId, prompt, images[] }\n  出参：{ outputText, outputImages[], latencyMs }\n\nPOST /api/parse-doc         解析文档为 ApiConfig 草稿\n  入参：{ doc }   出参：{ apiConfig, warnings[] }\n  要点：强制结构化输出（function calling 优先，降级 JSON+容错）\n\nPOST /api/test-api          【接入阶段单次测试，带诊断】\n  入参：{ apiConfig, paramValues }\n  出参：成功 { ok:true, response, extractedImages[], extractedText, latencyMs }\n        失败 { ok:false, error, diagnosis }\n\nPOST /api/run-api           【批量/试运行正式调用，纯执行不带诊断】\n  入参：{ apiConfig, paramValues }   // 来自 TaskInput\n  出参：{ status, outputText?, outputImages[], latencyMs, error? }\n\nPOST /api/gen-eval-prompt\n  入参：{ userRequirement, targetNames[] }   出参：{ evalPrompt }\n\nPOST /api/evaluate          【逐条调用：一次处理一条输入】\n  入参：{ evalPrompt, evalModelId, inputId, results[] }  // results=该inputId下各目标ResultItem，图片为压缩版或URL\n  出参：{ inputId, scores[](0-10), summary, recommendation }\nbody 上限：相关 Route Handler 配置放大（建议 25MB）。\n\n六、配置\n.env.local：各模型 key（用户自填，不提交）\nconfig/models.ts：大模型数组（id/name/type/imageInput）\nconfig/runtime.ts：默认并发(3)、上限(10)、超时(60s)、body上限(25MB)\n图床预留：uploadImage 默认关闭，待合规后接 OSS\n\n七、数据存储与持久化规则\nIndexedDB 日常自动保存（刷新不丢）；JSON 备份/迁移（带 version 校验）\n图片：url 存 url；base64 存完整 base64（展示用原图）\nbase64 传大模型前前端 canvas 压缩（最长边1024px）\n文件名：JSON 项目名_YYYYMMDD_HHmm.json；Excel 项目名_结果_YYYYMMDD_HHmm.xlsx\n八、明确不做（本期外）\n用户登录/云数据库/云部署、图床上线（仅预留）、批量本地图片、断点续传、图片生成数量选择、JSON轻量导出、Excel图片打包zip、纯前端直连（仅架构预留）\n\n九、验收标准\n理想路径： 启动正常；单条混合多目标对比+耗时；批量(模板→填→导入→可编辑表格→试运行→设并发→运行→表格)；文档解析→表单→测试；AI逐条评价(评分+结论按inputId)；Excel导出正常；JSON刷新后完整还原；IndexedDB刷新不丢。\n\n异常路径（必测）： 解析失败提示；测试失败诊断；部分成败标识partial；大JSON/大base64不卡死；版本不兼容提示；含图置灰与base64+仅URL模型提示；运行中刷新标interrupted；输出路径全空不许tested_ok；base64评价传压缩版原图仍展示；取消标cancelled且清空排队；模式切换草稿不丢；Excel重名目标列不覆盖；评价范围选中行只评选中条。\n\n十、实施建议（分两批）\n第一批（骨架+核心）： 项目骨架(Next+Tailwind+shadcn+dexie)；架构骨架先行(调用层+getApiKey+adapter骨架+config)；IndexedDB+JSON导入导出+version；输入区(单条+批量Excel+模板+可编辑表格+模式草稿隔离)；目标选择+置灰；可调并发+试运行+批量运行(分批/超时/取消/刷新中断)；结果区+耗时；Excel导出(列名唯一)；历史任务。\n\n第二批： 算法API接入(parse-doc/test-api/run-api/表单/输出路径校验)；AI逐条评价(gen-eval-prompt/evaluate/评价范围/base64压缩传裁判)。\n\n十一、编程实现注意事项（交付给编程 agent）\nIndexedDB 写入策略：批量结果逐条返回时，不要每条立即整对象写库；用 debounce/批量提交，避免频繁 IO 卡顿。\n存储配额预期：大量 base64 可能触及浏览器配额（数百 MB~1GB）；本期不主动处理，但须捕获写入失败并提示（\"存储空间不足，建议改用 URL 图片或导出备份\"）。\n取消要清空排队：取消时，已发出请求中断 + 排队中未发出任务一并清除，状态统一 cancelled/interrupted。\n试运行结果隔离：仅结果区临时展示，不写历史 Task，状态与正式运行隔离，勿串台。\nadapter 输出归一化：各模型 adapter 必须归一为 { outputText, outputImages[], latencyMs }；上层组件不得出现按 modelId 的 if-else，差异全收敛在 adapter 内。\nNext.js 14 App Router body 上限写法：用 App Router(Route Handler)对应写法(route segment config/手动读流)，勿照搬 Pages Router 的 api.bodyParser。\nExcel 类型转换：SheetJS 读出类型可能与 ParamDef.type 不符(number读成string等)；导入时按 paramDef.type 强制转换+校验，失败行给提示。\nbase64 压缩位置：canvas 压缩在前端完成后再传后端评价；只压\"传给裁判的副本\"，结果区与存储保留原图。", "summary": "大模型测评平台 PRD · 最终定稿 v1.2"}, {"id": "doc-06", "title": "测评平台v4.4.md", "filename": "测评平台v4.4.md", "category": "历史版本", "size": 17287, "updated": "2026-06-06 14:55", "content": "PRD v4.4 修订文档 · Agent 自动接入\n本文档为 v4.3 的增量修订,只改\"接入机制\"这一块:把\"平台用死规则模拟 Agent(gen-script/run-script/fix-script + 标记 + 非空判定 + 3次上限)\"整体替换为\"真 Agent + tool use\"。v4.3 其余内容(三标签、5 板块、评价、跑批、ComfyUI、数据存储等)全部沿用。SCHEMA_VERSION 升至 6。\n\n〇、本次修订核心理念\n为什么改\nv4.3 用\"平台写死规则\"去模拟一个 Agent(生成脚本→跑→报错喂回改→3 次上限→标记解析→非空判成功),这套笨且脆弱:AI 输出截断就崩、修复死板、判断成败靠死规则。真实体验远不如 Claude Code 那种\"读文档→写脚本→自测→自己装库→反复迭代到跑通\"的 Agent。\n\n怎么改\n把上述死规则整体换成真 Agent + tool use(function calling):\n\n平台后端跑一个 Agent 循环,给 AI 配几个工具(跑脚本 / 装库 / 保存接口)。AI 自主驱动整个接入过程——自己写脚本、自己决定跑、自己看报错、自己装库、自己反复改,直到真跑通,再自己整理参数和能力标签、保存接口。平台只提供工具和循环,不再用死规则去管\"先干啥后干啥/成没成功\"。\n\n关键定调\n干活的 Agent 模型固定为 DeepSeek(V4 Pro / deepseek-chat,需支持 function calling),由用户接入其 API Key,不可换成不支持 tool use 的模型。\n被测评的目标模型仍可自由接入/选择(它们只被对比,不碰工具)。\nv4.3 里的 /api/gen-script、/api/run-script(作为独立测试入口)、/api/fix-script、SCRIPT/META 标记、修复 3 次上限——全部废弃,由 Agent 取代。\n脚本本身的约定(stdin 传参、RESULT_JSON 结果格式、非空判成功、不许编造数据)保留,但不再由平台代码强制,而是写进 Agent 的 system prompt,由 Agent 自我遵守。\n一、数据模型变更\ntypescript\nconst SCHEMA_VERSION = 6;   // 导入 version \u003c 6 拒绝,不自动迁移\n\n// TargetConfig 基本沿用 v4.3,仅调整 script 字段含义与新增 Agent 接入痕迹\ninterface TargetConfig {\n  id: string;\n  name: string;\n  type: 'custom' | 'comfyui';\n  capability: CapabilityTag;          // text | multimodal | image(沿用 v4.3 三标签)\n  source: 'agent' | 'manual';         // ← 改:'ai-parsed' 改为 'agent'(由 Agent 自动接入)\n  inputParams: ParamDef[];            // 由 Agent 整理并通过 save_target 传入\n\n  script?: {\n    lang: 'python';                   // 本期仅 python(node/shell 不支持)\n    code: string;                     // Agent 跑通后的最终脚本\n    verified: boolean;                // Agent 真跑通才 true\n    lastTestInput?: string;           // ← 新增:最后一次测试塞入的参数(给用户确认用)\n    lastTestOutput?: string;          // 最后一次测试的原始输出(给用户确认用)\n    outputDir?: string;               // 脚本图片产物临时落地文件夹\n  };\n\n  comfyui?: { serverUrl: string; baseModel: string; loraName?: string; loraWeight?: number; };\n  apiKeyRef?: string;\n  status: 'unverified' | 'tested_ok' | 'tested_fail' | 'unsupported';\n  rawDoc?: string;                    // 接入时粘贴的对接文档原文\n  preset?: boolean;\n}\n其余数据模型(Project / Task / TaskInput / ResultItem / EvaluationRecord / GenDataRequest / ParamDef / CapabilityTag 三标签等)完全沿用 v4.3。\n\n说明:\n\nsource 取值从 'ai-parsed' | 'manual' 改为 'agent' | 'manual'(Agent 自动接入 / 手动填改)。\nscript 新增 lastTestInput,与 lastTestOutput 一起在\"用户确认建接口\"时显著展示。\n二、Agent 模型配置(干活的模型)\n2.1 两类模型严格区分\n← 可左右滑动查看更多内容 →\n全屏\n复制\n类别\t用途\t选择自由度\ttool use 要求\nAgent 模型\t后端干活的接入助手(写脚本/跑/装库/接接口)\t固定 DeepSeek,用户接入其 Key\t必须支持 function calling\n测评目标模型\t被对比测评的对象\t完全自由接入/选择\t不需要\n2.2 Agent 模型接入\n设置中单独一处「自动接入助手(Agent)模型」,固定为 DeepSeek(deepseek-chat / V4 Pro,以 DeepSeek 官方支持 function calling 的型号为准)。\n用户须在 .env.local 配置 DEEPSEEK_API_KEY;未配置时,自动接入功能不可用并明确提示「请先配置 DeepSeek API Key 以启用自动接入」。\nAgent 调用走 DeepSeek OpenAI 兼容端点(baseURL: https://api.deepseek.com),格式为 OpenAI function calling。\n不提供\"Agent 换其他模型\"选项(避免用户选到不支持 tool use 的模型导致 Agent 失效)。\n2.3 测评目标模型\n内置预置目标(built-in)+ 用户通过 Agent 自动接入的目标(script)+ ComfyUI,沿用 v4.3 全部规则,自由接入/选择不变。\n三、Agent 自动接入流程(板块② —— 取代 v4.3 第四章)\n3.1 用户视角(极简)\n板块②点「自动接入」→ 粘贴对接文档 → 点「开始」\n   ↓\n实时进度区显示 Agent 正在干嘛(写脚本→跑→缺库装requests→改→再跑→跑通…)\n   ↓\nAgent 跑通 → 显著展示三项【默认不折叠】:\n   ① 本次测试塞入的输入参数\n   ② 脚本真实返回的原始输出\n   ③ 渲染结果(文本/图片懒加载)\n   + Agent 的说明(这是什么接口/什么能力/要填哪些参数)\n   ↓\n用户确认结果真实有效 → 点「确认接入」→ 存为 TargetConfig(status=tested_ok)\n   (脚本代码默认折叠,可展开查看/手动编辑)\n   ↓\n若 Agent 始终跑不通 → 展示失败原因 + Agent 给的解决建议(含终端命令)\n   → 用户可:重试 / 手动改脚本后接入 / 强存 unverified\n3.2 Agent 后端循环\n后端 /api/agent-connect 启动 Agent 循环:\n把 system prompt(见 3.4)+ 用户文档发给 DeepSeek。\nDeepSeek 决定调工具 → 后端执行工具 → 结果喂回 → 循环。\n直到 DeepSeek 不再调工具(完成)或达到循环上限。\n循环上限(默认 30 步,config 可调),防失控烧 token。\n全程通过 SSE / 流式把进度推给前端实时展示。\n3.3 Agent 可用工具(tool use)\n← 可左右滑动查看更多内容 →\n全屏\n复制\n工具\t作用\t后端实现\nrun_script\t本机执行 Python 脚本,返回 stdout/stderr/退出码\tchild_process 子进程 + 超时杀进程(Windows 杀进程树),沿用 v4.3 执行机制\ninstall_package\tpip 安装缺失的包\tchild_process 执行 pip install\nsave_target\t跑通后保存为接口(暂存,待用户确认)\t暂存为 pending,不直接写库,返回前端供用户确认后才真正存入\n工具执行的安全/超时/key 注入/图片产物处理全部沿用 v4.3 第六章(stdin 传参、超时杀进程、key 经环境变量注入、图片转 base64 收进结果体系等)。\n关键改动:这些约束不再由平台单独的 run-script API 死管,而是 Agent 通过 run_script 工具调用时,后端工具实现层统一保障。\n3.4 Agent System Prompt(写进 config,核心)\nsystem prompt 把原 v4.3 的\"束缚\"转化为\"Agent 自我遵守的规矩\":\n\n你是 API 接入助手。任务:根据用户对接文档,编写 Python 脚本调用该 API,在本机实际运行测试,自主修复所有问题直到真跑通并返回有效结果,然后保存为可用接口。\n\n工具:run_script(本机跑脚本,脚本从 stdin 读参数 JSON)、install_package(pip 装包)、save_target(验证通过后保存接口)。\n\n流程(自主驱动,不要每步问用户):\n\n读文档,判断接口能力:纯文本对话 / 看图输出文字 / 生成图片。\n写 Python 脚本:参数从 stdin 读取(json.loads(sys.stdin.read())),不写死;API key 从环境变量读;异步 API(提交→轮询)在脚本内完成完整轮询;脚本最后必须 print 一行结果 JSON:{\"text\":\"文本或空\",\"images\":[\"URL或本地路径\",...]},这是判断成功的唯一依据。\n调 run_script 用合理测试参数实际运行。\n自主处理结果:缺库→install_package;有 bug→改脚本;鉴权/参数错→对照文档改;反复迭代直到输出非空结果 JSON。\n判断能力标签:纯文字→text;能接图输出文字→multimodal;输出图片→image。\n整理参数清单(名称/类型 string·number·boolean·image/是否必填/说明)。\n调 save_target 传入:接口名、最终脚本、参数清单、能力标签。\n用简短中文告诉用户:接口类型、要填哪些参数、测试返回了什么(供用户确认真实有效)。\n铁律:必须真跑通才保存;结果 JSON 必须是 API 真实返回,不得编造/占位;环境缺 Python 或缺库时给清晰可照做的终端命令;全程自主完成。\n\n四、后端 API 变更\n删除(由 Agent 取代)\n❌ /api/gen-script\n❌ /api/run-script(作为独立接入测试入口)\n❌ /api/fix-script\n❌ SCRIPT/META/RESULT_JSON 的\"标记解析\"作为接入主流程(结果 JSON 格式约定仍在 Agent prompt 里,但平台不再围绕它做接入态机)\n新增\nPOST /api/agent-connect    Agent 自动接入(SSE 流式)\n  入参: { doc }            // 对接文档原文\n  处理: 用 DEEPSEEK_API_KEY 启动 Agent 循环;\n        循环中按需执行工具 run_script / install_package / save_target;\n        循环上限(默认30,config可调);max_tokens 调大(≥8192)防截断\n  流式推送(SSE): 每步进度 { type: 'thinking'|'tool'|'tool_result'|'done'|'error', ... }\n  最终: save_target 产出 pending 接入草稿(含 code/params/capability/lastTestInput/lastTestOutput),\n        返回前端待用户确认\n\nPOST /api/confirm-target   用户确认后真正存入接口\n  入参: { pendingTarget }  // 用户确认/可能微调后的接入草稿\n  处理: 存为 TargetConfig(script.verified=true, status=tested_ok)\n  出参: { target }\n保留(沿用 v4.3)\n/api/comfyui/list、/api/comfyui/run、/api/gen-data、/api/gen-eval-prompt、/api/evaluate\nbody 上限 25MB,App Router Route Handler 写法。\n内置预置目标(含裁判)走 built-in adapter 直调 HTTP,不经 Agent。\n跑批时的脚本执行\n跑批仍需执行已接入的脚本(用 TaskInput 真实值)。跑批不走 Agent(Agent 只管接入),而是后端有一个内部脚本执行能力(即原 run_script 工具的底层实现),跑批时直接调它:stdin 传参 → 执行 → 取结果 JSON → 归一化。\n即:run_script 的\"执行能力\"保留为后端内部函数,接入时供 Agent 调用,跑批时供执行流程调用;只是不再暴露为独立的 /api/run-script 接入测试端点。\n五、adapter 三类(沿用 v4.3,微调说明)\n全屏\n复制\nadapter\t服务对象\t执行方式\nbuilt-in\t内置预置目标(含裁判)\t平台写死 HTTP 直调,不走脚本不走 Agent\nscript\t用户经 Agent 接入的目标\t跑批时后端执行已存的脚本(stdin 传参,内部脚本执行函数)\ncomfyui\tComfyUI\t固定模板 + 异步三步\n三类输出统一归一化 { outputText, outputImages[], latencyMs },上层禁 if-else。\nAgent 仅用于\"接入阶段\";跑批阶段 script 目标直接执行已验证脚本,不再启动 Agent。\n六、配置变更\n.env.local 新增/明确:DEEPSEEK_API_KEY(Agent 模型必需);其余目标 key 沿用。\nconfig/agent.ts(新增):\nAgent 模型名(DeepSeek,固定)、baseURL、max_tokens(≥8192)\nAgent 循环步数上限(默认 30)\nAgent system prompt(见 3.4)\n工具定义(run_script / install_package / save_target 的 schema)\nconfig/runtime.ts(沿用 v4.3,调整):删除\"脚本修复次数上限(3)\"(已无 fix-script);保留脚本执行超时(60s,生图类可单独放宽,如 120s,config 可调)、脚本产物根目录(./outputs)、并发(3/上限10)、body 上限。\nconfig/presetTargets.ts、config/comfyTemplate.ts 沿用 v4.3。\n已删除 config/capabilities.ts(v4.2 已删)。\n七、前端变更(板块②接入区)\n「自动接入」改为主入口:粘贴文档 → 开始 → 实时进度区(消费 SSE,显示 Agent 每步:思考/写脚本/跑脚本/装库/报错/跑通)。\n跑通后显著展示三项(输入参数 / 原始输出 / 渲染结果)+ Agent 说明 → 用户「确认接入」才存。\n脚本代码默认折叠,可展开查看/手动编辑(手动兜底保留)。\n失败时展示 Agent 给的原因 + 解决建议(含终端命令);提供 重试 / 手动改后接入 / 强存 unverified。\n设置区分两处选模型:「自动接入助手模型(固定 DeepSeek)」与「测评目标模型(自由)」。\n其余 5 板块(① 跑批 / ③ 结果与历史 / ④ AI评价 / ⑤ 评价结果与历史)完全沿用 v4.3。\n八、明确不做(在 v4.3 基础上调整)\n新增/调整:\n\n不再用\"平台死规则模拟接入\"(无 gen-script/fix-script/标记解析作接入态机/修复3次上限);改用 Agent。\nAgent 模型不可换成不支持 function calling 的模型(固定 DeepSeek)。\nAgent 仅用于接入阶段,不介入跑批 / 评价 / 其他流程。\n沿用 v4.3 / 更早:\n\n模板接入、沙箱(本地自用本机主动执行,本期不做;对外多用户须另上)、shell 脚本(仅 python)、\"脚本没崩算成功\"、AI 把代码塞 JSON、测试通过自动建接口(仍须用户确认)、内置目标走脚本/Agent、contentKind 的 both 双语义、流式输出、任意 ComfyUI 工作流、AI 假数据自测、本地跑 SD/Diffusers、本地上传 LoRA、用户登录/云部署、批量本地图片、断点续传、Excel 图片打包 zip、纯前端直连(仅架构预留)。\n九、验收标准\n理想路径\n配置 DEEPSEEK_API_KEY 后,自动接入可用;未配置则明确提示。\n粘贴对接文档 → 点开始 → 进度区实时显示 Agent:写脚本→跑→(缺库)自动 install→改→再跑→真跑通输出非空结果 JSON。\n跑通后展示输入参数 + 原始输出 + 渲染结果 + Agent 说明;用户「确认接入」→ 存为 tested_ok,能力标签(text/multimodal/image)正确。\n异步 API(提交→轮询):Agent 写的脚本内部完成轮询并最终输出结果。\n接入的脚本目标,跑批时用真实参数(stdin 传入)正常执行、结果归一展示;脚本图片转 base64 进结果体系,JSON 导出后另一环境可重现。\nAgent 模型固定 DeepSeek;测评目标模型仍可自由接入/选择。\n三标签、5 板块、评价(④存 evaluations / ⑤回看导出)、ComfyUI、跑批、IndexedDB、JSON 导出导入(version=6)全部沿用 v4.3 且正常。\n异常路径(必测)\n未配 DEEPSEEK_API_KEY → 自动接入禁用并提示。\nAgent 循环达上限仍未跑通 → 展示失败原因 + 建议(含命令);用户可重试 / 手动改后接入 / 强存 unverified。\n缺 Python / 缺库 → Agent 自主 install 或给出可照做的终端命令(装 python 指引)。\nAgent 反复修复但脚本始终输出空结果 → 不保存,提示用户;绝不\"没跑通就接入\"。\nAgent 想保存的接口,用户在确认页看出返回是示例/占位 → 用户拒绝接入。\nrun_script 超时 → 杀进程(Windows 杀进程树),进程不堆积;循环不失控(上限 30)。\nDeepSeek 返回长脚本不再因截断报错(max_tokens≥8192);若仍异常,Agent 可在下一轮续写。\n导入 version\u003c6 → 拒绝并提示\"版本过旧不兼容\"。\n沿用 v4.3 全部异常项(三标签置灰、生图费用弹框、评价洁癖、ComfyUI 连不上、部分成败 partial、取消清排队等)。\n编程注意事项\nAgent 在后端跑,不在浏览器;前端只发起 + 看进度(SSE)+ 确认接入。\nDeepSeek function calling 用 OpenAI 兼容格式(tools / tool_calls);model 名以 DeepSeek 官方支持 function calling 者为准;max_tokens ≥ 8192;循环上限 30(config)。\n工具实现层统一保障安全约束:run_script 用 child_process + 超时杀进程(Windows 杀进程树)、stdin 传参禁字符串拼接进 code、key 经环境变量注入不落明文、图片产物转 base64 进结果体系(沿用 v4.3 压缩规则)。\nsave_target 不直接写库:产出 pending 草稿 → 前端展示三项供用户确认 → /api/confirm-target 才真存(防假正确)。\n跑批不走 Agent:script 目标跑批直接调内部脚本执行函数(原 run_script 底层),Agent 只管接入。\n手动兜底保留:脚本/参数/能力标签全程可手动编辑;Agent 跑不通也可手动改后接入或强存 unverified。\n其余(adapter 三类归一化禁 if-else、preset 不走脚本/Agent、核心数据原则值存 TaskInput、两维正交草稿、SCHEMA_VERSION=6 拒旧、IndexedDB debounce+配额提示、评价存 Project.evaluations、三标签 image 独占生图、Excel 列名 targetId、含图裁判须 multimodal 等)全部沿用 v4.3。\n十、实施批次(在 v4.3 基础上调整第二批)\n第一批:沿用 v4.3(骨架 / 三类 adapter 骨架 / IndexedDB / JSON version=6 / 两维输入 / 三标签筛选 / 并发·试运行浮窗·批量 / 结果区 / Excel 导出 / ③历史 / 5 板块导航 / built-in 预置目标跑通核心对比)。\n第二批(Agent 接入,本次重点):\nconfig/agent.ts(DeepSeek 配置 + system prompt + 工具定义)\n后端内部脚本执行函数(child_process + 超时 + stdin 传参 + Windows 杀进程树 + 图片转结果体系)——同时服务 Agent 的 run_script 工具与跑批执行\n/api/agent-connect(Agent 循环 + SSE 进度推送 + 循环上限 + max_tokens 调大)+ /api/confirm-target\n前端:自动接入入口 + 实时进度区 + 三项确认页 + 手动编辑兜底 + Agent 模型(DeepSeek)配置项\nComfyUI 收窄(沿用 v4.3:list + 固定模板 + 三步)\n第三批:沿用 v4.3(AI 造数据 + ④逐条评价存 evaluations + ⑤评价结果与历史)。", "summary": "PRD v4.4 修订文档 · Agent 自动接入"}, {"id": "doc-07", "title": "测评平台v4.5.md", "filename": "测评平台v4.5.md", "category": "历史版本", "size": 3353, "updated": "2026-06-06 14:55", "content": "PRD v4.5 修订 · AI 评价模块(多维度 + 排序)\n增量修订,只改板块④/⑤评价部分,其余沿用 v4.4。SCHEMA_VERSION 升至 7。\n\n一、评价流程改为多维度\n填测评需求\n → 确定维度(三选一可组合):\n    ① 选内置【预设维度集】\n    ② AI 按需求生成候选维度(若干个,每个带说明)\n    ③ 选预设后再让 AI 补充/微调\n → 用户勾选主要考察的维度(可增删改)\n → 开始评价:AI 对每条输入×每个目标×每个维度逐项打分(0–10),各维度独立,不算总分,每维度带一句理由\n → 出表格(横向滚动 + 首列固定 + 每维度可排序)\n → 存入 Project.evaluations(⑤回看/导出沿用)\n二、数据模型\ntypescript\nconst SCHEMA_VERSION = 7;\n\ninterface EvalDimension { name: string; desc?: string; }\n\ninterface DimensionPreset {          // config/dimensionPresets.ts 内置\n  id: string; name: string; scene: string; dimensions: EvalDimension[];\n}\n\ninterface EvaluationRecord {\n  id: string;\n  sourceTaskId: string;\n  createTime: number;\n  evalModelId: string;\n  userRequirement: string;\n  dimensions: EvalDimension[];       // 本次选定维度\n  evalPrompt: string;\n  scope: 'all' | 'selected';\n  selectedInputIds?: string[];\n  count: number;\n  status: 'done' | 'error';\n  results: {\n    inputId: string;\n    scores: {\n      targetId: string;\n      targetName: string;\n      dimensionScores: { dimension: string; score: number; comment: string }[];  // 按维度打分,无总分\n      overallComment?: string;\n    }[];\n    summary: string;\n    recommendation: string;\n  }[];\n}\n要点:scores 按维度数组打分,不出现 total/总分字段。\n\n三、后端 API\nPOST /api/gen-dimensions   { userRequirement, presetId? } → { dimensions: EvalDimension[] }   // 若干个,带 desc\nPOST /api/gen-eval-prompt  { userRequirement, dimensions, targetNames[] } → { evalPrompt }      // 要求按维度逐项打分+理由,明确不要总分\nPOST /api/evaluate         { evalPrompt, dimensions, evalModelId, inputId, results[] }\n                           → { inputId, scores:[{targetId,targetName,dimensionScores:[{dimension,score,comment}],overallComment}], summary, recommendation }\n                           // 裁判走 built-in,强制结构化 JSON+容错,无总分\n四、前端表格\n列:[输入(sticky)] [目标(sticky)] [维度1] [维度2] … [维度N] [总体点评]\n横向滚动;输入/目标列 position:sticky;left:0 固定。\n每个维度列头可点击排序:循环切换「默认 → 高到低 → 低到高」,带箭头指示;一次只按一个维度排序(点别的列头切换排序依据)。\n维度评分单元格 hover/点击显示该维度评分理由(不占主表宽度)。\n无总分列。\n五、配置\n新增 config/dimensionPresets.ts:内置几套预设维度集(如 翻译/文案/客服/通用),可扩展。\n六、验收\n填需求 → 选预设/AI生成维度(若干、带说明)→ 勾选 → 逐维度打分(各维度独立、无总分、带理由)\n表格横移、首列固定、每维度列头可排序(高低切换)、理由可查看\n存入 evaluations、⑤可回看/导出 Excel(含各维度分+理由,无总分列)\n导入 version\u003c7 拒绝提示\n七、明确不做\n评价不算总分/不加权汇总;参考资料喂裁判作评分依据(本期只做预设维度集,资料依据放后期)\n其余沿用 v4.4\n", "summary": "PRD v4.5 修订 · AI 评价模块(多维度 + 排序)"}, {"id": "doc-08", "title": "测评平台v4.6.md", "filename": "测评平台v4.6.md", "category": "历史版本", "size": 4973, "updated": "2026-06-06 14:55", "content": "PRD v4.6 修订 · 电子宠物(小猪助手)\n增量修订,只新增\"电子宠物\"这一个轻量彩蛋功能,其余全部沿用 v4.5。纯前端,不涉及核心数据/接入/评价逻辑,SCHEMA_VERSION 不变(仍为 7);宠物自身的少量偏好状态单独存储。\n\n〇、目的\n在网站角落放一只原创小猪助手作为电子宠物,提升趣味与陪伴感;会浮动、眨眼、点击说话,并能根据平台运行状态切换表情。纯装饰彩蛋,可隐藏、不干扰任何核心操作。\n\n一、形象与版权(重要)\n形象为自行原创/改造的小猪,不得直接使用 Claude(Anthropic)官方吉祥物或任何受版权保护的形象,避免上架 GitHub 后侵权。\n素材为原创绘制 或 免费可商用资源;素材文件放 public/pet/。\n表情资源:idle(待机)/blink(眨眼)/happy(开心)/sad(难过)/busy(忙碌),至少 5 张图(或 SVG / 单个 Lottie)。\n二、功能\n2.1 基础形态(本期实现)\n固定悬浮于页面右下角(默认),z-index 高于内容但低于关键弹框(费用确认/评价等弹框不被遮挡)。\n待机时:轻微上下浮动(CSS 动画)+ 随机间隔眨眼。\n点击小猪 → 头顶冒气泡,随机说一句台词(台词写死,见 2.3),数秒后自动消失。\n可拖动:用户可拖到任意位置,位置记忆。\n可隐藏/显示:提供\"收起宠物\"按钮;隐藏后在角落留一个小图标可重新唤出;显示/隐藏与位置状态持久化。\n2.2 状态联动(本期实现,轻量)\n监听平台全局运行状态,自动切表情 + 说对应台词:\n\n全屏\n复制\n平台状态\t宠物表情\t示例台词(随机库取一句)\n空闲/待机\tidle\t\"今天想测哪个模型呀~\"\n跑批/试运行进行中\tbusy\t\"努力调用中,哼哧哼哧…\"\nAgent 自动接入中\tbusy\t\"正在帮你接口子,稍等哦~\"\n出现错误/失败\tsad\t\"呜…好像哪里不太对劲\"\n跑批/接入/评价成功完成\thappy\t\"搞定啦!🎉\"\n评价完成\thappy\t\"点评写好咯,快看看~\"\n状态切换有简单过渡;同一时刻只显示一个表情。\n联动仅\"读\"平台状态,不写、不影响任何业务数据。\n2.3 台词库\n台词写死在 config/petLines.ts,按状态分组,每组若干句随机抽取。\n中文为主,可带 emoji;语气轻松卖萌。\n2.4 可选彩蛋(本期可不做,标记为后续)\n「和小猪聊天」按钮:点开后真调 DeepSeek(复用 Agent 模型 key),用一段\"话痨卖萌小猪\"性格 prompt 回话。\n默认关闭;明确提示\"开启后聊天会消耗 token\";本地工具中避免干扰干活,做成独立可关面板。\n本期可只留入口或完全不做,放 backlog。\n三、数据 / 存储\n不进 Project / 不进 SCHEMA;宠物偏好单独存 IndexedDB(或 localStorage)一个小键:\ntypescript\ninterface PetPrefs {\n  visible: boolean;            // 是否显示,默认 true\n  position?: { x: number; y: number };  // 拖动后的位置\n  chatEnabled?: boolean;       // 是否开启真聊天彩蛋,默认 false\n}\n刷新后恢复显示/隐藏与位置。\n四、前端实现\n新增组件 \u003cPetPig /\u003e,挂在全局布局(所有板块都能看到)。\n状态机:idle / blink / happy / sad / busy,默认 idle,随机眨眼。\n监听全局运行事件(跑批/试运行/Agent接入/评价 的 进行中/成功/失败)切换表情;事件可复用现有任务/接入状态。\n实现:CSS 动画(浮动/眨眼)+ 切图(或 Lottie);点击冒气泡随机台词;可拖动(指针事件)+ 可隐藏(状态持久化)。\n性能:动画不可吃重 CPU;大批量跑批时宠物动画自动降频或保持轻量,不影响主流程。\n不遮挡:关键弹框出现时宠物 z-index 低于弹框;不挡住按钮/表格的可点区域。\n五、配置\nconfig/petLines.ts(新增):各状态台词库。\npublic/pet/(新增):原创小猪表情素材(idle/blink/happy/sad/busy)。\n(可选)若做聊天彩蛋:复用 DeepSeek key + 一段宠物性格 system prompt。\n六、验收\n右下角出现原创小猪,待机浮动 + 随机眨眼。\n点击 → 冒气泡随机台词 → 数秒消失。\n跑批/接入/评价 进行中→busy、成功→happy、失败→sad,表情与台词正确联动。\n可拖动到任意位置;可收起,收起后能重新唤出;位置/显隐刷新后保持。\n关键弹框(费用确认/评价等)不被宠物遮挡;宠物不挡核心操作。\n宠物不影响任何核心数据与流程;关闭宠物后平台一切照常。\n大批量跑批时宠物不造成明显卡顿。\n(若做聊天彩蛋)默认关闭、有 token 消耗提示、可独立关闭。\n七、明确不做\n不使用 Claude/Anthropic 官方吉祥物或任何受版权保护形象(原创)。\n宠物不参与/不影响 数据存储、接入、跑批结果、评价结果。\n复杂养成系统(喂养/等级/经验等)本期不做。\n真聊天彩蛋本期可选/可缓做,默认关闭。\n八、实施\n单独一小批,独立于核心三批,可随时插入(纯前端、低风险)。\n顺序建议:先素材原创 → \u003cPetPig /\u003e 基础形态(浮动/眨眼/点击台词/拖动/隐藏)→ 状态联动 → (可选)聊天彩蛋。", "summary": "PRD v4.6 修订 · 电子宠物(小猪助手)"}, {"id": "doc-09", "title": "测评平台v4.7.md", "filename": "测评平台v4.7.md", "category": "历史版本", "size": 4834, "updated": "2026-06-06 14:55", "content": "PRD v4.7 修订 · 电子宠物(原创像素小狗 + 自主移动)\n增量修订,只改 v4.6 的电子宠物功能:① 形象从小猪换为原创像素风小狗;② 宠物能在页面两侧留白区自主移动(漫游)。其余沿用 v4.6/v4.5。纯前端彩蛋,不涉及核心数据/接入/评价,SCHEMA_VERSION 不变(仍为 7)。\n\n〇、本次修订两件事\n换形象:贴纸/卡通小猪 → 原创像素艺术风格小狗。\n能自主移动:宠物在页面左右两侧留白竖带内自动游走,不进工作区;留白不足时退回角落待机。\n一、形象与版权(原创像素小狗)\n形象为原创像素艺术(pixel art)风格小狗,简洁可爱;自行绘制(CSS/SVG/canvas 像素块 或 原创 sprite 图)。\n不得使用任何受版权保护的形象(不照搬、不微改第三方吉祥物);须原创,以便安全公开上架 GitHub。\n像素图统一加 image-rendering: pixelated;(及 crisp-edges),放大保持锐利不模糊。\n组件与素材改名:PetPig → PetDog,文件名/引用/台词配置一并更新;删除旧小猪素材。\n表情/动作帧:idle(待机)/blink(眨眼)/happy/sad/busy/walk(走动帧)。\n二、行为:双模式自动切换\n宠物根据两侧留白宽度自动在两种模式间切换(窗口缩放时实时判断、平滑切换):\n\n① 漫游模式(留白足够宽,如留白 \u003e 80px,config 可调)\n在页面左右两侧留白竖带内自主游走:随机选目标点 → 平滑慢速移动(walk 帧)→ 到达后停顿/眨眼/发呆 → 再选下一点。\n移动时图片朝向移动方向(水平翻转)。\n仅在两侧留白活动,绝不进入中间工作区(不遮挡表格/配置/操作区)。\nposition: fixed(固定视口,不随内容滚动)。\n移动缓慢、平滑、多停顿,不满屏乱窜,避免干扰。\n② 角落模式(留白过窄 / 小屏 / 移动端)\n自动退回固定右下角待机(idle 浮动 + 随机眨眼)。\n三、状态联动(沿用 + 漫游约束)\n全屏\n复制\n平台状态\t表情/行为\n空闲\tidle,随机眨眼,漫游模式下正常游走\n跑批/试运行/Agent接入 进行中\tbusy,停止漫游、原地待命(避免移动分散注意力)\n出错/失败\tsad\n成功完成\thappy\n平台忙碌结束后恢复漫游。联动仅\"读\"状态,不影响业务数据。\n四、交互(沿用 v4.6)\n点击宠物 → 停下并冒气泡说一句随机台词(数秒消失);台词改为小狗设定的卖萌语气(分状态各若干句随机抽,config/petLines.ts)。\n移动中也可点击命中(点击即停)。\n可拖动到任意位置;可隐藏/唤出(隐藏后留小图标重新唤出)。\n显隐、位置、模式偏好持久化,刷新恢复。\n五、数据 / 存储(不变)\n不进 Project / 不改 SCHEMA;偏好单独存:\ntypescript\ninterface PetPrefs { visible: boolean; position?: { x: number; y: number }; }\n六、前端实现\n组件 \u003cPetDog /\u003e 挂全局布局,所有板块可见。\n状态机:idle/blink/happy/sad/busy/walk。\n活动区计算:留白宽 = (视口宽 - 内容区宽)/2;\u003e 阈值 → 漫游,否则角落。\n漫游用 requestAnimationFrame/CSS transition 平滑移动,目标点随机落在留白竖带;方向决定水平翻转;position: fixed。\n像素渲染:image-rendering: pixelated;walk 用逐帧(sprite + steps())或多帧切换。\n性能:移动节流;平台忙碌时停止移动只保留 busy 静态;大批量跑批不卡。\n不遮挡:z-index 低于关键弹框(费用确认/评价);不挡核心操作区。\n七、配置\nconfig/petLines.ts:小狗各状态台词库。\n像素小狗素材(原创,放 public/pet/ 或代码内绘制)。\n漫游留白阈值、移动速度、停顿时长等可入 config。\n八、验收\n出现原创像素风小狗,像素锐利不模糊;旧小猪素材已移除。\n大屏:在两侧留白漫游,缓慢平滑、有停顿、朝向正确、不进工作区。\n缩小窗口/小屏:自动退回右下角待机,不被挤压抖动;缩放切换平滑。\n跑批/接入进行中:停止漫游、原地 busy;完成恢复漫游。\n点击命中→停下说话;可拖动、可隐藏/唤出;刷新后状态保持。\n不遮挡工作区/关键弹框;不影响核心数据与流程;大批量跑批不卡顿。\n九、明确不做\n不用受版权保护形象(必须原创像素小狗)。\n宠物不进入中间工作区漫游(仅两侧留白);留白不足不强行漫游(退回角落)。\n宠物不参与/不影响数据、接入、跑批、评价;复杂养成系统不做。\n十、实施\n单独小批,纯前端低风险,可随时插入。\n顺序:原创像素小狗素材(含 walk/眨眼帧)→ \u003cPetDog /\u003e 基础形态 + 像素渲染 → 双模式(漫游/角落)自动切换 → 状态联动 → 交互(台词/拖动/隐藏)持久化。\nv4.7 完成。 这版把宠物换成原创像素风小狗并让它能在两侧留白自主漫游,守住两条保命线:形象原创(安全上 GitHub) + 留白不足退回角落、忙时安静(不翻车、不干扰)。", "summary": "PRD v4.7 修订 · 电子宠物(原创像素小狗 + 自主移动)"}, {"id": "doc-10", "title": "测评平台v4.8-大批量数据与评价稳定性PRD.md", "filename": "测评平台v4.8-大批量数据与评价稳定性PRD.md", "category": "PRD 主线", "size": 24617, "updated": "2026-06-17 20:14", "content": "PRD v4.8 修订 · 大批量数据生成、平台召唤导入与评价稳定性\n\n本次修订沉淀 2026-06-17 对话中的完整需求与事故复盘。目标是让评测平台真正支持微调模型评测中的大批量数据集场景，包括外部 skill 召唤导入、AI 造数据、当前数据下载、跑批历史查看、AI 评价与历史评价回看。核心原则：全量数据可以存、可以导出、可以继续跑；页面只分页展示，任务必须分批执行，可停止，已完成结果不能丢。\n\n〇、背景与问题\n\n用户正在学习微调模型，需要把“带标准答案的数据集”导入评测平台，并用平台完成批量跑批和 AI 裁判评价。\n\n当前平台原本更偏小数据量交互：表格直接全量渲染、AI 造数据一次性请求模型、跑批历史和 AI 评价结果全量展开。遇到 3000 条数据时，会出现以下问题：\n\n1. AI 一次性输出大量 JSON 容易被模型截断，报错“AI 返回内容无法解析为 JSON 数组”。\n2. 生成过程中如果等待全部 3000 条完成后再落表，中途失败或停止时，前面已经花费模型调用生成的数据可能无法保留在页面。\n3. 3000 行输入如果全部渲染为可编辑 input 表格，浏览器会明显卡顿甚至假死。\n4. 跑批历史结果按“输入 × 目标”全量渲染，3000 条输入、3 个目标就是 9000 行。\n5. AI 评价如果默认评全部，会产生巨大裁判模型成本；评价结果和历史详情全量渲染也会卡。\n6. URL 不应承载完整数据，只应放 project_id / draft_id / import_id / tab / mode 等短参数。\n\n一、本版目标\n\n把平台升级成“大批量友好”的评测平台：\n\n- 3000 条级别数据可以生成、导入、下载、跑批、评价。\n- AI 造数据必须分批生成，每批成功后立刻写入表格。\n- 生成和评价都必须支持停止，停止后已完成数据保留。\n- 页面展示必须分页或虚拟化，不能把 3000 行 input / 9000 行结果一次性渲染出来。\n- 下载 Excel / 导出 Excel 始终导出全量数据，不受分页影响。\n- AI 评价必须有成本保护，禁止不提示用户就默认全量评价。\n- skill 召唤平台导入流程必须可诊断平台服务状态，不伪造返回链接。\n- AI 评测能力要能单独拆出去，通过 API / skill 给外部工具调用，而不是只能在 HTML 页面里手点。\n- skill 应成为“评测平台召唤器”：外部用户只要给数据需求和原始数据，skill 就能引导确认、生成导入包、调用平台 API、返回可打开的平台链接。\n\n二、已完成能力沉淀\n\n2.1 平台召唤导入 skill\n\n已创建并安装 eval-platform-importer skill，用于把外部原始数据、批量跑批需求、标准答案评测需求导入本地评测平台。\n\nskill 流程：\n\n1. 识别原始数据格式。\n2. 给用户看字段映射预览。\n3. 询问用户确认输入字段、标准答案字段、评价模式。\n4. 如果有缺失，提示跳过、补空、停止。\n5. 生成导入包。\n6. 用户确认后调用平台 API。\n7. 返回真实 open_url，打开后已加载数据和评价设置。\n\nskill 不应该做：\n\n- 不随便把任意文本硬解析成平台数据。\n- 不在没确认标准答案字段时自动导入。\n- 不默认启动评价，因为评价会消耗裁判模型调用。\n- 不把完整大数据塞进 URL。\n- 不伪造 open_url。\n\n2.2 平台导入 API 与 deep link\n\n已新增平台导入接口：\n\n- POST /api/import-evaluation-workspace\n- 返回 import_id / open_url。\n- 前端通过 import_id 从服务端导入包恢复数据。\n- URL 只放短参数，如 tab、import_id、mode、content_mode。\n\n导入服务诊断规则：\n\n- 优先检查 127.0.0.1:3000。\n- 再检查 localhost:3000 / 127.0.0.1:3001 / localhost:3001。\n- Python 调用禁用代理，避免被 HTTP_PROXY 干扰本地请求。\n- 首页 500 视为平台服务坏掉，不应继续调用导入接口。\n- fake import_id 返回 404 可视为导入接口存在且服务健康。\n\n2.2.1 skill 召唤平台的产品定位\n\nskill 不是简单脚本，也不是盲目导入器，而是一个“半自动的数据导入 agent”。它负责把外部自然语言需求、Excel/CSV/JSONL/JSON、标准答案字段、评价模式和平台 deep link 串起来。\n\n典型使用方式：\n\n用户在 Claude Code / Codex / 其它 agent 环境中说：“召唤测评平台，用这份 Excel 做标准答案评测。” skill 读取原始数据后，不直接导入，而是先让用户确认字段映射、缺失策略和评价模式。确认后再调用平台 API，返回真实 open_url。\n\nskill 必须支持的导入类型：\n\n- dataset_only：只导入输入数据，用于批量跑模型或算法。\n- dataset_with_expected：导入输入数据 + 标准答案，用于 reference 评价。\n- generated_dataset：根据用户数据需求生成或整理后的评测数据。\n- run_plan：导入数据并预设跑批目标，但不自动开始跑批。\n- evaluation_plan：导入数据并预设 AI 评价模式、标准答案字段、评价维度，但不自动开始评价。\n\nskill 与平台的职责边界：\n\n- skill 负责识别、预览、追问、确认、诊断、调用 API、返回链接。\n- 平台负责持久化、展示、跑批、评价、下载、历史管理。\n- skill 不直接写浏览器 IndexedDB。\n- skill 不绕过平台 API。\n- skill 不默认启动会消耗模型额度的跑批或评价。\n\n2.2.2 skill 的确认流程\n\n标准流程必须保持：\n\n1. 识别原始数据格式。\n2. 展示字段映射预览。\n3. 询问用户确认三个关键项：输入字段、标准答案字段、评价模式。\n4. 检查缺失值，提示用户选择跳过、补空、停止。\n5. 生成导入包 import_package.json。\n6. 展示导入包摘要给用户最终确认。\n7. 调用平台 API。\n8. 返回真实 open_url。\n\n字段映射预览至少包含：\n\n- 识别到的输入字段，如 prompt / question / instruction / query。\n- 识别到的图片字段，如 image_url / image / reference_image。\n- 识别到的标准答案字段，如 expected_output / gold_answer / reference_answer / label。\n- 未匹配字段列表。\n- 缺失字段统计。\n- 将写入 extraFields 的字段列表。\n\n2.2.3 skill 的服务诊断能力\n\nskill 必须内置平台服务诊断，不要把“端口 500、进程坏了、localhost 代理异常”留给用户猜。\n\n诊断内容：\n\n- 检查候选 base_url：127.0.0.1:3000、localhost:3000、127.0.0.1:3001、localhost:3001。\n- 检查首页 HTTP 状态。\n- 检查导入 API 是否存在。\n- 检查 fake import_id 是否返回合理 404。\n- 禁用代理环境变量对本地请求的影响。\n- 对 500、连接拒绝、超时、代理错误分别给中文诊断。\n- 如果平台服务坏掉，不伪造 open_url。\n\n2.2.4 skill 返回链接规则\n\nopen_url 必须是真实平台返回，不允许拼一个看起来像成功的假链接。\n\nURL 规则：\n\n- 只放短参数。\n- 允许参数：tab、import_id、draft_id、project_id、mode、content_mode。\n- 不允许把完整 dataset、完整标准答案、完整评价维度塞进 URL。\n\n示例：\n\nhttp://localhost:3000/?tab=run\u0026import_id=xxx\u0026mode=reference\u0026content_mode=text\n\n2.2.5 skill 文档与 API 文档\n\nskill 目录内必须包含中文说明：\n\n- SKILL.md：面向 agent 的使用规则。\n- API.md：平台导入 API 文档。\n- examples/：示例导入包。\n- scripts/call_platform_import.py：调用平台 API 并诊断服务。\n\nAPI 文档需要说明：\n\n- 请求地址。\n- 请求体字段。\n- import_type 枚举。\n- dataset item 格式。\n- evaluation.mode 枚举。\n- missing_policy 枚举。\n- 成功响应。\n- 错误响应。\n- open_url 规则。\n- curl 示例。\n\n2.3 输入区下载当前数据\n\n已在 AI 造数据面板底部右侧增加“下载当前数据”按钮。\n\n规则：\n\n- 下载的是当前批量输入区完整数据。\n- 数据来源可以是 AI 生成、手动新增、Excel/JSONL 导入或 skill 导入。\n- 空数据时按钮置灰。\n- 文件名使用“当前数据/输入数据”，避免把用户导入数据误命名为 AI 数据。\n- Excel 导出包含 prompt、image_url 和 extraFields 中出现过的字段。\n\n2.4 AI 造数据大批量生成\n\n已做的方向：\n\n- 支持条数上限 3000。\n- 3000 条不再一次性要求模型吐完整 JSON。\n- 大批量按每批 30 条生成。\n- 每批最多重试 3 次。\n- AI 造数据专用 max_tokens 提高到 4096，不影响普通评测调用默认 token。\n- 页面提示“大批量会自动拆成每批 30 条生成，避免模型输出过长导致 JSON 截断”。\n- 生成中显示进度，如第 N / M 批、已写入 X / total 条。\n- 每批成功后立刻写入表格，避免中途失败时已生成数据丢失。\n- 增加“停止生成”按钮，停止后已写入数据保留在下方表格，可直接下载。\n\n2.5 输入表格分页\n\n已做的方向：\n\n- 输入表格超过 50 条后分页展示。\n- 页面只渲染当前 50 条，避免 3000 行 input 卡死。\n- 显示“当前只渲染第 A - B 条，共 N 条；下载 Excel 会包含全部数据”。\n- 支持上一页 / 下一页。\n- 表格行号保持全局序号，不是当前页局部序号。\n- 下载 Excel 仍导出全部 inputs。\n\n三、待设计：AI 评测能力外置化\n\n3.1 背景\n\n用户希望把“AI 评价”这一步单独拆出去，形成外部 API 能力。也就是说，AI 评测不应该只能在 HTML 页面中手动触发；外部 agent / skill / 脚本应该可以调用平台能力完成评价计划创建、字段确认、评价执行和结果回传。\n\n注意：AI 评价是高成本操作，外部化不等于自动启动。所有可能消耗裁判模型的动作，都必须有明确确认或显式 API 参数。\n\n3.2 能力拆分\n\nAI 评测能力应拆成几个小能力点：\n\n1. 创建评价草稿。\n2. 预览可评价数据。\n3. 确认评价字段与评价模式。\n4. 生成或确认评价维度。\n5. 估算评价范围与成本。\n6. 启动评价任务。\n7. 查询评价进度。\n8. 停止评价任务。\n9. 获取评价结果。\n10. 导出评价结果。\n\n3.3 API 设计建议\n\n建议新增以下 API：\n\nPOST /api/evaluation-drafts\n\n用途：创建 AI 评价草稿，不启动评价。\n\n输入：\n\n- import_id 或 task_id。\n- evaluation_mode：comparison / reference。\n- expected_answer_column。\n- dimensions。\n- eval_prompt。\n- scope。\n- selected_input_ids。\n- missing_policy。\n\n输出：\n\n- draft_id。\n- preview。\n- warnings。\n- open_url。\n\nPOST /api/evaluation-drafts/{draft_id}/confirm\n\n用途：确认字段、维度、范围和缺失策略。\n\n输出：\n\n- confirmed_draft_id。\n- estimated_calls。\n- estimated_items。\n- required_confirmation：是否需要二次确认。\n\nPOST /api/evaluations/start\n\n用途：显式启动 AI 评价任务。\n\n要求：\n\n- 必须传 confirmed_draft_id。\n- 如果 estimated_items 超过阈值，必须带 user_confirmed_cost=true。\n- 不允许直接传原始大数据绕过草稿确认。\n\n输出：\n\n- evaluation_job_id。\n- status。\n- progress_url。\n\nGET /api/evaluations/{job_id}\n\n用途：查询评价进度。\n\n输出：\n\n- status：running / stopped / done / error / partial。\n- total。\n- completed。\n- failed。\n- current_batch。\n- result_record_id。\n\nPOST /api/evaluations/{job_id}/stop\n\n用途：停止评价。\n\n输出：\n\n- status：partial / stopped。\n- completed。\n- result_record_id。\n\nGET /api/evaluations/{record_id}/export\n\n用途：导出评价结果。\n\n输出：\n\n- Excel 文件或下载地址。\n\n3.4 外部 API 的安全规则\n\n- 任何 API 默认只创建草稿，不启动评价。\n- 启动评价必须是显式 start API。\n- reference 模式下，没有标准答案字段确认不能 start。\n- 超过阈值必须 user_confirmed_cost=true。\n- 缺失标准答案必须按 missing_policy 处理。\n- 外部 API 不接受 URL 携带完整大数据。\n- API 响应必须包含 warnings，不能静默吞掉字段问题。\n\n3.5 HTML 页面体现\n\n外部 API 能力需要在 HTML 页面中体现，而不是藏在首页一栏。\n\n对应位置：\n\n- 输入数据区：保留“导入 Excel/JSONL”，增加“通过 API 导入”说明入口。\n- 测试模型 / 算法选择区：展示“外部可通过 target_id / API 配置引用本测试对象”。\n- AI 评价区：增加“创建评价草稿 API / 外部启动评价 API”的入口说明。\n- AI 评价历史区：增加“评价结果 API / 导出 API”的入口说明。\n\n这些入口不应全部堆在首页功能栏，而是放在各自功能点旁边。\n\n3.6 验收\n\n- 外部调用可以创建评价草稿，但不会默认启动评价。\n- 用户能在平台页面看到外部 API 创建的评价草稿。\n- 草稿打开后字段、维度、范围已预填。\n- 用户确认后才能启动评价。\n- 外部可查询任务进度与停止任务。\n- 部分完成结果可以保存并导出。\n\n四、待设计：平台 API 能力地图\n\n4.1 输入与导入 API\n\n能力：\n\n- 数据导入。\n- 字段映射。\n- 标准答案字段确认。\n- 缺失策略确认。\n- deep link 打开平台。\n\n相关接口：\n\n- POST /api/import-evaluation-workspace\n- GET /api/import-evaluation-workspace/{import_id}\n\n4.2 测试目标 API\n\n能力：\n\n- 查询可用测试模型 / 算法。\n- 通过 target_id 引用测试对象。\n- 外部脚本或 skill 预设目标。\n\n建议接口：\n\n- GET /api/targets\n- GET /api/targets/{target_id}\n\n4.3 跑批 API\n\n能力：\n\n- 创建跑批草稿。\n- 估算请求数。\n- 启动跑批。\n- 查询进度。\n- 停止跑批。\n- 查看结果。\n\n建议接口：\n\n- POST /api/run-drafts\n- POST /api/runs/start\n- GET /api/runs/{job_id}\n- POST /api/runs/{job_id}/stop\n- GET /api/tasks/{task_id}/results\n\n4.4 AI 评价 API\n\n能力：\n\n- 创建评价草稿。\n- 确认评价配置。\n- 启动评价。\n- 查询进度。\n- 停止评价。\n- 导出结果。\n\n对应第三章。\n\n4.5 下载与导出 API\n\n能力：\n\n- 下载当前输入数据。\n- 导出跑批结果。\n- 导出 AI 评价结果。\n- 导出当前筛选结果。\n\n建议接口：\n\n- GET /api/projects/{project_id}/inputs/export\n- GET /api/tasks/{task_id}/results/export\n- GET /api/evaluations/{record_id}/export\n\n五、待优化：跑批历史\n\n5.1 当前风险\n\n跑批历史列表本身问题不大，真正风险在点击“查看结果”后的详情表。\n\n当前结果表按 ResultRow 全量渲染，每个“输入 × 目标”组合都变成一行。3000 条输入、3 个测试目标会渲染约 9000 行，并且包含文本截断、图片缩略图、状态标签、展开按钮等组件，页面容易卡顿。\n\n5.2 目标设计\n\n跑批历史应改成“摘要列表 + 分页详情 + 全量导出”。\n\n历史列表展示：\n\n- 创建时间。\n- 单条 / 批量。\n- 输入数。\n- 目标数。\n- 成功数 / 失败数 / 中断数。\n- 总耗时或平均耗时。\n- 状态。\n- 查看结果。\n- 去 AI 评测。\n- 导出 Excel。\n- 删除。\n\n结果详情展示：\n\n- 默认不自动展开大批次结果。\n- 点击查看后，按输入维度分页，每页 50 条输入。\n- 每页内部展示该输入对应的所有目标结果。\n- 行号保持全局输入序号。\n- 支持上一页 / 下一页 / 跳页。\n- 支持只看失败、只看成功、只看中断。\n- 支持按目标模型筛选。\n- 支持 prompt 关键词搜索。\n- 支持仅显示摘要，点击某条再展开出参详情。\n\n5.3 导出规则\n\n- 页面分页只影响展示。\n- 导出 Excel 必须导出当前任务全部结果。\n- 如果用户当前设置了筛选条件，导出时可提供两个按钮：“导出全部”和“导出当前筛选”。\n\n5.4 验收\n\n- 3000 条输入、3 个目标的历史任务，打开历史列表不卡。\n- 点击查看结果后只渲染当前页，不出现明显卡顿。\n- 翻页、筛选、搜索响应可接受。\n- 导出 Excel 包含全部 9000 条“输入 × 目标”结果。\n- 大批次默认不自动展开详情。\n\n六、待优化：AI 评价运行\n\n6.1 当前风险\n\nAI 评价不只是渲染问题，更是成本问题。3000 条输入如果默认全量评价，并且每条还要对多个模型输出打分，会产生大量裁判模型调用。\n\n6.2 评价范围保护\n\nAI 评价必须明确评价范围，不能默认偷偷评全部。\n\n推荐范围选项：\n\n- 当前页 50 条。\n- 抽样 100 条。\n- 失败项。\n- 手动选择。\n- 全部。\n\n当用户选择“全部”且数量超过阈值时，必须弹成本确认：\n\n- 本次将评价 N 条输入。\n- 每条会对 M 个目标输出评分。\n- 预计会触发约 N 次或 N×M 次裁判模型调用，按现有实现口径展示。\n- 评价会消耗裁判模型额度。\n- 用户确认后才开始。\n\n阈值建议：\n\n- 超过 100 条评价必须确认。\n- 超过 500 条评价显示强提醒。\n- 超过 1000 条评价建议用户先抽样。\n\n6.3 分批评价\n\nAI 评价运行必须分批：\n\n- 每批 10 或 20 条输入。\n- 每批完成后立刻写入 evalResults。\n- 支持“停止评价”。\n- 停止后已评价结果保留，可保存为一条未完成或部分完成 EvaluationRecord。\n- 错误批次要可重试，不能导致已完成评价丢失。\n\n6.4 评价状态\n\n评价状态应显示：\n\n- 当前批次。\n- 已评价条数 / 总条数。\n- 已成功 / 已失败。\n- 预计剩余。\n- 当前裁判模型。\n- 当前评价模式：横向对比 / 标准答案。\n- 标准答案字段覆盖率。\n\n6.5 标准答案模式保护\n\n标准答案模式下必须保证：\n\n- 没确认标准答案字段时不能开始评价。\n- 显示标准答案字段覆盖率，如 2800 / 3000。\n- 对缺失标准答案的数据，提供跳过、补空、停止三种策略。\n- 默认不评价缺失标准答案的行。\n\n6.6 验收\n\n- 3000 条输入进入 AI 评价，不会默认全评。\n- 选择全评时有明确成本确认。\n- 评价过程中可停止。\n- 停止后已评价结果保留，可查看、导出。\n- 评价失败时已完成批次不丢。\n- 标准答案字段未确认时不能开始 reference 评价。\n\n七、待优化：AI 评价结果与历史\n\n7.1 当前风险\n\nEvaluationResults 当前按每条输入渲染一张表。EvalHistoryPanel 查看历史详情时，也会按评价结果全量展开。3000 条评价结果会生成大量表格、单元格和 hover 信息，容易卡。\n\n7.2 目标设计\n\nAI 评价结果展示应改成“摘要 + 分页明细”。\n\n评价结果页：\n\n- 顶部展示汇总：评价条数、目标数、维度数、平均分、低分数量、失败数量。\n- 默认只显示当前页 50 条输入。\n- 每条输入可折叠 / 展开目标评分详情。\n- 支持按维度排序。\n- 支持只看低分项，如任一维度 \u003c 6。\n- 支持按目标模型筛选。\n- 支持按 prompt / 标准答案 / 输出关键词搜索。\n\n历史评价列表：\n\n- 保持列表倒序。\n- 每条记录显示评价条数、来源批次、裁判模型、模式、标准答案字段、状态、是否部分完成。\n- 查看详情时分页展示。\n- 导出 Excel 导出全部评价结果。\n\n7.3 部分完成记录\n\nEvaluationRecord 建议支持部分完成状态：\n\ntypescript\ninterface EvaluationRecord {\n  status: \"done\" | \"partial\" | \"error\";\n  count: number;\n  completedCount?: number;\n  failedCount?: number;\n  stoppedAt?: number;\n}\n\n用于记录用户中途停止或部分失败的评价任务。\n\n7.4 验收\n\n- 3000 条评价历史可打开不卡。\n- 历史评价详情默认只渲染当前页。\n- 可筛选低分项、失败项、指定模型。\n- 导出 Excel 仍包含全部评价结果。\n- 部分完成评价有明确状态，不误显示为 done。\n\n八、待优化：任务执行与结果存储\n\n8.1 跑批执行保护\n\n跑批本身也要支持大批量：\n\n- 运行前显示输入数、目标数、预计请求数。\n- 超过阈值时二次确认。\n- 运行过程中显示已完成 / 总请求。\n- 支持停止跑批。\n- 停止后已完成结果保留为 interrupted / partial task。\n\n8.2 存储策略\n\n当前项目使用 IndexedDB 存 Project。大批量数据会让 Project 对象变大。短期可以继续存，但需要遵守：\n\n- 不把完整数据放 URL。\n- 不在 React 页面一次性渲染全部数据。\n- 导入包用 import_id 交接。\n- 大批量结果导出时按需生成 Excel。\n\n中期建议：\n\n- inputs、tasks、evaluations 分表存储。\n- Project 只存元信息和 id 列表。\n- 大批量结果按 taskId 查询分页加载。\n\n九、统一交互原则\n\n全平台对大批量数据统一遵守：\n\n- 存全量。\n- 看分页。\n- 跑分批。\n- 可停止。\n- 已完成不丢。\n- 导出全量。\n- 高成本操作先确认。\n- 失败可定位到具体批次。\n\n十、明确不做\n\n- 不把 3000 条完整数据塞进 URL。\n- 不默认启动 AI 评价。\n- 不在没确认标准答案字段时自动做 reference 评价。\n- 不把所有大批量行一次性渲染为 input / table。\n- 不为了表面“生成完成”而吞掉中途失败。\n- 不伪造导入 open_url。\n- 不让用户误以为分页只导出当前页；导出必须明确全量或当前筛选。\n- 不把 AI 评价 API 做成“传数据就直接开评”的危险接口。\n- 不让 skill 绕过用户确认直接启动跑批或评价。\n- 不把外部 API 能力全部堆在首页，必须在对应功能点旁体现。\n\n十一、实施计划\n\n第一阶段：输入区稳定性，已基本完成\n\n- 下载当前数据。\n- 3000 条上限。\n- AI 造数据分批。\n- 每批落表。\n- 停止生成。\n- 输入表分页。\n- 造数据专用 max_tokens。\n\n第二阶段：跑批历史分页\n\n- ResultFlatTable 按输入分页。\n- 历史任务摘要增强。\n- 结果筛选：成功 / 失败 / 中断 / 模型。\n- 导出全部与导出当前筛选。\n\n第三阶段：skill 与导入 API 完整化\n\n- 完善 skill 中文文档。\n- 完善 API.md。\n- 补充 examples。\n- 强化服务诊断。\n- 在 HTML 输入区展示“通过 API 导入 / skill 召唤平台”的入口说明。\n\n第四阶段：AI 评测能力外置化\n\n- 新增 evaluation draft API。\n- 新增评价草稿确认 API。\n- 新增评价启动 API。\n- 新增评价进度 API。\n- 新增停止评价 API。\n- 新增评价导出 API。\n- 在 AI 评价区体现外部 API 能力。\n\n第五阶段：AI 评价运行保护\n\n- 评价范围选择：当前页 / 抽样 / 失败项 / 手动 / 全部。\n- 全量评价成本确认。\n- 分批评价。\n- 停止评价。\n- 部分完成状态。\n- 标准答案字段确认与缺失策略。\n\n第六阶段：AI 评价结果历史分页\n\n- EvaluationResults 分页。\n- EvalHistoryPanel 详情分页。\n- 低分项筛选。\n- 模型筛选。\n- 部分完成评价展示。\n- 全量导出。\n\n第七阶段：存储结构升级\n\n- 评估 IndexedDB 大对象性能。\n- inputs / tasks / evaluations 分表。\n- Project 元信息瘦身。\n- 大批量按需分页读取。\n\n十二、验收总表\n\n输入区：\n\n- 生成 3000 条时按批生成，有进度，可停止。\n- 停止后已写入数据保留。\n- 表格只渲染当前页。\n- 下载当前数据导出全量。\n\n跑批历史：\n\n- 3000 条 × 3 目标结果可打开不卡。\n- 默认分页查看。\n- 可筛选、搜索、导出。\n\nAI 评价：\n\n- 不默认全量评价。\n- 全量评价有成本确认。\n- 可分批评价，可停止。\n- 停止后部分结果保留。\n- 标准答案字段未确认不能开始 reference 评价。\n\nAI 评价历史：\n\n- 3000 条评价结果可分页查看。\n- 可筛选低分、失败、目标模型。\n- 可导出全部。\n- partial / error / done 状态准确。\n\n外部 API / skill：\n\n- skill 可以识别原始数据并展示字段映射预览。\n- skill 必须询问输入字段、标准答案字段、评价模式。\n- skill 能生成导入包并调用平台导入 API。\n- skill 返回真实 open_url。\n- 外部 API 能创建评价草稿但不会默认启动评价。\n- 平台页面能打开外部 API 创建的草稿。\n- 用户确认后才能启动评价。\n\n十三、事故复盘记录\n\n本次 3000 条生成测试中，用户触发生成后，平台日志显示已完成 7 次 /api/gen-data 请求。按每批 30 条估算，约 210 条结果已经产生模型调用成本。由于当时版本仍存在“未及时落表 / 页面只显示旧数据”的风险，前面结果可能无法从前端恢复。\n\n该事故直接导出三条硬规则：\n\n1. 大批量任务每批完成后必须立刻持久化或至少落入页面 state。\n2. 必须有停止按钮。\n3. 大批量页面必须分页渲染，不能全量渲染。\n\nv4.8 后续开发必须优先守住这三条。\n", "summary": "PRD v4.8 修订 · 大批量数据生成、平台召唤导入与评价稳定性"}, {"id": "doc-11", "title": "测评平台v4.9-后续优化路线图PRD.md", "filename": "测评平台v4.9-后续优化路线图PRD.md", "category": "PRD 主线", "size": 18077, "updated": "2026-07-14 20:26", "content": "# 测评平台 PRD v4.9：后续优化路线图\n\n\u003e 文档日期：2026-07-14  \n\u003e 适用项目：本地大模型评测平台  \n\u003e 核心目标：把平台从“能跑小规模评测的页面工具”，升级为“可被外部 skill / agent 召唤、可承载大批量数据、可安全执行 AI 评价的评测工作台”。\n\n## 1. 背景\n\n当前平台已经具备基础评测能力，包括输入数据维护、AI 造数据、批量运行、跑批历史、AI 评价、导入 API、skill 召唤导入等方向。但随着使用场景从少量样本扩展到微调模型评测、标准答案评测、3000 条级别数据生成与跑批，现有交互和状态管理还需要继续收敛。\n\n后续优化的重点不是单独加按钮，而是把每个关键流程整理成稳定的状态机：\n\n- AI 造数据要能显示清楚进度，支持暂停、保留、清空、续跑、下载。\n- 输入数据表要能承载大批量数据，不因为 3000 行 input 卡死。\n- AI 评价要拆成可外部调用的 API 能力，但不能默认消耗裁判模型额度。\n- skill 要作为“测评平台召唤器”，负责识别数据、确认字段、生成导入包、调用平台、返回真实链接。\n- 跑批历史和 AI 评价历史要能分页、筛选、导出，不能一打开历史就全量渲染。\n\n## 2. 产品定位\n\n平台定位为“评测工作台”，服务三类入口：\n\n- 页面入口：用户直接在 HTML 页面里导入数据、造数据、跑批、评价。\n- API 入口：外部脚本、agent、skill 可以创建导入草稿、评价草稿、跑批计划。\n- skill 入口：用户用自然语言和原始文件召唤平台，由 skill 完成字段确认和导入。\n\n平台不应变成“传一段任意文本就自动硬解析、自动跑批、自动评价”的黑盒。所有高成本或不可逆动作都必须明确确认。\n\n## 3. 非目标\n\n- 不默认启动 AI 评价，因为评价会消耗裁判模型调用。\n- 不在未确认标准答案字段时自动做 reference 评价。\n- 不把完整大数据塞进 URL，URL 只允许放短 ID 和页面状态。\n- 不把所有外部 API 能力堆到首页，应在对应功能模块旁边体现。\n- 不为了展示方便一次性渲染 3000 行输入或上万行结果。\n- 不伪造 open_url。平台异常时必须返回真实错误和诊断。\n\n## 4. 当前能力基线\n\n### 4.1 已有能力\n\n- 支持输入数据的手动新增、Excel / JSONL 导入。\n- 支持 AI 造数据，并已开始支持分批生成。\n- 支持下载当前数据。\n- 支持暂停大批量生成，并选择保留或丢弃已生成数据。\n- 支持当前输入表格分页展示。\n- 已有平台导入 API：`POST /api/import-evaluation-workspace`。\n- 已有 `eval-platform-importer` skill，用于识别数据、生成导入包、调用平台 API。\n\n### 4.2 当前体验问题\n\n- AI 造数据过程中，进度信息容易被临时文案覆盖，用户看不到“总共多少条 / 当前已生成多少条 / 当前第几批”。\n- 选择保留已生成数据后，用户需要明确的一键清空入口，且清空要同步取消续跑草稿。\n- 继续生成剩余数据时，已保留数据必须继续留在下方表格，不能只记录数量。\n- 输入表格需要更明确区分“完整数据集”和“当前页可见数据”。\n- 跑批历史和 AI 评价历史仍存在大数据量渲染风险。\n- AI 评价外部 API 能力需要产品化，不只是内部函数。\n- skill 调用平台失败时，需要把诊断和恢复建议做得更自动。\n\n## 5. P0：AI 造数据流程重构\n\n### 5.1 目标\n\nAI 造数据要成为一个稳定、可中断、可续跑、可下载、可清空的大批量生成流程。\n\n### 5.2 核心交互\n\nAI 造数据区域固定展示一个“生成状态卡片”，不依赖零散提示文案。\n\n状态卡片展示：\n\n- 目标条数：例如 `3000`\n- 已生成条数：例如 `210`\n- 剩余条数：例如 `2790`\n- 当前批次：例如 `第 7 / 100 批`\n- 每批大小：例如 `30 条 / 批`\n- 当前状态：空闲、生成中、暂停中、已暂停、已完成、失败\n- 最近一次错误：如果有，显示失败批次和错误原因\n\n### 5.3 暂停与保留\n\n当生成数量大于 100 条时，用户点击“暂停生成”后必须询问：\n\n- 保留已生成数据：停止后保留表格中已有数据，下次只生成剩余数据。\n- 丢弃本次生成：停止后恢复到生成前的数据。\n\n保留逻辑必须保存真实数据 payload，而不是只保存已生成条数。\n\n### 5.4 续跑逻辑\n\n续跑时必须满足：\n\n- 原本保留的 150 条仍然留在表格下方。\n- 点击“继续生成剩余 X 条”后，只请求剩余数据。\n- 新生成数据 append 到保留数据之后。\n- 表格页码默认跳到最新页，但用户可以回到第一页。\n- 如果用户修改了需求、字段、内容模式或目标条数，续跑草稿失效，改为重新生成。\n\n### 5.5 清空逻辑\n\nAI 造数据区域需要提供“清空当前数据”入口。\n\n清空规则：\n\n- 清空前必须确认。\n- 清空当前表格数据。\n- 清空续跑草稿。\n- 清空生成进度状态。\n- 如果正在生成中，清空按钮禁用或提示先暂停。\n- 清空后不能再通过“继续生成”把旧数据种回来。\n\n### 5.6 下载逻辑\n\n下载当前数据按钮继续保留。\n\n下载规则：\n\n- 下载完整当前数据，不只下载当前分页。\n- 数据来源不限于 AI 生成，也包括手动输入、Excel / JSONL 导入、skill 导入。\n- 文件名应体现项目名和数据类型。\n- Excel 字段包含 `prompt`、`image_url` 和所有 `extraFields`。\n\n### 5.7 验收标准\n\n- 生成 3000 条时页面不卡死。\n- 每完成一批，表格和进度同时更新。\n- 暂停后选择保留，表格仍保留已生成数据。\n- 继续生成时不会覆盖已保留数据，只生成剩余数据。\n- 清空后表格为空，续跑按钮消失。\n- 下载 Excel 包含全部当前数据。\n\n## 6. P0：输入数据表重整\n\n### 6.1 目标\n\n让输入数据表成为“完整数据集的可视化窗口”，而不是全量 DOM 渲染区域。\n\n### 6.2 功能要求\n\n- 超过 50 条后分页展示。\n- 明确提示当前展示范围，例如 `当前展示第 151 - 200 条，共 3000 条`。\n- 支持首页、上一页、下一页、跳到最新。\n- 行号使用全局序号。\n- 删除单行后页码保持合理位置。\n- 下载、跑批、评价都基于完整数据集，而不是当前页。\n\n### 6.3 后续增强\n\n- 增加“清空当前数据”全局入口，可以放在输入区工具栏。\n- 增加“批量删除当前页”。\n- 增加“只看缺字段行”。\n- 增加“按 prompt 搜索”。\n- 增加“导出当前筛选结果”和“导出全部数据”的区分。\n\n### 6.4 验收标准\n\n- 3000 条输入只渲染当前页。\n- 翻页和编辑不卡顿。\n- 删除当前页最后一条时不会跳到空页。\n- 所有下游动作读取完整 inputs。\n\n## 7. P1：AI 评价能力外置化\n\n### 7.1 目标\n\n把 AI 评价从页面内按钮拆成可复用能力，让外部 skill / agent / 脚本可以创建评价草稿、预览字段、启动评价、查询进度、停止评价、导出结果。\n\n### 7.2 API 能力拆分\n\n建议新增：\n\n- `POST /api/evaluation-drafts`：创建评价草稿，不启动评价。\n- `GET /api/evaluation-drafts/:draft_id`：查看草稿和字段映射。\n- `POST /api/evaluation-drafts/:draft_id/confirm`：确认输入字段、标准答案字段、评价模式。\n- `POST /api/evaluations/start`：显式启动评价。\n- `GET /api/evaluations/:evaluation_id/progress`：查询评价进度。\n- `POST /api/evaluations/:evaluation_id/stop`：停止评价。\n- `GET /api/evaluations/:evaluation_id/results`：分页获取评价结果。\n- `GET /api/evaluations/:evaluation_id/export`：导出评价结果。\n\n### 7.3 安全规则\n\n- API 默认只创建草稿，不启动评价。\n- 启动评价必须显式调用 start API。\n- 超过 100 条评价必须确认。\n- 超过 500 条评价显示强提醒。\n- 超过 1000 条评价建议抽样。\n- reference 模式必须确认标准答案字段。\n- 缺失标准答案的行默认跳过，除非用户选择补空。\n\n### 7.4 页面体现\n\nAI 评价区域应显示外部能力入口，而不是放到首页：\n\n- “通过 API 创建评价草稿”\n- “外部启动评价需要二次确认”\n- “查看评价 API 文档”\n- “复制当前评价配置 JSON”\n\n### 7.5 验收标准\n\n- 外部 API 能创建评价草稿。\n- 页面能打开外部创建的评价草稿。\n- 用户确认后才能启动评价。\n- 评价过程中可查询进度、停止、导出。\n- 未确认标准答案字段时不能启动 reference 评价。\n\n## 8. P1：skill 召唤平台增强\n\n### 8.1 目标\n\n让 `eval-platform-importer` skill 成为稳定的“测评平台召唤器”。\n\n### 8.2 标准流程\n\nskill 必须执行以下流程：\n\n1. 识别原始数据格式。\n2. 展示字段映射预览。\n3. 询问用户确认输入字段、标准答案字段、评价模式。\n4. 检查缺失值。\n5. 让用户选择缺失策略：跳过、补空、停止。\n6. 生成导入包。\n7. 展示导入包摘要，等待最终确认。\n8. 调用平台 API。\n9. 返回真实 open_url。\n\n### 8.3 服务诊断\n\nskill 需要内置诊断：\n\n- 检查 `127.0.0.1:3000`\n- 检查 `localhost:3000`\n- 检查首页状态码\n- 检查导入 API 是否存在\n- 区分连接失败、500、404、超时、代理问题\n- 禁用本地请求代理干扰\n- 不伪造链接\n\n### 8.4 导入包规范\n\n导入包必须包含：\n\n- `project_name`\n- `import_type`\n- `dataset`\n- `evaluation`\n- `missing_policy`\n- `target_hint`\n- `created_by`\n- `warnings`\n\n### 8.5 验收标准\n\n- Excel / CSV / JSONL / JSON 都能进入字段预览。\n- 没确认标准答案字段时不会自动导入 reference 评测。\n- 缺失字段有明确策略。\n- 平台异常时 skill 给出中文诊断和重试建议。\n- 成功时返回平台真实 open_url。\n\n## 9. P1：跑批历史优化\n\n### 9.1 目标\n\n跑批历史要支持大批量结果查看，不能打开一次历史就渲染几千到上万行。\n\n### 9.2 功能要求\n\n- 历史列表只显示摘要。\n- 点击详情后分页展示结果。\n- 默认每页 50 条。\n- 支持按目标、状态、关键词筛选。\n- 支持只看失败项。\n- 支持失败项重跑。\n- 支持导出完整跑批结果。\n\n### 9.3 历史摘要字段\n\n每条历史至少展示：\n\n- 批次名称\n- 输入条数\n- 测试目标数量\n- 总运行条数\n- 成功数量\n- 失败数量\n- 开始时间\n- 耗时\n- 状态：完成、部分完成、失败、已停止\n\n### 9.4 验收标准\n\n- 3000 条输入、3 个目标时，历史详情不会卡死。\n- 失败项可以筛选。\n- 导出包含完整结果，不受分页影响。\n- 部分完成的跑批不误显示为完成。\n\n## 10. P1：AI 评价运行与历史优化\n\n### 10.1 目标\n\nAI 评价要同时解决成本保护、分批执行、结果分页和历史回看。\n\n### 10.2 运行保护\n\n启动评价前必须展示：\n\n- 本次评价条数。\n- 本次评价目标数量。\n- 本次评价维度。\n- 裁判模型。\n- 是否使用标准答案。\n- 预计调用规模提示。\n\n### 10.3 分批评价\n\n评价运行必须分批：\n\n- 默认每批 10 到 30 条。\n- 每批完成后保存结果。\n- 支持停止评价。\n- 停止后已完成结果保留。\n- 失败批次可重试。\n- 评价状态必须展示已评价条数 / 总条数。\n\n### 10.4 历史详情\n\n评价历史详情应改为：\n\n- 顶部摘要。\n- 分页明细。\n- 低分项筛选。\n- 失败项筛选。\n- 按维度排序。\n- 导出完整 Excel。\n\n### 10.5 验收标准\n\n- 3000 条评价不会默认全量启动。\n- 用户确认成本后才能启动。\n- 评价可停止。\n- 停止后结果可查看、导出。\n- 历史详情分页打开不卡。\n\n## 11. P2：平台 API 能力地图\n\n### 11.1 目标\n\n把平台能力拆成可被外部引用的小 API，而不是只有页面按钮。\n\n### 11.2 能力清单\n\n输入与导入：\n\n- 导入数据集。\n- 创建输入草稿。\n- 获取字段映射预览。\n- 导出当前输入数据。\n\n测试目标：\n\n- 查询测试模型 / 算法列表。\n- 通过 `target_id` 引用测试目标。\n- 创建临时测试目标。\n\n跑批：\n\n- 创建跑批计划。\n- 启动跑批。\n- 查询跑批进度。\n- 停止跑批。\n- 获取跑批结果。\n- 导出跑批结果。\n\nAI 评价：\n\n- 创建评价草稿。\n- 确认评价字段。\n- 启动评价。\n- 查询评价进度。\n- 停止评价。\n- 获取评价结果。\n- 导出评价结果。\n\n### 11.3 页面展示原则\n\n外部 API 能力必须在对应模块旁展示：\n\n- 输入区展示导入 API / skill 召唤入口。\n- 测试模型区展示 target_id 引用方式。\n- 跑批区展示跑批计划 API。\n- AI 评价区展示评价草稿 API。\n- 历史区展示结果查询和导出 API。\n\n## 12. P2：持久化与草稿管理\n\n### 12.1 目标\n\n避免刷新页面、浏览器崩溃、服务重启后丢失重要草稿。\n\n### 12.2 功能要求\n\n- 输入数据草稿持久化。\n- AI 造数据续跑草稿持久化。\n- 外部导入草稿持久化。\n- 评价草稿持久化。\n- 跑批计划持久化。\n- 提供草稿列表和一键清理。\n\n### 12.3 验收标准\n\n- 刷新页面后可恢复最近一次输入草稿。\n- 外部 skill 导入后的草稿可再次打开。\n- 用户能手动删除不需要的草稿。\n\n## 13. P2：可观测性与错误诊断\n\n### 13.1 目标\n\n让用户知道平台为什么失败，以及下一步该怎么做。\n\n### 13.2 功能要求\n\n- API 错误返回结构化 `code`、`message`、`suggestion`。\n- 前端展示用户能理解的中文错误。\n- AI JSON 解析失败时展示原始片段和建议。\n- 平台服务 500 时给出重启建议。\n- skill 调用失败时输出诊断报告。\n- 大批量任务记录失败批次和重试次数。\n\n### 13.3 验收标准\n\n- 用户不会只看到“失败”两个字。\n- 错误信息能指向可执行动作。\n- 技术细节可折叠展示，不污染主流程。\n\n## 14. 里程碑建议\n\n### M1：AI 造数据体验闭环\n\n- 固定生成状态卡片。\n- 恢复总数 / 已生成 / 批次进度。\n- 完善暂停、保留、续跑、清空、下载。\n- 输入表格分页细节修正。\n\n### M2：跑批历史大数据化\n\n- 历史摘要列表。\n- 详情分页。\n- 失败项筛选。\n- 完整导出。\n\n### M3：AI 评价安全运行\n\n- 评价范围选择。\n- 成本确认。\n- 分批评价。\n- 停止评价。\n- 部分完成状态。\n\n### M4：AI 评价 API 化\n\n- 评价草稿 API。\n- 评价确认 API。\n- 评价启动 API。\n- 进度 / 停止 / 结果 / 导出 API。\n- 页面对应模块展示 API 入口。\n\n### M5：skill 召唤平台完善\n\n- 中文 skill 文档完善。\n- API 文档完善。\n- 平台服务诊断增强。\n- 示例导入包完善。\n- 与评价草稿 API 打通。\n\n### M6：草稿持久化与诊断体系\n\n- 输入草稿。\n- 续跑草稿。\n- 外部导入草稿。\n- 评价草稿。\n- 结构化错误和诊断报告。\n\n## 15. 优先级总表\n\n| 优先级 | 模块 | 动作 | 价值 |\n| --- | --- | --- | --- |\n| P0 | AI 造数据 | 固定进度状态卡片 | 解决用户不知道生成进度的问题 |\n| P0 | AI 造数据 | 保留 / 丢弃 / 续跑状态机 | 防止中断后数据丢失或错乱 |\n| P0 | AI 造数据 | 清空当前数据并取消续跑草稿 | 防止旧数据幽灵恢复 |\n| P0 | 输入表格 | 分页与完整数据集语义 | 防止 3000 行卡死 |\n| P1 | 跑批历史 | 摘要 + 分页详情 | 支持大批量跑批回看 |\n| P1 | AI 评价 | 成本确认 + 分批评价 | 防止误触发大额裁判调用 |\n| P1 | AI 评价 | 评价历史分页 | 支持大批量评价回看 |\n| P1 | 外部 API | 评价草稿 API | 让 AI 评价可被 skill / agent 调用 |\n| P1 | skill | 字段确认与服务诊断增强 | 提升召唤平台成功率 |\n| P2 | 持久化 | 草稿管理 | 减少刷新和异常导致的数据损失 |\n| P2 | 诊断 | 结构化错误 | 降低排障成本 |\n\n## 16. 最终验收场景\n\n### 场景 A：3000 条 AI 造数据\n\n用户输入需求，选择生成 3000 条。平台按 30 条一批生成，状态卡片显示当前批次、已生成数量、剩余数量。生成到 210 条时用户暂停，选择保留。表格保留 210 条，用户可以下载，也可以继续生成剩余 2790 条。用户点击清空后，表格为空，续跑状态消失。\n\n### 场景 B：外部 skill 召唤平台\n\n用户在 Claude Code / Codex 中提供一份 Excel 和需求。skill 识别字段，展示输入字段、标准答案字段、评价模式和缺失策略预览。用户确认后，skill 生成导入包，调用平台 API，返回真实 open_url。打开链接后，平台已加载数据和评价草稿，但不会自动启动评价。\n\n### 场景 C：标准答案 AI 评价\n\n用户导入带 `gold_answer` 的数据集。平台要求用户确认标准答案字段和评价维度。用户选择评价 100 条样本并确认成本提示。平台分批评价，过程中可停止。停止后已完成结果保存为部分完成记录，可分页查看和导出。\n\n### 场景 D：跑批历史回看\n\n用户对 3000 条数据和 3 个目标执行跑批。历史列表只展示摘要。点击详情后分页查看 9000 条结果，支持筛选失败项，并可导出完整 Excel。\n\n## 17. 风险与注意事项\n\n- 大批量生成不能依赖模型一次性返回完整 JSON。\n- 续跑必须保存真实数据，而不是只保存计数。\n- 清空数据必须同步清空续跑草稿。\n- 外部 API 不能绕过用户确认直接启动高成本任务。\n- 页面分页不能影响下载、跑批、评价读取完整数据。\n- 历史详情必须避免全量渲染。\n- 平台 deep link 只能承载短 ID，不承载完整数据。\n\n## 18. 下一步建议\n\n优先做 M1。因为 AI 造数据是当前最容易被用户直接感知、也最容易出状态错乱的模块。M1 做完后，平台在 3000 条数据生成场景下会明显稳定，后续再继续推进跑批历史、AI 评价外置化和 skill 打通。\n\n", "summary": "测评平台 PRD v4.9：后续优化路线图"}, {"id": "doc-12", "title": "测评平台开发计划.md", "filename": "测评平台开发计划.md", "category": "开发计划", "size": 23378, "updated": "2026-06-06 14:55", "content": "大模型测评平台 开发计划 v2.0\n配套文档：《大模型测评平台 PRD · 最终定稿 v1.2》、《测评平台需求增补 v2 定稿》\n版本说明：v1.0 含 5 项调整（详见第八章）；v2.0 并入需求增补 v2（M8 拆为 M8a/M8b、接入扁平化、M9 增 AI 自动生成 prompt，详见第九章）。第一批卡点 2026-06-02 已通过。\n\n本计划将 PRD 第十章「分两批实施」拆解为可执行的阶段、任务、依赖关系与验收映射，供编程 agent / 开发同学按序推进。原则：先搭骨架，再填核心，最后接 API 与评价；每阶段结束有明确产出与自测点。\n\n一、总体策略\n开发顺序遵循「架构骨架优先」铁律：调用层 / getApiKey / adapter 骨架 / config 必须最先落地，骨架歪了后期难救（PRD 2.2）。\n两大批次：\n  第一批 = 骨架 + 核心数据流 + 输入/运行/结果/导出（不含算法 API 接入与 AI 评价）【2026-06-02 已完成并通过强制卡点】\n  第二批 = 算法 API 接入 + AI 逐条评价；按需求增补 v2 细分为 M8a（接入骨架扁平化 + 混选）→ M8b（AI 解读 API 文档，只透出）→ M9（AI 逐条评价，含 AI 自动生成 prompt）\n每阶段交付后跑一遍对应验收点（PRD 第九章），异常路径同步覆盖。\n贯穿全程的「实现注意事项」（PRD 第十一章）在相关阶段内落实，不留到最后补。\n\n二、里程碑总览\nM0 工程初始化与架构骨架     —— 可启动空壳，调用层/adapter/config 骨架就位\nM1 数据层与持久化            —— IndexedDB 自动存 + JSON 导入导出 + version 校验\nM2 输入区（单条 + 批量）     —— 模式草稿隔离、Excel 模板/导入/可编辑表格\nM3 目标选择与置灰逻辑        —— 大模型多选、含图置灰、base64+仅URL 提示\nM4 运行引擎（并发/试运行/批量）—— 分批、超时、取消、刷新中断\nM5 结果对比区               —— 单条卡片 / 批量表格、实时更新、partial\nM6 Excel 结果导出           —— 列名唯一、图片链接/占位\nM7 历史任务                 —— Task 列表与完整重现\n————————— 第一批完成验收（2026-06-02 已通过）—————————\nM8a 接入骨架（扁平化）+ 混选 —— ApiConfig 扁平化(url+apiKeyRef) / test-api / run-api / 接入表单 / mock 算法 / 大模型+算法混选并排\nM8b AI 解读 API 文档        —— parse-doc 简化版(只透出不回填) / 粘贴框 + 解读结果展示区\nM9 AI 逐条评价              —— gen-eval-prompt(含 AI 自动生成 prompt) / evaluate / 评价范围 / base64 压缩 / 评分列导出\n————————— 第二批完成 / 全量验收 —————————\n\n三、阶段详细任务\n\nM0 工程初始化与架构骨架（含 Walking Skeleton）\n目标：项目可 npm run dev 启动，架构调用层骨架就位，且能硬编码跑通一次真实端到端调用链。\n任务：\n1. Next.js 14（App Router）+ TypeScript 初始化；接入 Tailwind CSS + shadcn/ui。\n2. 安装依赖：dexie、xlsx；规划目录结构：\n   - app/（页面 + api 路由）\n   - components/（UI 组件，按模块拆）\n   - hooks/（业务逻辑）\n   - services/（llmClient.ts、apiClient.ts、db.ts、excel.ts、image.ts）\n   - adapters/（模型 adapter，每模型一个文件）\n   - config/（models.ts、runtime.ts）\n   - lib/（工具函数）\n   - types/（数据模型 interface，照搬 PRD 第三章）\n3. 抽象调用层骨架：\n   - services/llmClient.ts：统一大模型调用入口，内部按 adapter 分发。\n   - services/apiClient.ts：算法 API 调用入口（第二批填充）。\n   - getApiKey(provider)：当前从 .env.local 读，集中一处。\n4. adapter 骨架：定义统一接口，输出归一为 { outputText, outputImages[], latencyMs }。示例 adapter 刻意选两家「调用形态差异大」的厂商各 1 个（例如 OpenAI 兼容协议 + 国内某厂自有协议 / 多模态家），用差异验证抽象层是否真正解耦——若两家能用同一上层流程跑通，抽象才算站得住。\n5. config 集中：config/models.ts（大模型数组）、config/runtime.ts（并发3/上限10/超时60s/body 25MB）。\n6. .env.local.example 提供 key 占位模板（不提交真实 key）。\n7. ★ Walking Skeleton（最重要，消灭架构风险）：打通一条最小但真实的端到端链路——\n   页面输入框（硬编码 prompt 即可）→ /api/chat（真实 Route Handler）→ getApiKey → llmClient → 两家示例 adapter（各真实请求一次）→ 归一化输出 → 页面展示文本/图片 + 耗时。\n   要求：是真实网络调用，不是 mock；两家 adapter 都跑通；这条链路即后续 M4/M5 的运行/展示雏形。\n   作用：在没写任何业务功能前，先证明「调用层 + getApiKey + adapter 归一化 + Route Handler body/超时」整条骨架是对的，避免到 M4 才暴露架构问题。\n依赖：无。\n产出自测：项目启动访问 localhost:3000 正常；硬编码 prompt 经真实链路能拿到两家模型的归一化输出并展示耗时；切换两家 adapter 上层代码零改动。\n注意事项落实：adapter 输出归一化、Key 来源抽象、配置集中（PRD 2.2 / 十一）。\n\nM1 数据层与持久化\n目标：数据可自动持久化，JSON 备份/迁移可用。\n任务：\n1. types/ 落地全部 interface（Project/Task/TaskInput/ResultRow/ResultItem/ApiConfig/ParamDef/Evaluation 等），SCHEMA_VERSION=1。\n2. services/db.ts（dexie）：Project 表 schema；提供 CRUD。\n3. 自动保存：状态变更 debounce 写库（避免频繁 IO，PRD 十一）；捕获写入失败并提示「存储空间不足…」。\n4. JSON 导出：文件名 项目名_YYYYMMDD_HHmm.json。\n5. JSON 导入：version 校验，兼容则还原，不兼容明确提示不强行导入；覆盖前二次确认。\n6. 核心数据原则守护：封装写入工具，确保「值只写 TaskInput，绝不写回 ApiConfig」。\n依赖：M0。\n产出自测：刷新数据不丢；导出再导入完整还原；改 version 触发不兼容提示。\n\nM2 输入区（单条 + 批量）\n目标：两种输入模式可用且草稿互不干扰。\n任务：\n1. 模式切换组件：单条 / 批量。\n2. 模式草稿隔离：单条与批量各自独立草稿，切换不互相清空；切回恢复上次草稿；正式运行只用当前模式数据。\n   ★ 草稿存储定死为 IndexedDB（不用内存/不用 localStorage）：两份草稿（single/batch）持久化在库中，刷新/重开后仍能恢复；与 M1 自动保存共用 db 层，写入同样走 debounce。理由：内存草稿刷新即丢，与「刷新不丢」的产品基线冲突；统一落 IndexedDB 避免两套存储策略。\n3. 单条模式：prompt 文本框；图片 Tab（本地上传 base64 / URL），多张可删；值写入 inputs[0]。\n4. 批量模式：\n   - 下载导入模板：按选中目标所需字段生成空 Excel，列名固定英文 key（prompt、image_url、参数原始 name）。\n   - 导入 Excel → 前端可编辑表格（行查看/编辑/删除），确认再运行；不匹配列提示。\n   - 落位规则：prompt→prompt；image_url→images(source='url')；参数列→extraFields。\n   - 显示条数预览。\n   - Excel 类型转换：按 paramDef.type 强制转换 + 校验，失败行提示（PRD 十一）。\n依赖：M1。\n产出自测：模式切换草稿不丢；模板下载/导入/可编辑表格闭环；非法列与类型错误有提示。\n\nM3 目标选择与置灰逻辑\n目标：可多选目标并正确置灰。\n任务：\n1. 多选组件：大模型 + （第二批）tested_ok 算法 API，支持混合。\n2. 置灰规则：有图时 type:'llm' 置灰；图为 base64 但模型 imageInput='url' → 提示改用 URL 或置灰。\n依赖：M2、M0（models 配置）。\n产出自测：含图与不含图场景下置灰/提示正确。\n\nM4 运行引擎（通用 Task Runner / 试运行 / 批量）\n目标：一个与业务无关的通用并发调度器，稳定可取消、可中断，并为 M9 评价复用铺路。\n任务：\n1. ★ 通用 Task Runner（lib/taskRunner）：抽象成「输入一批异步任务 + 并发上限 → 池化执行 + 排队 + 取消」的通用能力，不耦合「大模型调用」这一具体语义。\n   - 接口约定（示意）：runWithPool({ items, concurrency, signal, runOne, onProgress })，runOne 返回归一化结果，onProgress 逐条回调用于实时更新。\n   - 并发（1~10，默认3，Task.concurrency）：超出排队；M4 用它跑批量模型调用，M9 直接复用它跑评价调用，无需重写并发逻辑。\n   - 单调用超时（默认60s）由 runner 统一封装。\n   理由：批量运行与逐条评价是同一种「受控并发」需求，做成通用 runner 可一处实现两处复用，避免 M9 再造一个并发轮子。\n2. 试运行：仅第1条，临时展示、不落历史，与正式运行隔离勿串台（PRD 十一）。\n3. 批量运行：基于通用 runner 按并发分批执行。\n4. 取消：前端 AbortController 贯通到 runner；已发出请求中断 + 排队未发任务一并清除，状态统一 cancelled/interrupted（PRD 十一）。\n5. 运行中刷新：未完成标 interrupted，提示重跑（不做续传）。\n依赖：M3、M0（llmClient/adapter + walking skeleton 验证过的链路）。\n产出自测：并发分批正确；超时生效；取消清空排队；刷新标 interrupted；runner 与具体调用解耦（用一组纯函数任务即可单测通过）。\n\nM5 结果对比区\n目标：结果实时、清晰、并排对比。\n任务：\n1. 单条：多列卡片并排；批量：表格视图（行可展开）。\n2. 每结果展示：目标名 + 类型标签、状态、输出（文本/图片可放大）、耗时（「1.2s」）、错误。\n3. 实时更新；部分成败 → status=partial 分别标识。\n依赖：M4。\n产出自测：实时更新；partial 标识正确；图片可放大。\n\nM6 Excel 结果导出（仅运行结果，不含评价）\n目标：导出运行结果不丢列、不覆盖。\n任务：\n1. 每行一条输入，每目标占列。★ 本阶段不预留 AI 评分列：M6 只导出运行结果（输出/耗时/错误），评分列由 M9 在评价能力落地时一并扩展导出逻辑。理由：M6 处于第一批、评价在第二批，预留空列会形成跨批次耦合（列定义/列序需提前迁就未实现的评价），不如把「评分列扩展」整体收敛到 M9，第一批导出自成闭环。\n2. 列名唯一性：以 targetId（或唯一展示名）生成，建议 {targetName}#{targetId简写}_输出 / _耗时。\n3. 图片：URL→存链接；base64→占位文字 + 提示「建议用 URL 输出查看」（不打包 zip）。\n4. 文件名：项目名_结果_YYYYMMDD_HHmm.xlsx。\n5. 实现上把「列生成」做成可扩展的列定义结构，便于 M9 在不改动现有列的前提下追加评分列。\n依赖：M5。\n产出自测：重名目标列不覆盖；URL/base64 处理正确；不含任何评价相关空列，第一批导出独立可用。\n\nM7 历史任务\n目标：任务可完整重现。\n任务：\n1. Task 列表（时间倒序）。\n2. 点击完整重现输入/输出/评价；算法 API 入参由 extraFields + apiParamsSnapshot.paramDefs 还原（评价部分第二批补全）。\n依赖：M1~M6。\n产出自测：点击历史完整还原。\n\n===== ★ 第一批完成验收（强制评审卡点 / Gate，未通过不得进入第二批）【2026-06-02 已通过】=====\n性质：硬性卡点。M0~M7 全部完成后必须集中评审 + 压测，通过方可启动 M8a/M8b/M9。\n1. 功能验收：对照 PRD 第九章理想路径与异常路径中第一批相关项逐条过。\n   - 结论：M0~M7 全链路（含 M7 历史任务）经 browser-use 自动化验收通过。\n2. ★ 大数据量压测项（必测，新增）：\n   - 批量 ≥ 1000 条输入、多目标并排，全程运行不卡死、UI 不长时间无响应。\n     - 实测：渲染 1000 行 32ms、滚动后帧响应 3ms；Excel 解析 1000 行 17ms。✅\n   - 大量 base64 图片场景：触及/接近浏览器存储配额时，写入失败被捕获并给出「存储空间不足，建议改用 URL 图片或导出备份」提示，不白屏。\n     - 实测：isQuotaExceededError 覆盖 Chrome/Firefox/message 三形态，捕获分支映射提示文案，所有异常路径不抛出；UI 实测 pageAlive。✅\n   - 大 JSON 导入/导出（含大量 base64）不卡死；IndexedDB 写入走 debounce/批量提交，无频繁 IO 抖动。\n     - 实测：49MB 含 base64 JSON 序列化 113ms、反序列化 54ms，数据完整；写入走 useProject debounce。✅\n   - 通用 Task Runner 在高并发 + 取消混合场景下：取消能中断已发 + 清空排队，状态统一，无任务泄漏/卡死。\n     - 实测：2000 任务并发峰值严格 ≤10、无泄漏 240ms 完成；取消后 970 排队任务 skipped、已发任务中断、状态 100% 统一无 undefined、已完成 fulfilled 不污染。✅\n3. 评审产出：架构骨架（调用层/adapter/runner/db）稳固、npm run build 通过、4 项压测全部达标，第二批已放行。\n\nM8a 接入骨架（扁平化）+ 混选对比\n目标：用户可手动接入一条 API 配置（扁平化，url + key 引用），与内置大模型混选并排对比；mock 算法 API 打通端到端。\n对应需求增补 v2：需求 3 / 4 / 5 + 需求 1（随 ParamDef 自然支持）。\n任务：\n1. 数据模型：ApiConfig 新增 apiKeyRef?（key 环境变量引用名）、targetKind?（'llm' | 'algo'）；值仍只写 TaskInput，定义不存值。\n2. Key 来源扩展：getApiKey(keyRef) → process.env[keyRef]；前端只存引用名，真值在 .env.local，服务端代理注入，绝不落前端。\n3. API：/api/test-api（带诊断）：成功渲染返回、状态 tested_ok；失败展示错误 + 诊断、状态 tested_fail。\n4. API：/api/run-api（纯执行不带诊断），供批量/试运行调用；填充 services/apiClient.ts（algo adapter）。\n5. mock 算法 API：内置一个可用的 mock 算法配置（含 num_images 等 ParamDef 示例），无真实接口也能端到端跑通。\n6. 输出路径校验：outputImagePath 与 outputTextPath 全空时不许标 tested_ok。\n7. 接入表单 UI：手动填写 url / method / headers / apiKeyRef / inputParams（ParamDef）/ 输出路径；列表查看/编辑/删除。\n8. 输入区联动：选中算法 API 自动生成入参表单；type:'image' 参数单条复用图片组件、批量走 URL 列；需求 1 的「生成数量」即一条 number 类型 ParamDef（如 num_images），平台零专用代码。\n9. 目标选择：分两组「内置大模型」+「用户接入的 API」统一勾选；支持大模型与算法混选。\n10. 异构运行：runTargets 按 targetKind 分发 adapter（llm 走 llmClient，algo 走 apiClient），结果区统一并排；并发复用通用 Task Runner。\n11. body 上限：Route Handler 按 App Router 写法放大（建议 25MB，勿照搬 Pages Router，PRD 十一）。\n依赖：第一批全部、M0 调用层、M4 运行引擎、M5 结果区。\n产出自测：建一条 mock 算法配置 → 与大模型混选运行 → 结果并排正确；apiKeyRef 经服务端注入、前端无明文 key；输出路径全空不许 tested_ok；num_images 参数随 ParamDef 生效、结果区多图展示。\n\nM8b AI 解读 API 文档（只透出，不回填）\n目标：粘贴 API 对接文档 → 大模型解读 → 透出结构化接入信息供用户对照手动填表。\n对应需求增补 v2：需求 2（关键调整：只透出展示，不自动写入配置）。\n任务：\n1. API：/api/parse-doc（简化版）：强制结构化输出（function calling 优先，降级 JSON+容错），只返回解读结果用于展示，不回写 ApiConfig。\n2. 解读用大模型：复用现有 DashScope 网关大模型（DeepSeek/Kimi），不额外配 key。\n3. 解读内容：endpoint、鉴权方式、请求/响应结构、参数字段；标注文档偏向「大模型 API」还是「算法 API」+ 建议的 key 引用名。\n4. UI：左侧粘贴框 + 右侧「AI 解读结果」结构化展示区（字段卡片 + 原文高亮）；用户对照解读结果手动填 M8a 的接入表单。\n5. 「一键采纳填入表单」不做（移入 v2 backlog B2）。\n依赖：M8a（接入表单已就绪）、M0 调用层（解读复用大模型）。\n产出自测：粘贴一段 API 文档 → AI 透出结构化接入信息 + 类型/key 引用名建议；解读结果仅展示、不污染配置；用户对照填表后可正常测试/运行。\n\nM9 AI 逐条评价（含 AI 自动生成评价 prompt）\n目标：可选让 AI 评价生成效果，按 inputId 逐条横向评价并打分。\n对应需求增补 v2：需求 6（运行后可选是否评价；选则选裁判模型 + 写 prompt，或让 AI 根据场景自动生成 prompt）。\n任务：\n1. API：/api/gen-eval-prompt（需求 6 增强）：用户描述测评场景/要求 → 调大模型自动生成评价 Prompt → 返回可编辑文案，填入 evalPrompt，用户可再编辑。\n2. API：/api/evaluate（逐条：一次处理一条输入，传入该 inputId 下各目标 ResultItem，横向对比）。\n3. UI：开关「是否让 AI 自评」→ 开启后：填测评需求 →（手填 evalPrompt 或点「AI 自动生成 prompt」）→ 选裁判模型（含图时 type:'llm' 置灰，须 multimodal）。\n4. 评价范围：默认全量；「仅评价选中/可见行」（全选 / 试运行那条 / 手动勾选行）。\n5. 评价并发受 Task.concurrency 管控，复用通用 Task Runner；results 按 inputId 归属。\n6. base64 压缩：canvas 最长边 1024px 压缩后仅传裁判副本，结果区与存储保留原图（PRD 十一）。\n7. 展示：各目标评分（0–10，一位小数）+ 点评、总体结论、推荐项。\n8. ★ Excel 评分列扩展（从 M6 整体移入本阶段）：在 M6 留下的可扩展列定义结构上追加评分/点评/结论/推荐列，不改动 M6 已有运行结果列；评分列同样遵守列名唯一性。理由：评价是第二批能力，导出评分列与评价逻辑同生命周期，集中在 M9 实现，避免第一批为未实现功能预埋列。\n依赖：M8a（混选目标已就绪）、M8b、M4（通用 runner 复用并发）、M5（结果）、M6（可扩展列定义）。\n产出自测：开关控制是否评价；「AI 自动生成 prompt」生成可编辑文案且用户可改；逐条评价按 inputId 归属；裁判模型置灰正确；评价范围选中行只评选中条；base64 传压缩版而原图仍展示；导出含评分列且不破坏 M6 原有列。\n\n===== 第二批完成 / 全量验收（PRD 第九章理想 + 异常全路径）=====\n\n四、关键依赖关系（简图）\nM0 → M1 → M2 → M3 → M4 → M5 → M6 → M7 →（第一批验收）→ M8a → M8b → M9 →（全量验收）\n其中：M3 依赖 M0 的 models 配置；M4 依赖 M0 的 llmClient/adapter；M8a 复用 M2 输入区与 M4 运行引擎、扩展 ApiConfig 扁平化 + 混选；M8b 依赖 M8a 接入表单、复用 M0 大模型做解读；M9 依赖 M8a/M8b/M4/M5/M6。\n\n五、贯穿性技术注意事项（每阶段自查清单，源自 PRD 十一 + 本版调整）\n[ ] 值只写 TaskInput，定义存 apiParamsSnapshot，绝不写回 ApiConfig（单条 inputs 长度=1 同样遵守）。\n[ ] adapter 输出归一 { outputText, outputImages[], latencyMs }；上层无按 modelId 的 if-else（M0 已用两家差异大的 adapter 验证）。\n[ ] 并发统一走通用 Task Runner，M4 批量与 M9 评价复用同一实现，不再造并发轮子。\n[ ] 草稿（single/batch）定死存 IndexedDB，刷新不丢；与自动保存共用 db 层并 debounce。\n[ ] IndexedDB 写入 debounce/批量提交；捕获写入失败并提示。\n[ ] 取消 = 中断已发 + 清空排队，状态统一。\n[ ] 试运行结果隔离，不写历史 Task。\n[ ] Excel 按 paramDef.type 强制转换 + 校验；评分列由 M9 扩展，M6 不预留。\n[ ] base64 压缩只压传裁判副本，原图保留。\n[ ] Next.js 14 App Router body 上限正确写法。\n\n六、明确不做（本期外，PRD 第八章，防止范围蔓延）\n用户登录 / 云数据库 / 云部署、图床上线（仅预留）、批量本地图片、断点续传、JSON 轻量导出、Excel 图片打包 zip、纯前端直连（仅架构预留）。\n注：原「图片生成数量选择」已在需求增补 v2 纳入需求 1（方式 A：走 ParamDef 普通参数），故从本期「不做」中移除；平台级统一控件（方式 B）见 v2 backlog B1。\n\n七、建议提交节奏\n每个里程碑（M0~M7、M8a、M8b、M9）作为一个可独立验证的提交单元。\nM0 骨架阶段务必单独评审：必须先跑通 walking skeleton（两家差异大 adapter 真实端到端），确认调用层/adapter/runner/config 设计合理后再继续——这是消灭架构风险的前置闸门。\n第一批（M0~M7）完成后进入「强制评审卡点」：功能验收 + 大数据量压测全部达标，方可启动第二批（M8a → M8b → M9）。第一批卡点已于 2026-06-02 通过（功能 + 4 项压测全达标），第二批已放行。\n\n八、本版（v1.0 → 含 5 项调整）变更摘要\n1. M0 增加 Walking Skeleton（硬编码跑通一次真实端到端调用链），并将示例 adapter 指定为两家调用形态差异大的厂商，用于实证抽象层解耦——最高优先，消灭架构风险。\n2. Excel 评分列回填整体移到 M9，M6 不再预留评分空列，降低第一批与第二批的跨批次耦合（M6 仅留可扩展列定义结构）。\n3. M4 并发池升级为通用 Task Runner（与业务解耦），M9 评价直接复用，避免重造并发轮子。\n4. 第一批验收升级为强制评审卡点（Gate），新增大数据量压测项（千条批量 / 大量 base64 配额 / 大 JSON / 高并发取消）。\n5. M2 草稿存储定死为 IndexedDB（不用内存）；M0 示例 adapter 明确选两家差异大的厂商。\n\n九、第二批变更摘要（依据《测评平台需求增补 v2 定稿》，2026-06-02）\n1. 原 M8 拆为 M8a（接入骨架扁平化 + 混选对比）与 M8b（AI 解读 API 文档，只透出不回填），降低单步风险。\n2. 接入配置扁平化：一个目标 = 一条独立 ApiConfig（自带 url + apiKeyRef），放弃「单 API 挂多模型」的两层嵌套；ApiConfig 新增 apiKeyRef、targetKind 两字段。\n3. Key 存储延续 .env.local 模式：前端只存引用名，getApiKey(keyRef) → process.env[keyRef]，服务端注入，绝不落前端。\n4. 需求 1「图片生成数量」走 ParamDef 普通参数（方式 A），平台零专用代码；平台级统一控件（方式 B）入 backlog。\n5. M8b 的 /api/parse-doc 简化为「只透出解读结果不回写配置」；「一键采纳填入表单」入 backlog。\n6. M9 增「AI 自动生成评价 prompt」：用户描述场景 → 调模型生成 → 填入 evalPrompt 可再编辑。\n7. backlog 三项（B1 生成数量平台控件 / B2 一键采纳 / B3 复制新增凭证）记录于 v2 定稿，本期不做、均无前置风险。\n8. 第一批卡点已于 2026-06-02 通过，第二批正式放行。\n", "summary": "大模型测评平台 开发计划 v2.0"}, {"id": "doc-13", "title": "测评平台开发计划v3v4.md", "filename": "测评平台开发计划v3v4.md", "category": "开发计划", "size": 14065, "updated": "2026-06-06 14:55", "content": "# 测评平台开发计划（v3 + v4 并集 · 改造演进版）\n\n\u003e 依据：`测评平台需求文档v3.md` + `测评平台需求文档v4.md`，取并集，**凡 v4 推翻 v3 的以 v4 为准**，其余全部纳入。\n\u003e 策略：**在现有 v1.2 代码基础上改造演进**，复用能复用的，逐步迁移到 v4 统一架构。\n\u003e 本文件只产出计划，不写代码。最后更新：2026-06-04\n\n---\n\n## 0. 总体目标与最终形态\n\n把现有 v1.2 实现，演进为 v4 的「统一接入」架构，并补齐 v3 引入的内容/生图模式、4 板块导航、ComfyUI、AI 造数据等能力。\n\n**v4 相对 v3 的关键覆盖（计划以 v4 为准）：**\n- 目标类型：v3 五种（ll
